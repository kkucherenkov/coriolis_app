# Release deployment — pulls pre-built images from a container registry.
#
# Usage:
#   1. Download the artefacts attached to the Forgejo release:
#        compose-release-vX.Y.Z.yml  (this file, with RELEASE_TAG pinned)
#        .env.release.example
#        nginx-prod.conf
#   2. Copy the env example to `.env` and fill the required values.
#   3. Pull + start:
#        docker compose --env-file .env -f compose-release-vX.Y.Z.yml pull
#        docker compose --env-file .env -f compose-release-vX.Y.Z.yml up -d
#
# RELEASE_TAG defaults to `latest` when this file is committed; the release
# workflow (T-009b) renders a per-tag copy where it points at the exact
# semver (e.g. 0.1.0) and uploads that as a release asset.
#
# Layout: backend + web are pulled from REGISTRY/REGISTRY_NAMESPACE.
# centrifugo + proxy run upstream images directly (centrifugo/centrifugo:v6
# and nginxinc/nginx-unprivileged); centrifugo is configured via
# CENTRIFUGO_* env vars; proxy bind-mounts ./nginx-prod.conf from the
# release bundle.

name: "coriolis-release"

networks:
  cor-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-coriolis}"
      POSTGRES_USER: "${POSTGRES_USER:-coriolis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coriolis} -d ${POSTGRES_DB:-coriolis}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cor-net]

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cor-net]

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    environment:
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${PUBLIC_BASE_URL}"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}"
      CENTRIFUGO_HTTP_API_KEY: "${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}"
      CENTRIFUGO_ADMIN_ENABLED: "false"
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_LOG_LEVEL: "${CENTRIFUGO_LOG_LEVEL:-info}"
      # Application contract: hardcoded namespaces, NOT in operator's .env.
      # Mirrors docker/centrifugo/config.json — `system` carries broadcast
      # notifications, `session` carries per-game-session DP / roll-pushed
      # snapshots.
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"system","presence":true,"history_size":10,"history_ttl":"60s"},{"name":"session","presence":false,"history_size":100,"history_ttl":"300s"}]'
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cor-net]

  backend:
    image: "${REGISTRY:-ghcr.io}/${REGISTRY_NAMESPACE:-kkucherenkov}/coriolis-backend:${RELEASE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      centrifugo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-coriolis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coriolis}"
      REDIS_URL: "redis://redis:6379/0"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required (openssl rand -hex 32)}"
      BETTER_AUTH_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (e.g. https://coriolis.example.com)}"
      BETTER_AUTH_BASE_PATH: /api/v1/auth
      AUTH_SELF_REGISTRATION: "${AUTH_SELF_REGISTRATION:-false}"
      AUTH_EMAIL_VERIFICATION: "${AUTH_EMAIL_VERIFICATION:-false}"
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: "${CENTRIFUGO_API_KEY}"
      CENTRIFUGO_TOKEN_HMAC_SECRET: "${CENTRIFUGO_TOKEN_HMAC_SECRET}"
      CENTRIFUGO_TOKEN_TTL_SECONDS: "${CENTRIFUGO_TOKEN_TTL_SECONDS:-300}"
      CORS_ORIGINS: "${PUBLIC_BASE_URL}"
      # Optional — leave blank to disable. The mailer adapter picks itself
      # by MAILER_PROVIDER (`mock` | `resend`); in production it defaults
      # to `resend` and needs RESEND_API_KEY when invoked.
      MAILER_PROVIDER: "${MAILER_PROVIDER:-mock}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAILER_FROM_ADDRESS: "${MAILER_FROM_ADDRESS:-Coriolis Companion <noreply@coriolis-companion.app>}"
      # Optional — observability sinks. Leave blank to disable each
      # individually. The backend AppConfig treats blanks as opt-out.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- --server-response http://127.0.0.1:3000/api/v1/health 2>&1 | grep -E 'HTTP/1\.[01] (200|503)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [cor-net]

  web:
    image: "${REGISTRY:-ghcr.io}/${REGISTRY_NAMESPACE:-kkucherenkov}/coriolis-web:${RELEASE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
    environment:
      APP_API_BASE_URL: "${PUBLIC_BASE_URL}/api/v1"
      APP_AUTH_BASE_URL: "${PUBLIC_BASE_URL}"
      APP_REALTIME_WS_URL: "${PUBLIC_BASE_URL}/centrifugo/connection/websocket"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_app-config.js"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [cor-net]

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
      web: { condition: service_started }
    volumes:
      # Bind-mount the prod nginx config from the release bundle.
      # The release workflow stages compose.yml + nginx-prod.conf side
      # by side in STAGE/, so this relative path resolves whether you
      # run the rendered compose from the workflow or from an extracted
      # release bundle.
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [cor-net]
