include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by `drift_dev schema generate`. Drift's emitted code uses
    # `TableInfo<Table, dynamic>` raw types which conflict with our strict-
    # raw-types rule. Regenerated via `dart run drift_dev schema generate
    # drift_schemas test/shared/cache/generated`.
    - test/shared/cache/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - always_use_package_imports
