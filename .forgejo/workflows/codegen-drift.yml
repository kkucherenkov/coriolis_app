name: Codegen drift guard

# Path-filtered: Flutter setup is heavy (~60 s install + cache miss), so the
# job only runs on PRs / pushes that touch the spec sources or this workflow
# itself. The CI `checks` job covers everything else.

on:
  push:
    branches: [main]
    paths:
      - "packages/specs/**"
      - "packages/api-client-ts/**"
      - "packages/api-client-dart/**"
      - ".forgejo/workflows/codegen-drift.yml"
  pull_request:
    paths:
      - "packages/specs/**"
      - "packages/api-client-ts/**"
      - "packages/api-client-dart/**"
      - ".forgejo/workflows/codegen-drift.yml"

concurrency:
  group: codegen-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  FLUTTER_VERSION: "3.41.0"

jobs:
  drift:
    name: Regenerate clients and fail on diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Full URL — code.forgejo.org doesn't mirror subosito/flutter-action.
      # The act_runner falls back to the explicit https:// host instead of
      # default-actions-url for refs that include a scheme.
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # openapi-generator-cli (used to emit the dart-dio client) shells out
      # to `java -jar`; the catthehacker/ubuntu:act-22.04 runner image
      # ships without a JRE, so install one before codegen.
      - name: Install Java (openapi-generator-cli runtime)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends default-jre-headless
          java -version

      - name: Regenerate clients
        run: pnpm spec:codegen

      - name: Fail if generated clients drifted from committed sources
        run: |
          git diff --exit-code -- packages/api-client-ts packages/api-client-dart \
            || (echo '::error::Generated clients are out of date. Run `pnpm spec:codegen` locally and commit the diff.' && exit 1)
