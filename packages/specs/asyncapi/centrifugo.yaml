asyncapi: 3.1.0
info:
  title: App Realtime API
  version: 0.13.0
  description: |
    Real-time channels delivered via Centrifugo. Clients connect with a
    short-lived JWT issued by the backend (`POST /api/v1/realtime/token`)
    and subscribe to allowed channels.

    ## JWT subscription scoping

    The connection JWT carries a `channels` claim that restricts which
    channels a token may subscribe to.

    Tokens have a 5-minute TTL; clients must refresh before expiry using
    `POST /api/v1/realtime/token`.

    ## Connection info — presence wiring

    The connection JWT also carries an `info` claim shaped as
    `RealtimeConnectInfo`. Centrifugo propagates this verbatim into the
    `connInfo` field of every presence / join / leave event for every
    channel the connection subscribes to.

    Clients use `info.memberships` to map a presence entry to the
    membershipId in the session they are looking at — see the
    `sessionChannel` description for the consumer-side wiring.
defaultContentType: application/json
servers:
  centrifugo:
    host: localhost:8000
    pathname: /connection/websocket
    protocol: ws
    description: Local Centrifugo instance
    security:
      - $ref: "#/components/securitySchemes/connectionJwt"
channels:
  systemHealth:
    address: system:health
    messages:
      healthUpdate:
        $ref: "#/components/messages/HealthUpdate"
    description: Broadcast of service health transitions (ok <-> degraded <-> down).

  sessionChannel:
    address: "session.{gameSessionId}"
    parameters:
      gameSessionId:
        description: GameSession id.
        location: $message.payload#/gameSessionId
    messages:
      dpChanged:
        $ref: "#/components/messages/DpChanged"
      rollPushed:
        $ref: "#/components/messages/RollPushed"
      combatUpdated:
        $ref: "#/components/messages/CombatUpdated"
    description: |
      Per-session realtime channel. Subscribers: the session GM and any
      players whose characters are linked to this session. Server publishes
      DP / encounter / combatant updates here.

      The combat.updated payload mirrors the OpenAPI `Encounter` schema plus
      the snapshotted combatants array — clients re-render from the full
      snapshot rather than computing diffs.

      ## Presence

      The Centrifugo `session` namespace has `presence`, `join_leave`, and
      `force_push_join_leave` enabled. Clients reach the presence map via
      `subscription.presence()` and listen to `subscription.on('join'|'leave')`.
      Each presence entry carries `connInfo` shaped as `RealtimeConnectInfo`
      (see `#/components/schemas/RealtimeConnectInfo`).

      Consumers filter `connInfo.memberships` by the current `gameSessionId`
      to derive the `membershipId` for an "online" presence dot on the chat
      tab strip (web + mobile). A member is considered online if at least one
      client_id with their `membershipId` is present on this channel.

  sessionChatChannel:
    address: "session.{gameSessionId}.chat"
    parameters:
      gameSessionId:
        description: GameSession id.
        location: $message.payload#/gameSessionId
    messages:
      chatMessagePosted:
        $ref: "#/components/messages/ChatMessagePosted"
      chatMessageEdited:
        $ref: "#/components/messages/ChatMessageEdited"
      chatMessageDeleted:
        $ref: "#/components/messages/ChatMessageDeleted"
    description: |
      Per-session broadcast chat channel. All active session members subscribe.
      Only broadcast messages (targetMembershipId=null) are published here.
      Whispers are routed exclusively to the per-member channel.

  sessionMemberChannel:
    address: "session.{gameSessionId}.member.{membershipId}"
    parameters:
      gameSessionId:
        description: GameSession id.
        location: $message.payload#/gameSessionId
      membershipId:
        description: GameSessionMembership id.
        location: $message.payload#/membershipId
    messages:
      chatMessagePosted:
        $ref: "#/components/messages/ChatMessagePosted"
      chatMessageEdited:
        $ref: "#/components/messages/ChatMessageEdited"
      chatMessageDeleted:
        $ref: "#/components/messages/ChatMessageDeleted"
    description: |
      Per-member private channel. Each session member subscribes only to their
      own member channel. Whisper messages are published here for the author
      and for the target (two publish calls). The channel is also used for
      future per-member notifications (read receipts, typing indicators, etc.).

operations:
  receiveHealthUpdate:
    action: receive
    channel:
      $ref: "#/channels/systemHealth"
    summary: Listen for backend-pushed health status changes
    messages:
      - $ref: "#/channels/systemHealth/messages/healthUpdate"

  receiveDpChanged:
    action: receive
    channel:
      $ref: "#/channels/sessionChannel"
    summary: Listen for Darkness Point counter updates in a session
    messages:
      - $ref: "#/channels/sessionChannel/messages/dpChanged"

  receiveRollPushed:
    action: receive
    channel:
      $ref: "#/channels/sessionChannel"
    summary: Listen for roll-push events in a session
    messages:
      - $ref: "#/channels/sessionChannel/messages/rollPushed"

  receiveCombatUpdated:
    action: receive
    channel:
      $ref: "#/channels/sessionChannel"
    summary: Listen for combat state snapshots in a session
    messages:
      - $ref: "#/channels/sessionChannel/messages/combatUpdated"

components:
  messages:
    HealthUpdate:
      name: HealthUpdate
      contentType: application/json
      payload:
        $ref: "#/components/schemas/HealthUpdate"

    DpChanged:
      name: dp.changed
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DpChanged"

    RollPushed:
      name: roll.pushed
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RollPushed"

    ChatMessagePosted:
      name: chat.message.posted
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RealtimeChatMessage"

    ChatMessageEdited:
      name: chat.message.edited
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RealtimeChatMessage"

    ChatMessageDeleted:
      name: chat.message.deleted
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RealtimeChatMessageDeleted"

    CombatUpdated:
      name: combat.updated
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CombatUpdated"

  schemas:
    HealthUpdate:
      type: object
      required: [status, changedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        changedAt:
          type: string
          format: date-time
        reason:
          type: string

    DpChanged:
      type: object
      required: [gameSessionId, dpCount, delta, source]
      properties:
        gameSessionId:
          type: string
        dpCount:
          type: integer
          minimum: 0
        delta:
          type: integer
        source:
          type: string
          enum: [gm-manual, roll-push, system]
        at:
          type: string
          format: date-time

    RollPushed:
      type: object
      required: [rollId, characterId, kind, hits]
      properties:
        rollId:
          type: string
        characterId:
          type: string
        gameSessionId:
          type: string
          nullable: true
        kind:
          type: string
          enum: [skill, save, trauma, initiative, darkness]
          description: |
            Roll kind discriminator mirroring the OpenAPI `RollKind` enum
            (added in T-2026-05-10-015). Always `skill` for push events
            because only skill rolls can be pushed per ST3001 ГЛАВА 3
            §«Вознесение молитв»; included for client completeness.
        hits:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time

    CombatUpdated:
      type: object
      description: |
        Full Encounter snapshot pushed on every combat state change (combatant
        added/removed, initiative rolled, turn advanced, encounter status
        changed). Lazy-snapshot approach: clients re-render from this payload
        rather than computing diffs against prior state. Payload size is small
        in practice — a typical encounter has fewer than 20 combatants — so
        diffing complexity is not warranted.
      required: [gameSessionId, encounterId, encounter, combatants, at]
      properties:
        gameSessionId:
          type: string
          description: The session that owns this encounter.
        encounterId:
          type: string
          description: Stable identifier for the encounter.
        encounter:
          type: object
          description: |
            Encounter snapshot mirroring the OpenAPI `Encounter` schema.
          required:
            [id, gameSessionId, name, status, round, activeCombatantId, createdAt, updatedAt]
          properties:
            id:
              type: string
            gameSessionId:
              type: string
            name:
              type: string
            status:
              type: string
              description: "setup | active | ended"
            round:
              type: integer
              minimum: 0
            activeCombatantId:
              type: string
              nullable: true
            notes:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        combatants:
          type: array
          description: Full combatant list in current turn order (turnOrder ascending).
          items:
            type: object
            required:
              [id, encounterId, combatantType, name, initiative, turnOrder, hpCurrent, hpMax]
            properties:
              id:
                type: string
              encounterId:
                type: string
              combatantType:
                type: string
                description: "pc | npc"
              referenceId:
                type: string
                nullable: true
                description: Character or NPC id this combatant was created from.
              name:
                type: string
              initiative:
                type: integer
                minimum: 1
                maximum: 10
                nullable: true
                description: |
                  Combat initiative value — d6 base roll (1..6) plus
                  per-weapon modifiers (ГЛАВА 6 «Инициатива» column) and
                  situational bonuses (ГЛАВА 5 §«Повышение инициативы»).
                  Range 1..10 mirrors OpenAPI `Combatant.initiative`.
                  Null until the encounter's initiative is rolled.
              turnOrder:
                type: integer
                minimum: 0
                nullable: true
              hpCurrent:
                type: integer
                minimum: 0
              hpMax:
                type: integer
                minimum: 1
              statusFlags:
                type: array
                items:
                  type: string
                description: |
                  Free-form `string[]` mirror of `Combatant.statusFlags` from
                  the OpenAPI schema. Canonical tags from ST3001 ГЛАВА 5
                  «Раунды, ходы и инициатива» are `incapacitated`, `prone`,
                  `covered`; custom GM tags are allowed and pass through
                  unchanged.
        at:
          type: string
          format: date-time
          description: Server timestamp when this snapshot was emitted.

    RealtimeChatMessage:
      type: object
      description: |
        Chat message payload mirroring the OpenAPI `ChatMessage` schema (OpenAPI 1.9.0).
        Named with the `Realtime` prefix to avoid colliding with the SDK type when
        re-exported from `@app/api-client-ts`. Keep in sync when either schema changes.
      required: [id, gameSessionId, authorMembershipId, targetMembershipId, kind, createdAt]
      properties:
        id:
          type: string
        gameSessionId:
          type: string
        authorMembershipId:
          type: ["string", "null"]
          description: "GameSessionMembership.id; null for system messages"
        authorDisplayName:
          type: ["string", "null"]
          description: Denormalised at read time
        targetMembershipId:
          type: ["string", "null"]
          description: "null = broadcast; non-null = whisper"
        kind:
          type: string
          enum: [text, system]
        body:
          type: ["string", "null"]
          description: "null for kind=system; non-empty trimmed text for kind=text"
        systemKey:
          type: ["string", "null"]
          description: "i18n key for kind=system, e.g. chat.system.member_joined"
        systemParams:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: ["string", "null"]
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time

    RealtimeChatMessageDeleted:
      type: object
      required: [id, gameSessionId, deletedAt]
      properties:
        id:
          type: string
        gameSessionId:
          type: string
        targetMembershipId:
          type: ["string", "null"]
        deletedAt:
          type: string
          format: date-time

    RealtimeConnectInfo:
      type: object
      description: |
        Shape of the connection JWT `info` claim. Centrifugo propagates this
        verbatim to other subscribers via the `connInfo` field on presence /
        join / leave events for every channel the connection subscribes to.

        Frontend clients filter `memberships` by the current `gameSessionId`
        to map a presence entry to its membershipId — the basis for the
        AppChatTab presence dot (Phase 8.5 follow-up #6).
      required: [memberships]
      properties:
        memberships:
          type: array
          description: |
            One entry per active membership (role = gm OR player,
            leftAt IS NULL) the user has at token-issue time. Mirrors the
            `session.<gameSessionId>` channel allow-list and is empty when
            the user has no active memberships.
          items:
            type: object
            required: [gameSessionId, membershipId]
            properties:
              gameSessionId:
                type: string
              membershipId:
                type: string

  securitySchemes:
    connectionJwt:
      type: httpApiKey
      in: query
      name: cf_token
      description: Short-lived JWT signed by backend with Centrifugo HMAC secret.
