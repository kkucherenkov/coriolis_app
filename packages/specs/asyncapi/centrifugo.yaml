asyncapi: 3.1.0
info:
  title: App Realtime API
  version: 0.9.0
  description: |
    Real-time channels delivered via Centrifugo. Clients connect with a
    short-lived JWT issued by the backend (`POST /api/v1/realtime/token`)
    and subscribe to allowed channels.

    ## JWT subscription scoping

    The connection JWT carries a `channels` claim that restricts which
    channels a token may subscribe to.

    Tokens have a 5-minute TTL; clients must refresh before expiry using
    `POST /api/v1/realtime/token`.
defaultContentType: application/json
servers:
  centrifugo:
    host: localhost:8000
    pathname: /connection/websocket
    protocol: ws
    description: Local Centrifugo instance
    security:
      - $ref: "#/components/securitySchemes/connectionJwt"
channels:
  systemHealth:
    address: system:health
    messages:
      healthUpdate:
        $ref: "#/components/messages/HealthUpdate"
    description: Broadcast of service health transitions (ok <-> degraded <-> down).

  sessionChannel:
    address: "session.{gameSessionId}"
    parameters:
      gameSessionId:
        description: GameSession id.
        location: $message.payload#/gameSessionId
    messages:
      dpChanged:
        $ref: "#/components/messages/DpChanged"
      rollPushed:
        $ref: "#/components/messages/RollPushed"
      combatUpdated:
        $ref: "#/components/messages/CombatUpdated"
    description: |
      Per-session realtime channel. Subscribers: the session GM and any
      players whose characters are linked to this session. Server publishes
      DP / encounter / combatant updates here.

      The combat.updated payload mirrors the OpenAPI `Encounter` schema plus
      the snapshotted combatants array — clients re-render from the full
      snapshot rather than computing diffs.

operations:
  receiveHealthUpdate:
    action: receive
    channel:
      $ref: "#/channels/systemHealth"
    summary: Listen for backend-pushed health status changes
    messages:
      - $ref: "#/channels/systemHealth/messages/healthUpdate"

  receiveDpChanged:
    action: receive
    channel:
      $ref: "#/channels/sessionChannel"
    summary: Listen for Darkness Point counter updates in a session
    messages:
      - $ref: "#/channels/sessionChannel/messages/dpChanged"

  receiveRollPushed:
    action: receive
    channel:
      $ref: "#/channels/sessionChannel"
    summary: Listen for roll-push events in a session
    messages:
      - $ref: "#/channels/sessionChannel/messages/rollPushed"

  receiveCombatUpdated:
    action: receive
    channel:
      $ref: "#/channels/sessionChannel"
    summary: Listen for combat state snapshots in a session
    messages:
      - $ref: "#/channels/sessionChannel/messages/combatUpdated"

components:
  messages:
    HealthUpdate:
      name: HealthUpdate
      contentType: application/json
      payload:
        $ref: "#/components/schemas/HealthUpdate"

    DpChanged:
      name: dp.changed
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DpChanged"

    RollPushed:
      name: roll.pushed
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RollPushed"

    CombatUpdated:
      name: combat.updated
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CombatUpdated"

  schemas:
    HealthUpdate:
      type: object
      required: [status, changedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        changedAt:
          type: string
          format: date-time
        reason:
          type: string

    DpChanged:
      type: object
      required: [gameSessionId, dpCount, delta, source]
      properties:
        gameSessionId:
          type: string
        dpCount:
          type: integer
          minimum: 0
        delta:
          type: integer
        source:
          type: string
          enum: [gm-manual, roll-push, system]
        at:
          type: string
          format: date-time

    RollPushed:
      type: object
      required: [rollId, characterId, hits]
      properties:
        rollId:
          type: string
        characterId:
          type: string
        gameSessionId:
          type: string
          nullable: true
        hits:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time

    CombatUpdated:
      type: object
      description: |
        Full Encounter snapshot pushed on every combat state change (combatant
        added/removed, initiative rolled, turn advanced, encounter status
        changed). Lazy-snapshot approach: clients re-render from this payload
        rather than computing diffs against prior state. Payload size is small
        in practice — a typical encounter has fewer than 20 combatants — so
        diffing complexity is not warranted.
      required: [gameSessionId, encounterId, encounter, combatants, at]
      properties:
        gameSessionId:
          type: string
          description: The session that owns this encounter.
        encounterId:
          type: string
          description: Stable identifier for the encounter.
        encounter:
          type: object
          description: |
            Encounter snapshot mirroring the OpenAPI `Encounter` schema.
          required: [id, gameSessionId, name, status, round, activeCombatantId, createdAt, updatedAt]
          properties:
            id:
              type: string
            gameSessionId:
              type: string
            name:
              type: string
            status:
              type: string
              description: "setup | active | ended"
            round:
              type: integer
              minimum: 0
            activeCombatantId:
              type: string
              nullable: true
            notes:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        combatants:
          type: array
          description: Full combatant list in current turn order (turnOrder ascending).
          items:
            type: object
            required: [id, encounterId, combatantType, name, initiative, turnOrder, hpCurrent, hpMax]
            properties:
              id:
                type: string
              encounterId:
                type: string
              combatantType:
                type: string
                description: "pc | npc"
              referenceId:
                type: string
                nullable: true
                description: Character or NPC id this combatant was created from.
              name:
                type: string
              initiative:
                type: integer
                minimum: 1
                maximum: 10
                nullable: true
              turnOrder:
                type: integer
                minimum: 0
                nullable: true
              hpCurrent:
                type: integer
                minimum: 0
              hpMax:
                type: integer
                minimum: 1
              statusFlags:
                type: array
                items:
                  type: string
                description: "Well-known values: broken, exposed, covered, prone."
        at:
          type: string
          format: date-time
          description: Server timestamp when this snapshot was emitted.

  securitySchemes:
    connectionJwt:
      type: httpApiKey
      in: query
      name: cf_token
      description: Short-lived JWT signed by backend with Centrifugo HMAC secret.
