  /api/v1/characters/{id}/talents:
    post:
      operationId: addCharacterTalent
      summary: Add a talent to a character
      description: |
        Creates a talent record attached to the character. Talents are
        free-form (name + description + rank); there is no server-side
        talent library in v1.

        `kind` defaults to `personal`. Each character can have at most
        one talent of each non-`personal` kind (`crew`, `iconGift`,
        `stigma`); a duplicate non-personal kind is rejected with 400
        `TALENT_KIND_DUPLICATE`. A `kind: stigma` talent on a
        non-mutant character is rejected with 400
        `STIGMA_REQUIRES_MUTANT`.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentCreate"
            examples:
              addTalent:
                value:
                  kind: personal
                  name: Wing-Mate
                  description: Re-roll one die when assisting a fellow pilot.
                  rank: 2
      responses:
        "201":
          description: Talent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Talent"
              examples:
                created:
                  value:
                    id: cuid_tal02
                    kind: personal
                    name: Wing-Mate
                    description: Re-roll one die when assisting a fellow pilot.
                    rank: 2
                    acquiredAt: "2026-05-08T10:30:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `CHARACTER_NAME_EMPTY` — talent name is an empty string.
            - `TALENT_KIND_DUPLICATE` — character already has a talent
              of this non-`personal` kind (e.g. trying to add a second
              `iconGift`).
            - `STIGMA_REQUIRES_MUTANT` — `kind: stigma` may only be
              added to a character with `mutant=true`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                nameEmpty:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: Talent name must not be empty
                    instance: /api/v1/characters/cuid_tariq01/talents
                    code: CHARACTER_NAME_EMPTY
                kindDuplicate:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: Character already has a talent of kind iconGift
                    instance: /api/v1/characters/cuid_tariq01/talents
                    code: TALENT_KIND_DUPLICATE
                stigmaRequiresMutant:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: A stigma talent may only be added to a mutant character
                    instance: /api/v1/characters/cuid_tariq01/talents
                    code: STIGMA_REQUIRES_MUTANT
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this character
                    instance: /api/v1/characters/cuid_tariq01/talents
                    code: CHARACTER_NOT_OWNED
        "404":
          description: Character not found
          content:
            application/problem+json:
