  /api/v1/encounters/{id}:
    get:
      operationId: getEncounter
      summary: Get an encounter by ID
      description: |
        Returns the full encounter DTO. The encounter's parent game session
        must be owned by the authenticated user — the server checks
        `encounter.gameSession.ownerId === caller.id`. Returns 404 if the
        encounter does not exist or 403 if the caller does not own the
        parent session.
      tags: [encounters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "200":
          description: Encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
              examples:
                setup:
                  value:
                    id: cuid_enc01
                    gameSessionId: cuid_gs01
                    name: Ambush in the Bazaar
                    status: setup
                    round: 0
                    activeCombatantId: null
                    notes: "Use the **Surprise** rule (ST3001 p.147)."
                    createdAt: "2026-05-10T09:00:00Z"
                    updatedAt: "2026-05-10T09:00:00Z"
                active:
                  value:
                    id: cuid_enc01
                    gameSessionId: cuid_gs01
                    name: Ambush in the Bazaar
                    status: active
                    round: 1
                    activeCombatantId: cuid_comb01
                    notes: null
                    createdAt: "2026-05-10T09:00:00Z"
                    updatedAt: "2026-05-10T09:15:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the parent game session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own the game session for this encounter
                    instance: /api/v1/encounters/cuid_enc01
                    code: GAME_SESSION_NOT_OWNER
        "404":
          description: Encounter not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Encounter cuid_enc01 does not exist
                    instance: /api/v1/encounters/cuid_enc01
                    code: ENCOUNTER_NOT_FOUND

    patch:
      operationId: updateEncounter
      summary: Update an encounter
      description: |
        Applies PATCH semantics to an encounter. All fields are optional.

        **Allowed status transitions:**
        - `setup → active` — starts combat. Bumps `round` to 1, sets
          `activeCombatantId` to the first combatant in initiative order.
          **Requires at least one combatant** on the encounter; if the
          encounter has zero combatants the server returns 422
          `ENCOUNTER_NO_COMBATANTS` (combatants are added via the Block 3
          surface at `POST /api/v1/encounters/{id}/combatants`).
        - `active → ended` — closes combat. The encounter becomes
          read-only history; `activeCombatantId` is set to null.

        **Forbidden transitions** (422 `ENCOUNTER_INVALID_TRANSITION`):
        - Any transition back to `setup` from `active` or `ended`.
        - `setup → ended` (must go through `active` first).
        - Any transition out of `ended`.

        Renaming and notes editing are permitted regardless of status.
      tags: [encounters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EncounterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncounterUpdate"
            examples:
              rename:
                value:
                  name: Ambush in the Bazaar — Act II
              startCombat:
                value:
                  status: active
              addNotes:
                value:
                  notes: "Round 2: the lights go out."
              endCombat:
                value:
                  status: ended
      responses:
        "200":
          description: Updated encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
              examples:
                startedCombat:
                  value:
                    id: cuid_enc01
                    gameSessionId: cuid_gs01
                    name: Ambush in the Bazaar
                    status: active
                    round: 1
                    activeCombatantId: cuid_comb01
                    notes: null
                    createdAt: "2026-05-10T09:00:00Z"
                    updatedAt: "2026-05-10T09:15:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the parent game session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own the game session for this encounter
                    instance: /api/v1/encounters/cuid_enc01
                    code: GAME_SESSION_NOT_OWNER
        "404":
          description: Encounter not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Encounter cuid_enc01 does not exist
                    instance: /api/v1/encounters/cuid_enc01
                    code: ENCOUNTER_NOT_FOUND
        "422":
          description: |
            State-machine violation. Possible codes:
            - `ENCOUNTER_INVALID_TRANSITION` — the requested `status` value
              is not reachable from the current status. Illegal moves:
              any → `setup`, `setup → ended`, any → `active` from `ended`,
              any → `ended` from `ended`.
            - `ENCOUNTER_NO_COMBATANTS` — attempted `setup → active`
              transition but the encounter has zero combatants. Add at
              least one combatant first (Block 3 surface).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidTransition:
                  value:
                    type: https://coriolis.example.com/problems/unprocessable-entity
                    title: Invalid status transition
                    status: 422
                    detail: "Cannot transition encounter from 'active' to 'setup'. Allowed: active → ended."
                    instance: /api/v1/encounters/cuid_enc01
                    code: ENCOUNTER_INVALID_TRANSITION
                noCombatants:
                  value:
                    type: https://coriolis.example.com/problems/unprocessable-entity
                    title: No combatants
                    status: 422
                    detail: >-
                      Cannot start combat with zero combatants. Add at least one
                      combatant before transitioning to active.
                    instance: /api/v1/encounters/cuid_enc01
                    code: ENCOUNTER_NO_COMBATANTS

    delete:
      operationId: deleteEncounter
      summary: Delete an encounter
      description: |
        Permanently deletes an encounter and cascades to all of its
        combatants (Block 3 schema). The encounter's parent game session
        must be owned by the authenticated user.
      tags: [encounters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "204":
          description: Encounter deleted
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the parent game session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own the game session for this encounter
                    instance: /api/v1/encounters/cuid_enc01
                    code: GAME_SESSION_NOT_OWNER
        "404":
          description: Encounter not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
