  # ---------------------------------------------------------------------------
  # Darkness Points (Epic 7 Feature 7.3)
  # ---------------------------------------------------------------------------

  /api/v1/game-sessions/{id}/dp:
    post:
      operationId: adjustDp
      summary: Adjust Darkness Points for a game session
      description: |
        Atomically adjusts the Darkness Points counter for the session.

        **ACL rules:**
        - Negative `delta`: only the GM who owns the session may apply.
        - Positive `delta`: the GM owner may apply; the system applies
          automatically via the roll-push pipeline.

        **Error codes:**
        - `DP_INVALID_DELTA` (422) — `delta` is 0.
        - `DP_BELOW_ZERO` (422) — applying `delta` would take `dpCount` below 0.
        - `GAME_SESSION_NOT_OWNER` (403) — negative delta from non-owner.
      tags: [game-sessions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GameSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DpAdjustment"
            examples:
              addOne:
                value:
                  delta: 1
                  reason: Roll pushed by player
              removeThree:
                value:
                  delta: -3
                  reason: GM fudge
      responses:
        "200":
          description: Updated game session with new dpCount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
              examples:
                ok:
                  value:
                    id: cuid_gs01
                    ownerId: cuid_user01
                    name: The Long Night
                    description: null
                    status: active
                    dpCount: 4
                    characterIds: []
                    shipId: null
                    createdAt: "2026-05-08T10:00:00Z"
                    updatedAt: "2026-05-09T10:00:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this session (negative delta only)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Game session not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Validation error. Possible codes:
            - `DP_INVALID_DELTA` — delta is 0.
            - `DP_BELOW_ZERO` — would result in a negative dpCount.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

