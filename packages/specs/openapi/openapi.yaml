  # ---------------------------------------------------------------------------
  # Game Sessions (Epic 7 Feature 7.2)
  # ---------------------------------------------------------------------------

  /api/v1/game-sessions:
    get:
      operationId: listGameSessions
      summary: List the authenticated GM's game sessions
      description: |
        Returns a cursor-paginated list of game sessions owned by the
        authenticated user. Pass `cursor` from a previous response's
        `nextCursor` to retrieve the following page. Results are ordered
        newest-first by `createdAt`. Optionally filter by `status`.
      tags: [game-sessions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by the previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of sessions to return (1–100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Filter sessions by status
          schema:
            $ref: "#/components/schemas/GameSessionStatus"
      responses:
        "200":
          description: Paginated game session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionList"
              examples:
                ok:
                  value:
                    items:
                      - id: cuid_gs01
                        ownerId: cuid_user01
                        name: The Long Night
                        description: A campaign set in the Kua system.
                        status: active
                        dpCount: 0
                        characterIds: []
                        shipId: null
                        createdAt: "2026-05-08T10:00:00Z"
                        updatedAt: "2026-05-08T10:00:00Z"
                    nextCursor: null
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    post:
      operationId: createGameSession
      summary: Create a new game session
      description: |
        Creates a game session owned by the authenticated user (the GM).
        `name` is the only required field; all other fields are optional.
      tags: [game-sessions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
