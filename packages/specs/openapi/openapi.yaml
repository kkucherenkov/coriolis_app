openapi: 3.1.0
info:
  title: Coriolis Companion API
  version: 0.4.0
  description: |
    Spec-first HTTP API for the Coriolis Companion App. Paths include the
    versioned prefix (`/api/v1`) so generated clients can be used without
    additional base-URL rewriting.

    **Authentication endpoints** live under `/api/v1/auth/*` and follow the
    [Better Auth protocol](https://www.better-auth.com/docs). They are
    deliberately not enumerated here: Better Auth owns that wire contract and
    evolves it independently of our OpenAPI surface. The `cookieAuth` and
    `bearerAuth` security schemes documented below describe how the *rest* of
    this API accepts credentials issued by that namespace — session cookies
    (web) and bearer tokens (mobile, via the `bearer` plugin).

    Domain endpoints (`/me`, `/characters`, `/ships`, `/sessions`,
    `/encounters`, `/share-links`, …) are added in the phase that needs them
    per `docs/IMPLEMENTATION_PLAN.md`. Phase 0 ships only the system surface
    documented below.
  contact:
    name: Coriolis Companion
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: system
    description: Health and liveness endpoints
  - name: realtime
    description: Centrifugo connection tokens
  - name: users
    description: Authenticated user profile
  - name: characters
    description: Player character CRUD and nested items / talents
  - name: ships
    description: Ship CRUD, nested modules, and crew assignment

paths:
  /api/v1/characters:
    get:
      operationId: listCharacters
      summary: List the authenticated user's characters
      description: |
        Returns a cursor-paginated list of characters owned by the
        authenticated user. Pass `cursor` from a previous response's
        `nextCursor` to retrieve the following page. Results are ordered
        newest-first by `createdAt`.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by the previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of characters to return (1–100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated character list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterList"
              examples:
                ok:
                  value:
                    items:
                      - id: cuid_tariq01
                        ownerId: cuid_user01
                        name: Tariq al-Asari
                        concept: Veteran fringe pilot
                        iconId: traveler
                        attributes:
                          strength: 3
                          agility: 5
                          wits: 4
                          empathy: 3
                        skills:
                          dexterity: 4
                          force: 1
                          infiltration: 3
                          manipulation: 2
                          meleeCombat: 1
                          observation: 4
                          rangedCombat: 3
                          survival: 2
                          command: 2
                          culture: 1
                          dataDjinn: 2
                          medicurgy: 0
                          mysticPowers: 0
                          pilot: 5
                          science: 1
                          technology: 3
                        hp:
                          current: 11
                          max: 8
                        mp:
                          current: 8
                          max: 7
                        encumbrance:
                          current: 2.0
                          max: 6
                        experience: 12
                        conditions:
                          exhausted: false
                          sleepless: true
                          thirsty: true
                          hungry: false
                        criticalInjuries: []
                        talents: []
                        relationships: []
                        inventory: []
                        notes: null
                        createdAt: "2026-01-15T09:30:00Z"
                        updatedAt: "2026-04-01T14:22:00Z"
                    nextCursor: null
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    post:
      operationId: createCharacter
      summary: Create a new character
      description: |
        Creates a character owned by the authenticated user. `name` is the
        only required field; all other fields default to empty arrays, null,
        or 0. Server-derived fields (`hp.max`, `mp.max`, `encumbrance.max`)
        are populated from the provided attribute values or defaults.

        Attribute defaults are 2 per attribute when not provided. Skills
        default to 0.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterCreate"
            examples:
              minimal:
                value:
                  name: Rana Sadir
              withAttributes:
                value:
                  name: Said al-Khatib
                  concept: Mercenary from the Far Quarter
                  iconId: judge
                  attributes:
                    strength: 4
                    agility: 3
                    wits: 3
                    empathy: 2
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                created:
                  value:
                    id: cuid_said01
                    ownerId: cuid_user01
                    name: Said al-Khatib
                    concept: Mercenary from the Far Quarter
                    iconId: judge
                    attributes:
                      strength: 4
                      agility: 3
                      wits: 3
                      empathy: 2
                    skills:
                      dexterity: 0
                      force: 0
                      infiltration: 0
                      manipulation: 0
                      meleeCombat: 0
                      observation: 0
                      rangedCombat: 0
                      survival: 0
                      command: 0
                      culture: 0
                      dataDjinn: 0
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 0
                      science: 0
                      technology: 0
                    hp:
                      current: 0
                      max: 7
                    mp:
                      current: 0
                      max: 5
                    encumbrance:
                      current: 0
                      max: 8
                    experience: 0
                    conditions:
                      exhausted: false
                      sleepless: false
                      thirsty: false
                      hungry: false
                    criticalInjuries: []
                    talents: []
                    relationships: []
                    inventory: []
                    notes: null
                    createdAt: "2026-05-08T10:00:00Z"
                    updatedAt: "2026-05-08T10:00:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `CHARACTER_NAME_EMPTY` — name is an empty string.
            - `CHARACTER_NAME_TOO_LONG` — name exceeds 80 characters.
            - `ATTRIBUTE_OUT_OF_RANGE` — an attribute value is outside 1–5.
            - `SKILL_OUT_OF_RANGE` — a skill value is outside its allowed range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                nameEmpty:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: name must be between 1 and 80 characters
                    instance: /api/v1/characters
                    code: CHARACTER_NAME_EMPTY
                nameTooLong:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: name must not exceed 80 characters
                    instance: /api/v1/characters
                    code: CHARACTER_NAME_TOO_LONG
                attributeOutOfRange:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: strength must be between 1 and 5
                    instance: /api/v1/characters
                    code: ATTRIBUTE_OUT_OF_RANGE
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/characters/{id}:
    get:
      operationId: getCharacter
      summary: Get a character by ID
      description: |
        Returns the full character DTO. Returns 404 if the character does not
        exist or is not owned by the authenticated user. Owner-scoped: a
        character owned by another user returns 403 (not 404) when the caller
        is authenticated, to aid debugging while preserving access boundaries.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      responses:
        "200":
          description: Character found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                ok:
                  value:
                    id: cuid_tariq01
                    ownerId: cuid_user01
                    name: Tariq al-Asari
                    concept: Veteran fringe pilot
                    iconId: traveler
                    attributes:
                      strength: 3
                      agility: 5
                      wits: 4
                      empathy: 3
                    skills:
                      dexterity: 4
                      force: 1
                      infiltration: 3
                      manipulation: 2
                      meleeCombat: 1
                      observation: 4
                      rangedCombat: 3
                      survival: 2
                      command: 2
                      culture: 1
                      dataDjinn: 2
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 5
                      science: 1
                      technology: 3
                    hp:
                      current: 11
                      max: 8
                    mp:
                      current: 8
                      max: 7
                    encumbrance:
                      current: 2.0
                      max: 6
                    experience: 12
                    conditions:
                      exhausted: false
                      sleepless: true
                      thirsty: true
                      hungry: false
                    criticalInjuries:
                      - id: cuid_crit01
                        name: Broken arm
                        severity: light
                        effect: "-2 to Force and Melee Combat rolls"
                        acquiredAt: "2026-03-20T19:00:00Z"
                    talents:
                      - id: cuid_tal01
                        name: Wing-Mate
                        description: Re-roll one die when assisting a fellow pilot.
                        rank: 2
                        acquiredAt: "2026-01-15T09:30:00Z"
                    relationships:
                      - id: cuid_rel01
                        targetName: Nokk of the Madara
                        kind: ally
                        notes: Ship mechanic, owes me a favour after the Algol run.
                    inventory:
                      - id: cuid_item01
                        type: WEAPON
                        name: Vulcan Carbine
                        damage: 2
                        range: short
                        bonus: 2
                        crit: 2
                        weight: 0.8
                        features: []
                        equipped: true
                    notes: "Notes from the Far Quarter campaign."
                    createdAt: "2026-01-15T09:30:00Z"
                    updatedAt: "2026-04-01T14:22:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller is authenticated but does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this character
                    instance: /api/v1/characters/cuid_tariq01
                    code: CHARACTER_NOT_OWNED
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Character cuid_tariq01 does not exist
                    instance: /api/v1/characters/cuid_tariq01
                    code: CHARACTER_NOT_FOUND

    patch:
      operationId: updateCharacter
      summary: Partially update a character
      description: |
        Applies PATCH semantics — omitted fields are left unchanged. Read-only
        fields (`id`, `ownerId`, `hp.max`, `mp.max`, `encumbrance.max`,
        `createdAt`, `updatedAt`) are rejected with 400 if included.

        Server-derived fields (`hp.max`, `mp.max`, `encumbrance.max`) are
        recalculated after each write and reflected in the response.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterUpdate"
            examples:
              updateName:
                value:
                  name: Tariq al-Asari (Pilot)
              updateConditions:
                value:
                  conditions:
                    exhausted: true
                    sleepless: true
                    thirsty: false
                    hungry: false
              updateAttributes:
                value:
                  attributes:
                    strength: 4
                    agility: 5
                    wits: 4
                    empathy: 3
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                ok:
                  value:
                    id: cuid_tariq01
                    ownerId: cuid_user01
                    name: Tariq al-Asari (Pilot)
                    concept: Veteran fringe pilot
                    iconId: traveler
                    attributes:
                      strength: 3
                      agility: 5
                      wits: 4
                      empathy: 3
                    skills:
                      dexterity: 4
                      force: 1
                      infiltration: 3
                      manipulation: 2
                      meleeCombat: 1
                      observation: 4
                      rangedCombat: 3
                      survival: 2
                      command: 2
                      culture: 1
                      dataDjinn: 2
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 5
                      science: 1
                      technology: 3
                    hp:
                      current: 11
                      max: 8
                    mp:
                      current: 8
                      max: 7
                    encumbrance:
                      current: 2.0
                      max: 6
                    experience: 12
                    conditions:
                      exhausted: false
                      sleepless: true
                      thirsty: true
                      hungry: false
                    criticalInjuries: []
                    talents: []
                    relationships: []
                    inventory: []
                    notes: null
                    createdAt: "2026-01-15T09:30:00Z"
                    updatedAt: "2026-05-08T10:05:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `CHARACTER_NAME_EMPTY`
            - `CHARACTER_NAME_TOO_LONG`
            - `ATTRIBUTE_OUT_OF_RANGE`
            - `SKILL_OUT_OF_RANGE`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                skillOutOfRange:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: pilot skill value 6 exceeds maximum 5
                    instance: /api/v1/characters/cuid_tariq01
                    code: SKILL_OUT_OF_RANGE
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this character
                    instance: /api/v1/characters/cuid_tariq01
                    code: CHARACTER_NOT_OWNED
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Character cuid_tariq01 does not exist
                    instance: /api/v1/characters/cuid_tariq01
                    code: CHARACTER_NOT_FOUND

    delete:
      operationId: deleteCharacter
      summary: Delete a character
      description: |
        Permanently deletes a character and all its nested items, talents,
        relationships, and share links. This action is irreversible.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      responses:
        "204":
          description: Character deleted
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this character
                    instance: /api/v1/characters/cuid_tariq01
                    code: CHARACTER_NOT_OWNED
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Character cuid_tariq01 does not exist
                    instance: /api/v1/characters/cuid_tariq01
                    code: CHARACTER_NOT_FOUND

  /api/v1/characters/{id}/duplicate:
    post:
      operationId: duplicateCharacter
      summary: Duplicate a character
      description: |
        Creates a deep copy of the character (including items, talents,
        relationships, and conditions) and assigns it to the authenticated
        user. The copy receives a new `id` and the name has " (copy)"
        appended. Share links are not duplicated. The source character must
        be owned by the caller.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      responses:
        "201":
          description: Duplicated character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                created:
                  value:
                    id: cuid_tariq02
                    ownerId: cuid_user01
                    name: Tariq al-Asari (copy)
                    concept: Veteran fringe pilot
                    iconId: traveler
                    attributes:
                      strength: 3
                      agility: 5
                      wits: 4
                      empathy: 3
                    skills:
                      dexterity: 4
                      force: 1
                      infiltration: 3
                      manipulation: 2
                      meleeCombat: 1
                      observation: 4
                      rangedCombat: 3
                      survival: 2
                      command: 2
                      culture: 1
                      dataDjinn: 2
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 5
                      science: 1
                      technology: 3
                    hp:
                      current: 11
                      max: 8
                    mp:
                      current: 8
                      max: 7
                    encumbrance:
                      current: 2.0
                      max: 6
                    experience: 12
                    conditions:
                      exhausted: false
                      sleepless: false
                      thirsty: false
                      hungry: false
                    criticalInjuries: []
                    talents: []
                    relationships: []
                    inventory: []
                    notes: null
                    createdAt: "2026-05-08T11:00:00Z"
                    updatedAt: "2026-05-08T11:00:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this character
                    instance: /api/v1/characters/cuid_tariq01/duplicate
                    code: CHARACTER_NOT_OWNED
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Character cuid_tariq01 does not exist
                    instance: /api/v1/characters/cuid_tariq01/duplicate
                    code: CHARACTER_NOT_FOUND

  /api/v1/characters/{id}/export:
    get:
      operationId: exportCharacter
      summary: Export a character as JSON
      description: |
        Returns the full canonical Character DTO as a downloadable JSON
        payload. v1 ships JSON only; PDF and encounter-bundle exports are
        post-v1. The response carries `Content-Disposition: attachment` so
        browsers prompt a download.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      responses:
        "200":
          description: Character JSON export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                ok:
                  value:
                    id: cuid_tariq01
                    ownerId: cuid_user01
                    name: Tariq al-Asari
                    concept: Veteran fringe pilot
                    iconId: traveler
                    attributes:
                      strength: 3
                      agility: 5
                      wits: 4
                      empathy: 3
                    skills:
                      dexterity: 4
                      force: 1
                      infiltration: 3
                      manipulation: 2
                      meleeCombat: 1
                      observation: 4
                      rangedCombat: 3
                      survival: 2
                      command: 2
                      culture: 1
                      dataDjinn: 2
                      medicurgy: 0
