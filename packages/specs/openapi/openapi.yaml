  /api/v1/characters/{id}/items:
    post:
      operationId: addCharacterItem
      summary: Add an item to a character's inventory
      description: |
        Creates an item of the specified `type` under the character. The
        discriminator field `type` determines which additional fields are
        accepted and required. `id` is assigned by the server.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
            examples:
              addWeapon:
                value:
                  type: WEAPON
                  name: Vulcan Carbine
                  damage: 2
                  range: short
                  bonus: 2
                  crit: 2
                  weight: 0.8
                  features: []
                  equipped: true
              addGear:
                value:
                  type: GEAR
                  name: Medkit
                  weight: 0.5
                  quantity: 1
                  notes: Standard field medkit
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
              examples:
                created:
                  value:
                    id: cuid_item02
                    type: WEAPON
                    name: Vulcan Carbine
                    damage: 2
                    range: short
                    bonus: 2
                    crit: 2
                    weight: 0.8
                    features: []
                    equipped: true
        "400":
          description: |
            Validation error. Possible codes:
            - `CHARACTER_NAME_EMPTY` — item name is empty.
