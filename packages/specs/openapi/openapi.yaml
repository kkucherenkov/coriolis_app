        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipCreate"
            examples:
              minimal:
                value:
                  name: Narzal
                  class: courier-yacht
              full:
                value:
                  name: Madara
                  class: light-freighter
                  model: Helebian Class III freighter
                  registry: KUA-7741-M
      responses:
        "201":
          description: Ship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
              examples:
                created:
                  value:
                    id: cuid_ship02
                    ownerId: cuid_user01
                    name: Narzal
                    class: courier-yacht
                    model: null
                    registry: null
                    hull:
                      current: 6
                      max: 6
                    energy:
                      current: 5
                      max: 5
                    armor: 5
                    maneuverability: 0
                    signature: 0
                    speed: 2
                    cargoCapacity: 50
                    modules: []
                    crew: []
                    problems: []
                    history: null
                    notes: null
                    createdAt: "2026-05-08T10:00:00Z"
                    updatedAt: "2026-05-08T10:00:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `SHIP_NAME_EMPTY` — name is an empty string.
            - `SHIP_NAME_TOO_LONG` — name exceeds 80 characters.
