  # ---------------------------------------------------------------------------
  # Public read endpoints (no auth required)
  # ---------------------------------------------------------------------------

  /api/v1/public/character/{slug}:
    get:
      operationId: getPublicCharacter
      summary: Get a publicly-shared character by slug
      description: |
        Returns the character associated with the given share-link slug.
        No authentication is required.

        The `notes` field (top-level GM notes) is included only when the share
        link was created with `includeGmNotes: true`. If the link does not
        include GM notes, `notes` is always returned as `null` regardless of
        whether the character actually has notes.

        Error semantics:
        - `404` — slug does not exist or was never created.
        - `410` — slug existed but has been revoked or has expired.
      tags: [public]
      parameters:
        - $ref: "#/components/parameters/ShareSlug"
      responses:
        "200":
          description: Publicly-shared character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                ok:
                  value:
                    id: cuid_tariq01
                    ownerId: cuid_user01
                    name: Tariq al-Asari
                    concept: Veteran fringe pilot
                    iconId: traveler
                    attributes:
                      strength: 3
                      agility: 5
                      wits: 4
                      empathy: 3
                    skills:
                      dexterity: 4
                      force: 1
                      infiltration: 3
                      manipulation: 2
                      meleeCombat: 1
                      observation: 4
                      rangedCombat: 3
                      survival: 2
                      command: 2
                      culture: 1
                      dataDjinn: 2
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 5
                      science: 1
                      technology: 3
                    hp:
                      current: 11
                      max: 8
                    mp:
                      current: 8
                      max: 7
                    encumbrance:
                      current: 2.0
                      max: 6
                    experience: 12
                    conditions:
                      exhausted: false
                      sleepless: true
                      thirsty: true
                      hungry: false
                    criticalInjuries: []
                    talents: []
                    relationships: []
                    inventory: []
                    notes: null
                    status: active
                    createdAt: "2026-01-15T09:30:00Z"
                    updatedAt: "2026-04-01T14:22:00Z"
        "404":
          description: Slug not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Share link 3Bk7NzYqAcMpRvWxDjGhTs4Q does not exist
                    instance: /api/v1/public/character/3Bk7NzYqAcMpRvWxDjGhTs4Q
                    code: SHARE_LINK_NOT_FOUND
        "410":
          description: Share link revoked or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                revoked:
                  value:
                    type: https://coriolis.example.com/problems/gone
                    title: Gone
                    status: 410
                    detail: Share link 3Bk7NzYqAcMpRvWxDjGhTs4Q has been revoked
                    instance: /api/v1/public/character/3Bk7NzYqAcMpRvWxDjGhTs4Q
