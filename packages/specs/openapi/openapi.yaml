          properties:
            type:
              type: string
              enum: [GEAR]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            quantity:
              type: integer
              minimum: 1
              description: Number of units
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    ItemCybernetic:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [bodyPoints, effect]
          properties:
            type:
              type: string
              enum: [CYBERNETIC]
            bodyPoints:
              type: integer
              minimum: 0
              maximum: 6
              description: System strain points consumed (0–6)
            effect:
              type: string
              description: Description of the cybernetic's effect

    ItemShipModule:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [slot, effect]
          properties:
            type:
              type: string
              enum: [SHIP_MODULE]
            slot:
              $ref: "#/components/schemas/ItemSlotType"
            effect:
              type: string
              description: Description of the module's effect and energy use

    ItemOther:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight]
          properties:
            type:
              type: string
              enum: [OTHER]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    # -------------------------------------------------------------------------
    # Item create variants (no id, no server-derived fields)
    # -------------------------------------------------------------------------

    ItemWeaponCreate:
      type: object
      description: Create payload for a WEAPON item. No `id` — server-assigned.
      required: [type, name, damage, range, bonus, crit, weight, features, equipped]
      properties:
        type:
          type: string
          enum: [WEAPON]
        name:
          type: string
