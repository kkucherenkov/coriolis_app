components:
  parameters:
    CharacterId:
      name: id
      in: path
      required: true
      description: Character identifier (cuid2)
      schema:
        type: string

    ItemId:
      name: id
      in: path
      required: true
      description: Item identifier (cuid2)
      schema:
        type: string

    TalentId:
      name: id
      in: path
      required: true
      description: Talent identifier (cuid2)
      schema:
        type: string

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth bearer token

  schemas:
    # -------------------------------------------------------------------------
    # Enumerations — define once, reference everywhere
    # -------------------------------------------------------------------------

    CriticalInjurySeverity:
      type: string
      enum: [light, severe, critical]
      description: |
        Severity tier of a critical injury per Coriolis core rules.
        - `light` — minor wound, no long-term mechanical effect.
        - `severe` — significant injury; may impose ongoing penalties.
        - `critical` — life-threatening; requires urgent medicurgy.

    DependencyStatus:
      type: ["string", "null"]
      enum: [ok, degraded, down]

    IconId:
      type: string
      enum:
        - lady-of-tears
        - traveler
        - messenger
        - merchant
        - dancer
        - gambler
        - judge
        - faceless-one
        - deckhand
      description: |
        One of the Nine Icons of the Third Horizon. Kebab-case names match
        the asset filenames in `packages/ui/src/assets/icons/`.

    ItemRangeEnum:
      type: string
      enum: [arm, near, short, long, distant]
      description: |
        Effective range band for a weapon. Matches the Coriolis core book
        range terminology:
        - `arm` — Engaged / hand-to-hand.
        - `near` — same room / close quarters.
        - `short` — corridor / street distance.
        - `long` — open ground / rooftop.
        - `distant` — sniper range.

    ItemSlotType:
      type: string
      enum: [bridge, hull, hold, weapon, drive, sensor, comms]
      description: |
        Ship module slot type. Used only for SHIP_MODULE items. Matches the
        slot categories from Coriolis core book ship construction rules.

    RelationshipKind:
      type: string
      enum: [ally, rival, family, mentor, debtor, creditor]
      description: |
        The nature of the relationship between a character and an NPC or PC.

    # -------------------------------------------------------------------------
    # Value objects
    # -------------------------------------------------------------------------

    Attributes:
      type: object
      description: |
        The four primary attributes per Coriolis core rules (PRD §5.2). Each
        is a 1–5 integer. All keys are required — missing attributes would
        make derived-stat calculation impossible server-side.
      required: [strength, agility, wits, empathy]
      properties:
        strength:
          type: integer
          minimum: 1
          maximum: 5
          description: STR — governs Force, Melee Combat skills and HP max
        agility:
          type: integer
          minimum: 1
          maximum: 5
          description: AGI — governs Dexterity, Infiltration, Ranged Combat, Pilot; contributes to HP max
        wits:
          type: integer
          minimum: 1
          maximum: 5
          description: WIT — governs Observation, Survival, Technology, Data Djinn, Science, Medicurgy; contributes to MP max
        empathy:
          type: integer
          minimum: 1
          maximum: 5
          description: EMP — governs Manipulation, Command, Culture, Mystic Powers; contributes to MP max

    Skills:
      type: object
      description: |
        The 16 skills per Coriolis core rules (PRD §5.2). General skills
        range 0–5; advanced skills (command, culture, dataDjinn, medicurgy,
        mysticPowers, pilot, science, technology) also range 0–5 in the
        schema — the "0–3 typical" note in the PRD describes usual play,
        not a hard cap, so the server accepts up to 5 for all skills.
        All keys are required.
      required:
        - dexterity
        - force
        - infiltration
        - manipulation
        - meleeCombat
        - observation
        - rangedCombat
        - survival
        - command
        - culture
        - dataDjinn
        - medicurgy
        - mysticPowers
        - pilot
        - science
        - technology
      properties:
        dexterity:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        force:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (STR)
        infiltration:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        manipulation:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (EMP)
        meleeCombat:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (STR)
        observation:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (WIT)
        rangedCombat:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        survival:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (WIT)
        command:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        culture:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        dataDjinn:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        medicurgy:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        mysticPowers:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        pilot:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (AGI)
        science:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        technology:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)

    ConditionFlags:
      type: object
      description: |
        Boolean flags for the four standard Coriolis conditions (PRD §5.2).
        Each active condition imposes a −1 die penalty on all rolls (capped
        at the character's pool size). Applied by the RulesEngine.
      required: [exhausted, sleepless, thirsty, hungry]
      properties:
        exhausted:
          type: boolean
          description: Exhausted condition — also blocks pushing rolls
        sleepless:
          type: boolean
        thirsty:
          type: boolean
        hungry:
          type: boolean

    CriticalInjury:
      type: object
      description: A critical injury entry on a character's sheet
      required: [id, name, severity, effect, acquiredAt]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        name:
          type: string
          description: Short name of the injury (e.g. "Broken arm")
        severity:
          $ref: "#/components/schemas/CriticalInjurySeverity"
        effect:
          type: string
          description: Free-text description of the mechanical or narrative effect
        acquiredAt:
          type: string
          format: date-time
          description: ISO-8601 instant when the injury was recorded

    Talent:
      type: object
      description: A talent owned by a character
      required: [id, name, description, rank, acquiredAt]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        name:
          type: string
          description: Talent name (e.g. "Wing-Mate", "Stunt Pilot")
        description:
          type: string
          description: Rules text or flavour description of the talent
        rank:
          type: integer
          minimum: 1
          maximum: 3
          description: Talent rank (1 = basic, 2 = journeyman, 3 = master)
        acquiredAt:
          type: string
          format: date-time
          description: ISO-8601 instant when the talent was recorded on the sheet

    TalentCreate:
      type: object
      description: Payload for creating a new talent
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          description: Talent name
        description:
          type: string
          description: Rules text or flavour description
        rank:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: Talent rank (defaults to 1 when not provided)

    TalentUpdate:
      type: object
      description: PATCH payload for updating a talent — all fields optional
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        rank:
          type: integer
          minimum: 1
          maximum: 3

    Relationship:
      type: object
      description: A relationship between a character and another person (NPC or PC)
      required: [id, targetName, kind]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        targetName:
          type: string
          description: Name of the NPC or PC (free text)
        kind:
          $ref: "#/components/schemas/RelationshipKind"
        notes:
          type: ["string", "null"]
          description: Optional notes about the relationship

    # -------------------------------------------------------------------------
    # Item discriminated union
    # -------------------------------------------------------------------------

    ItemBase:
      type: object
      description: Fields common to every item type
      required: [id, type, name]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        type:
          type: string
          description: Discriminator — determines which type-specific fields are present
        name:
          type: string
          minLength: 1
          description: Item name

    ItemWeapon:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [damage, range, bonus, crit, weight, features, equipped]
          properties:
            type:
              type: string
              enum: [WEAPON]
            damage:
              type: integer
              minimum: 0
              description: Base damage dice
            range:
              $ref: "#/components/schemas/ItemRangeEnum"
            bonus:
              type: integer
              minimum: 0
              description: Bonus dice added to the attack pool
            crit:
              type: integer
              minimum: 1
              description: Critical threshold (roll this many successes to crit)
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots (0.5 increments)
            features:
              type: array
              items:
                type: string
              description: Feature tags (e.g. "Burst", "Explosive")
            equipped:
              type: boolean
              description: Whether the item is currently equipped

    ItemArmor:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [armorRating, weight, features, equipped]
          properties:
            type:
              type: string
              enum: [ARMOR]
            armorRating:
              type: integer
              minimum: 0
              description: Armor rating — reduces incoming damage
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            features:
              type: array
              items:
                type: string
              description: Feature tags (e.g. "Vacuum Sealed", "Exo-Skeleton")
            equipped:
              type: boolean

    ItemGear:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight, quantity]
          properties:
            type:
              type: string
              enum: [GEAR]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            quantity:
              type: integer
              minimum: 1
              description: Number of units
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    ItemCybernetic:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [bodyPoints, effect]
          properties:
            type:
              type: string
              enum: [CYBERNETIC]
            bodyPoints:
              type: integer
              minimum: 0
              maximum: 6
              description: System strain points consumed (0–6)
            effect:
              type: string
              description: Description of the cybernetic's effect

    ItemShipModule:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [slot, effect]
          properties:
            type:
              type: string
              enum: [SHIP_MODULE]
            slot:
              $ref: "#/components/schemas/ItemSlotType"
            effect:
              type: string
              description: Description of the module's effect and energy use

    ItemOther:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight]
          properties:
            type:
              type: string
              enum: [OTHER]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    Item:
      description: |
        A discriminated union of all item types. The `type` field determines
        which variant applies. Generated clients produce a correctly-typed
        sum type from this schema.
      oneOf:
        - $ref: "#/components/schemas/ItemWeapon"
        - $ref: "#/components/schemas/ItemArmor"
        - $ref: "#/components/schemas/ItemGear"
        - $ref: "#/components/schemas/ItemCybernetic"
        - $ref: "#/components/schemas/ItemShipModule"
        - $ref: "#/components/schemas/ItemOther"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeapon"
          ARMOR: "#/components/schemas/ItemArmor"
          GEAR: "#/components/schemas/ItemGear"
          CYBERNETIC: "#/components/schemas/ItemCybernetic"
          SHIP_MODULE: "#/components/schemas/ItemShipModule"
          OTHER: "#/components/schemas/ItemOther"

    ItemCreate:
      description: |
        Payload for creating a new item. Same discriminated union as `Item`
        but without `id` (server-assigned). The `type` discriminator must
        be present.
      oneOf:
        - allOf:
            - type: object
              required: [type, name, damage, range, bonus, crit, weight, features, equipped]
              properties:
                type:
                  type: string
                  enum: [WEAPON]
                name:
                  type: string
                  minLength: 1
                damage:
                  type: integer
                  minimum: 0
                range:
                  $ref: "#/components/schemas/ItemRangeEnum"
                bonus:
                  type: integer
                  minimum: 0
                crit:
                  type: integer
                  minimum: 1
                weight:
                  type: number
                  minimum: 0
                features:
                  type: array
                  items:
                    type: string
                equipped:
                  type: boolean
        - allOf:
            - type: object
              required: [type, name, armorRating, weight, features, equipped]
              properties:
                type:
                  type: string
                  enum: [ARMOR]
                name:
                  type: string
                  minLength: 1
                armorRating:
                  type: integer
                  minimum: 0
                weight:
                  type: number
                  minimum: 0
                features:
                  type: array
                  items:
                    type: string
                equipped:
                  type: boolean
        - allOf:
            - type: object
              required: [type, name, weight, quantity]
              properties:
                type:
                  type: string
                  enum: [GEAR]
                name:
                  type: string
                  minLength: 1
                weight:
                  type: number
                  minimum: 0
                quantity:
                  type: integer
                  minimum: 1
                notes:
                  type: ["string", "null"]
        - allOf:
            - type: object
              required: [type, name, bodyPoints, effect]
              properties:
                type:
                  type: string
                  enum: [CYBERNETIC]
                name:
                  type: string
                  minLength: 1
                bodyPoints:
                  type: integer
                  minimum: 0
                  maximum: 6
                effect:
                  type: string
        - allOf:
            - type: object
              required: [type, name, slot, effect]
              properties:
                type:
                  type: string
                  enum: [SHIP_MODULE]
                name:
                  type: string
                  minLength: 1
                slot:
                  $ref: "#/components/schemas/ItemSlotType"
                effect:
                  type: string
        - allOf:
            - type: object
              required: [type, name, weight]
              properties:
                type:
                  type: string
                  enum: [OTHER]
                name:
                  type: string
                  minLength: 1
                weight:
                  type: number
                  minimum: 0
                notes:
                  type: ["string", "null"]
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemCreate/oneOf/0"
          ARMOR: "#/components/schemas/ItemCreate/oneOf/1"
          GEAR: "#/components/schemas/ItemCreate/oneOf/2"
          CYBERNETIC: "#/components/schemas/ItemCreate/oneOf/3"
          SHIP_MODULE: "#/components/schemas/ItemCreate/oneOf/4"
          OTHER: "#/components/schemas/ItemCreate/oneOf/5"

    ItemUpdate:
      description: |
        PATCH payload for updating an item. The `type` discriminator must
        match the existing item type — changing it returns 400
        `ITEM_TYPE_MISMATCH`. All fields are optional.
      type: object
      properties:
        name:
          type: string
          minLength: 1
        damage:
          type: integer
          minimum: 0
          description: WEAPON only
        range:
          $ref: "#/components/schemas/ItemRangeEnum"
          description: WEAPON only
        bonus:
          type: integer
          minimum: 0
          description: WEAPON only
        crit:
          type: integer
          minimum: 1
          description: WEAPON only
        armorRating:
          type: integer
          minimum: 0
          description: ARMOR only
        weight:
          type: number
          minimum: 0
        features:
          type: array
          items:
            type: string
          description: WEAPON or ARMOR
        equipped:
          type: boolean
          description: WEAPON or ARMOR
        quantity:
          type: integer
          minimum: 1
          description: GEAR only
        notes:
          type: ["string", "null"]
          description: GEAR or OTHER
        bodyPoints:
          type: integer
          minimum: 0
          maximum: 6
          description: CYBERNETIC only
        effect:
          type: string
          description: CYBERNETIC or SHIP_MODULE
        slot:
          $ref: "#/components/schemas/ItemSlotType"
          description: SHIP_MODULE only

    # -------------------------------------------------------------------------
    # Character schemas
    # -------------------------------------------------------------------------

    Character:
      type: object
      description: |
        Full character DTO as returned by the v1 API. Server-derived fields
        (`hp.max`, `mp.max`, `encumbrance.max`) are computed by the
        RulesEngine on every write and are marked `readOnly`.

        Formulas (PRD §5.2, §10):
        - HP max = STR + AGI
        - MP max = WIT + EMP
        - Encumbrance max = STR × 2
      required:
        - id
        - ownerId
        - name
        - concept
        - iconId
        - attributes
        - skills
        - hp
        - mp
        - encumbrance
        - experience
        - conditions
        - criticalInjuries
        - talents
        - relationships
        - inventory
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque character identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Character name (1–80 characters)
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
          description: Short concept phrase — the role the character plays at the table (1–120 chars when non-null)
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
          description: One of the Nine Icons, or null if not chosen yet
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR + AGI; set by the server
        mp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from WIT + EMP; set by the server
        encumbrance:
          type: object
          required: [current, max]
          properties:
            current:
              type: number
              minimum: 0
              readOnly: true
              description: Sum of non-stowed item weights; set by the server
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR × 2; set by the server
        experience:
          type: integer
          minimum: 0
          description: Total XP earned
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
        talents:
          type: array
          items:
            $ref: "#/components/schemas/Talent"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form notes (Markdown; soft cap 4096 characters)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CharacterCreate:
      type: object
      description: |
        Payload for `POST /api/v1/characters`. Only `name` is required.
        Attribute values default to 2 if the `attributes` object is omitted
        or a key within it is missing. Skill values default to 0.

        Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `createdAt`, `updatedAt`)
        must not be included; they are rejected with 400.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
          default: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        notes:
          type: ["string", "null"]
          maxLength: 4096

    CharacterUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/characters/{id}`. All fields are
        optional. Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `createdAt`, `updatedAt`)
        are rejected with 400 if present.

        Derived stats (`hp.max`, `mp.max`, `encumbrance.max`) are
        recalculated automatically after each successful write.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
          description: |
            Replaces the entire critical injuries list when provided.
            Use the dedicated nested-item pattern (POST/PATCH/DELETE on
            individual injuries) once that surface is added in a later epic.
        notes:
          type: ["string", "null"]
          maxLength: 4096

    CharacterList:
      type: object
      description: Cursor-paginated list of characters
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # System / realtime schemas (unchanged from 0.2.0)
    # -------------------------------------------------------------------------

    HealthStatus:
      type: object
      required: [status, version, uptimeSeconds, dependencies]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        version:
          type: ["string", "null"]
          description: Semantic version of the running backend build
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the backend process started
        dependencies:
          type: object
          required: [db, redis, centrifugo]
          properties:
            db:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            centrifugo:
              $ref: "#/components/schemas/DependencyStatus"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: ["string", "null"]
          format: uri
          default: about:blank
        title:
          type: ["string", "null"]
        status:
          type: integer
          format: int32
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        code:
          type: ["string", "null"]

    Me:
      type: object
      description: |
        The authenticated user's profile as exposed by the v1 API. Fields
        sourced from the Better Auth `user` table. `deletedAt` is an internal
        soft-delete flag and is never surfaced here — deleted users receive a
        404 because their sessions are revoked at deletion time.
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          description: Opaque user identifier issued by Better Auth (cuid2)
        email:
          type: string
          format: email
          description: Primary email address. Read-only via this API.
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name shown in share-link banners and the avatar
            menu. Null when the user has not set one yet.
        createdAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the account was created. Read-only via this API.

    MeUpdate:
      type: object
      description: |
        Partial update payload for PATCH /api/v1/me. Only `displayName` is
        mutable. Omitting a property leaves the corresponding field unchanged.
        Setting `displayName` to null clears the field.
      properties:
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name. Must be 1–80 characters when non-null.
            Set to null to clear the field.

    RealtimeToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: ["string", "null"]
          description: Short-lived HMAC-signed JWT for Centrifugo
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the token expires
