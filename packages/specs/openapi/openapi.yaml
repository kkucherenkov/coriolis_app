              schema:
                $ref: "#/components/schemas/Problem"

    post:
      operationId: createNpc
      summary: Create a new NPC
      description: |
        Creates an NPC owned by the authenticated user. Only `name` is
        required; all other fields default to playable stubs so a quick
        encounter-filler can be created with a single call. Server assigns
        `id`, `ownerId`, `createdAt`, `updatedAt`.

        Default seeds applied by the server when fields are omitted:
        - `attributes` — all four attributes set to 2
        - `skills` — all 16 skills set to 0
        - `hp` — `{ current: 4, max: 4 }`
        - `mp` — `{ current: 4, max: 4 }`
        - `armor` — empty array
        - `weapons` — empty array
        - `tags` — empty array
        - `signature` — 0
        - `keySkillModifier` — 0
      tags: [npcs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpcCreate"
            examples:
              minimal:
                value:
                  name: Pirate Scout
              full:
                value:
                  name: Elite Corsair Captain
                  description: Commander of the raiding wing, veteran of the Taoan conflict
                  attributes:
                    strength: 3
                    agility: 4
                    wits: 3
                    empathy: 2
                  skills:
                    dexterity: 2
                    force: 1
                    infiltration: 2
                    manipulation: 1
                    meleeCombat: 3
                    observation: 2
                    rangedCombat: 4
                    survival: 1
                    command: 2
                    culture: 0
                    dataDjinn: 0
                    medicurgy: 0
                    mysticPowers: 0
                    pilot: 2
                    science: 0
                    technology: 1
                  hp:
                    current: 7
                    max: 7
                  mp:
                    current: 5
                    max: 5
                  signature: -1
                  keySkillModifier: 1
                  tags: [Pirate, Captain, Boss]
      responses:
        "201":
          description: NPC created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Npc"
              examples:
                created:
                  value:
                    id: cuid_npc02
