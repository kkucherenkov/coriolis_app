              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this talent
                    instance: /api/v1/talents/cuid_tal01
                    code: TALENT_NOT_OWNED
        "404":
          description: Talent not found
