    ItemOtherCreate:
      type: object
      description: Create payload for an OTHER item. No `id` — server-assigned.
      required: [type, name, weight]
      properties:
        type:
          type: string
          enum: [OTHER]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
          description: Encumbrance weight in slots
        notes:
          type: ["string", "null"]
          description: Optional free-text notes
      example:
        type: OTHER
        name: Coriolis Prayer Rug
        weight: 0.5
        notes: null

    # -------------------------------------------------------------------------
    # Item update variants (PATCH semantics — all fields optional)
    # -------------------------------------------------------------------------

    ItemWeaponUpdate:
      type: object
      description: PATCH payload for a WEAPON item. All fields optional.
      properties:
        type:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        damage:
          type: integer
          minimum: 0
        range:
          $ref: "#/components/schemas/ItemRangeEnum"
        bonus:
          type: integer
          minimum: 0
        crit:
          type: integer
          minimum: 1
        weight:
          type: number
          minimum: 0
        features:
          type: array
          items:
            type: string
        equipped:
          type: boolean
      example:
        type: WEAPON
        damage: 3
        equipped: true

    ItemArmorUpdate:
      type: object
      description: PATCH payload for an ARMOR item. All fields optional.
      properties:
        type:
          type: string
          enum: [ARMOR]
        name:
          type: string
          minLength: 1
        armorRating:
          type: integer
          minimum: 0
        weight:
          type: number
          minimum: 0
        features:
          type: array
          items:
            type: string
        equipped:
          type: boolean
      example:
        type: ARMOR
        armorRating: 4
        equipped: true

    ItemGearUpdate:
      type: object
      description: PATCH payload for a GEAR item. All fields optional.
      properties:
        type:
          type: string
          enum: [GEAR]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
      example:
        type: GEAR
        quantity: 3

    ItemCyberneticUpdate:
      type: object
      description: PATCH payload for a CYBERNETIC item. All fields optional.
      properties:
        type:
          type: string
          enum: [CYBERNETIC]
        name:
          type: string
          minLength: 1
        bodyPoints:
          type: integer
          minimum: 0
          maximum: 6
        effect:
          type: string
      example:
        type: CYBERNETIC
        effect: Grants +2 dice to Data Djinn checks

    ItemShipModuleUpdate:
      type: object
      description: PATCH payload for a SHIP_MODULE item. All fields optional.
      properties:
        type:
          type: string
          enum: [SHIP_MODULE]
        name:
          type: string
          minLength: 1
        slot:
          $ref: "#/components/schemas/ItemSlotType"
        effect:
          type: string
      example:
        type: SHIP_MODULE
        effect: +2 dice to sensor checks

    ItemOtherUpdate:
      type: object
      description: PATCH payload for an OTHER item. All fields optional.
      properties:
        type:
          type: string
          enum: [OTHER]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        type: OTHER
        notes: Blessed by the Lady of Tears

    Item:
      description: |
        A discriminated union of all item types. The `type` field determines
        which variant applies. Generated clients produce a correctly-typed
        sum type from this schema.
      oneOf:
        - $ref: "#/components/schemas/ItemWeapon"
        - $ref: "#/components/schemas/ItemArmor"
        - $ref: "#/components/schemas/ItemGear"
        - $ref: "#/components/schemas/ItemCybernetic"
        - $ref: "#/components/schemas/ItemShipModule"
        - $ref: "#/components/schemas/ItemOther"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeapon"
          ARMOR: "#/components/schemas/ItemArmor"
          GEAR: "#/components/schemas/ItemGear"
          CYBERNETIC: "#/components/schemas/ItemCybernetic"
          SHIP_MODULE: "#/components/schemas/ItemShipModule"
          OTHER: "#/components/schemas/ItemOther"

    ItemCreate:
      description: |
        Payload for creating a new item. Same discriminated union as `Item`
        but without `id` (server-assigned). The `type` discriminator must
        be present.
      oneOf:
        - $ref: "#/components/schemas/ItemWeaponCreate"
        - $ref: "#/components/schemas/ItemArmorCreate"
        - $ref: "#/components/schemas/ItemGearCreate"
        - $ref: "#/components/schemas/ItemCyberneticCreate"
        - $ref: "#/components/schemas/ItemShipModuleCreate"
        - $ref: "#/components/schemas/ItemOtherCreate"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeaponCreate"
          ARMOR: "#/components/schemas/ItemArmorCreate"
          GEAR: "#/components/schemas/ItemGearCreate"
          CYBERNETIC: "#/components/schemas/ItemCyberneticCreate"
          SHIP_MODULE: "#/components/schemas/ItemShipModuleCreate"
          OTHER: "#/components/schemas/ItemOtherCreate"

    ItemUpdate:
      description: |
        PATCH payload for updating an item. The `type` discriminator must
        match the existing item type — changing it returns 400
        `ITEM_TYPE_MISMATCH`. All fields are optional.
      oneOf:
        - $ref: "#/components/schemas/ItemWeaponUpdate"
        - $ref: "#/components/schemas/ItemArmorUpdate"
        - $ref: "#/components/schemas/ItemGearUpdate"
        - $ref: "#/components/schemas/ItemCyberneticUpdate"
        - $ref: "#/components/schemas/ItemShipModuleUpdate"
        - $ref: "#/components/schemas/ItemOtherUpdate"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeaponUpdate"
          ARMOR: "#/components/schemas/ItemArmorUpdate"
          GEAR: "#/components/schemas/ItemGearUpdate"
          CYBERNETIC: "#/components/schemas/ItemCyberneticUpdate"
          SHIP_MODULE: "#/components/schemas/ItemShipModuleUpdate"
          OTHER: "#/components/schemas/ItemOtherUpdate"

    # -------------------------------------------------------------------------
    # Character schemas
    # -------------------------------------------------------------------------

    Character:
      type: object
      description: |
        Full character DTO as returned by the v1 API. Server-derived fields
        (`hp.max`, `mp.max`, `encumbrance.max`) are computed by the
        RulesEngine on every write and are marked `readOnly`.

        Formulas (PRD §5.2, §10):
        - HP max = STR + AGI
        - MP max = WIT + EMP
        - Encumbrance max = STR × 2
      required:
        - id
        - ownerId
        - name
        - concept
        - iconId
        - attributes
        - skills
        - hp
        - mp
        - encumbrance
        - experience
        - conditions
        - criticalInjuries
        - talents
        - relationships
        - inventory
        - notes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque character identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Character name (1–80 characters)
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
          description: Short concept phrase — the role the character plays at the table (1–120 chars when non-null)
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
          description: One of the Nine Icons, or null if not chosen yet
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR + AGI; set by the server
        mp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from WIT + EMP; set by the server
        encumbrance:
          type: object
          required: [current, max]
          properties:
            current:
              type: number
              minimum: 0
              readOnly: true
              description: Sum of non-stowed item weights; set by the server
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR × 2; set by the server
        experience:
          type: integer
          minimum: 0
          description: Total XP earned
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
        talents:
          type: array
          items:
            $ref: "#/components/schemas/Talent"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form notes (Markdown; soft cap 4096 characters)
        status:
          type: string
          enum: [draft, active]
          description: |
            Lifecycle state of the character.

            - `draft` — character is a work-in-progress created by the wizard.
              Draft characters are excluded from the default character list
              (`GET /api/v1/characters`) unless `?includeDrafts=true` is passed.
            - `active` — character is complete and visible on the dashboard.

            Transitioning from `draft` to `active` (forging) is done by sending
            `PATCH /api/v1/characters/{id}` with `{ "status": "active" }`.
            The reverse transition (`active → draft`) is rejected with 422
            `INVALID_STATUS_TRANSITION`.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CharacterCreate:
      type: object
      description: |
        Payload for `POST /api/v1/characters`. Only `name` is required.
        Attribute values default to 2 if the `attributes` object is omitted
        or a key within it is missing. Skill values default to 0.

        Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `createdAt`, `updatedAt`)
        must not be included; they are rejected with 400.

        Set `status: 'draft'` to create a wizard-in-progress character.
        Omitting `status` defaults to `'active'`.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
          default: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        notes:
          type: ["string", "null"]
          maxLength: 4096
        status:
          type: string
          enum: [draft, active]
          default: active
          description: |
            Initial lifecycle state. Omit (or set `active`) for normal creation.
            Set to `draft` when starting the character-creation wizard.

    CharacterUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/characters/{id}`. All fields are
        optional. Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `createdAt`, `updatedAt`)
        are rejected with 400 if present.

        Derived stats (`hp.max`, `mp.max`, `encumbrance.max`) are
        recalculated automatically after each successful write.

        **Status transitions:**
        - `draft → draft` — no-op; the wizard continues editing.
        - `draft → active` — forges the character (wizard complete).
          Send `{ "status": "active" }` as a standalone PATCH or alongside
          other field updates.
        - `active → draft` — **rejected** with 422 `INVALID_STATUS_TRANSITION`.
          Active characters cannot be reverted to draft state.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
          description: |
            Replaces the entire critical injuries list when provided.
            Use the dedicated nested-item pattern (POST/PATCH/DELETE on
            individual injuries) once that surface is added in a later epic.
        notes:
          type: ["string", "null"]
          maxLength: 4096
        status:
          type: string
          enum: [draft, active]
          description: |
            Lifecycle state transition. Only `draft → active` (forge) is
            permitted. Attempting `active → draft` returns 422
            `INVALID_STATUS_TRANSITION`.

    CharacterList:
      type: object
      description: Cursor-paginated list of characters
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # Ship enumerations
    # -------------------------------------------------------------------------

    ShipClass:
      type: string
      enum:
        - fighter
        - shuttle
        - torpedo-boat
        - light-freighter
        - light-passenger
        - courier-yacht
        - clipper
        - patrol-boat
        - gunboat
        - assault-ship
        - blockade-runner
        - pleasure-yacht
        - flying-circus
        - prospector
        - rescue-ship
        - passenger-liner
        - heavy-freighter
        - cruiser
        - destroyer
        - heavy-cruiser
      description: |
        Ship hull class per ST3001 ГЛАВА 7 Table 7.4 (типы кораблей). The
        class determines the base stat block (energy, hull, maneuverability,
        signature, armor, speed, module slots) from Table 7.5. Kebab-case
        values map to the Russian originals in the rulebook.

        Class I examples: fighter, shuttle.
        Class II examples: torpedo-boat.
        Class III examples: light-freighter, light-passenger, courier-yacht,
          clipper, patrol-boat, gunboat, assault-ship, blockade-runner, pleasure-yacht.
        Class IV examples: flying-circus, prospector, rescue-ship, passenger-liner.
        Class V examples: heavy-cruiser, passenger-liner (large).

    ShipModuleSlot:
      type: string
      enum:
        - BRIDGE
        - REACTOR
        - DRIVE
        - HOLD
        - WEAPON
        - TORPEDO
        - SENSOR
        - COMMS
        - HANGAR
        - QUARTERS
        - MEDICAL
        - WORKSHOP
        - CHAPEL
        - ESCAPE-PODS
        - CRYO
        - DOCKING
        - MINING
        - REPAIR
        - CONCEALED-HOLD
        - PROXY-DECK
        - OTHER
      description: |
        Ship module slot type per ST3001 ГЛАВА 7 mandatory and optional module
        catalogue. `BRIDGE`, `REACTOR`, `DRIVE` are mandatory on every ship.
        All others are optional and consume module slots. The existing
        `ItemSlotType` enum covers character-inventory ship modules; this enum
        covers actual installed ship modules and provides richer coverage of
        the full ГЛАВА 7 catalogue.

    ShipWeaponRange:
      type: string
      enum: [zero, close, medium, long, extreme]
      description: |
        Ship-combat range bands per ST3001 ГЛАВА 7 Table 7.9. Distinct from
        the personal-scale `ItemRangeEnum`.
        - `zero` — point-blank / boarding range.
        - `close` — within a few hundred metres.
        - `medium` — standard engagement distance.
        - `long` — extended engagement.
        - `extreme` — maximum sensor range.

    CrewPosition:
      type: string
      enum:
        - captain
        - pilot
        - sensorOp
        - gunner
        - engineer
        - serviceCrew
      description: |
        Crew positions per ST3001 ГЛАВА 7 (crew roles). `sensorOp` is the
        штурман-оператор (navigator/sensor operator) in the rulebook, also
        responsible for combat-meme and info-impulse attacks. All positions
        except `captain` may be filled by automation (усовершенствование
        «Автоматика»).

    # -------------------------------------------------------------------------
    # Ship value objects
    # -------------------------------------------------------------------------

    CrewSlot:
      type: object
      description: |
        A crew position on a ship. Positions without an assigned character are
        vacant (open berth). Multiple characters may not share one position.
      required: [position]
      properties:
        position:
          $ref: "#/components/schemas/CrewPosition"
        assignedCharacterId:
          type: ["string", "null"]
          description: |
            ID of the assigned Character. Null when the berth is vacant.
            The character must be owned by the same user as the ship.

    # -------------------------------------------------------------------------
    # Ship module discriminated union
    # -------------------------------------------------------------------------

    ShipModuleBase:
      type: object
      description: Fields common to every ship module variant
      required: [id, slot, name, energyUse]
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque module identifier (cuid2)
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
          description: Module name (e.g. "Graviton Projector", "Smuggler hold")
        energyUse:
          type: integer
          minimum: 0
          description: Energy points consumed by this module when active
        notes:
          type: ["string", "null"]
          description: Free-text notes; used for damage state, special conditions, etc.

    ShipModuleWeapon:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            A ship weapon bay. Fields correspond to ST3001 ГЛАВА 7 Table 7.9.
          required: [weaponBonus, weaponRange, weaponDamage, weaponCritThreshold]
          properties:
            slot:
              type: string
              enum: [WEAPON]
            weaponBonus:
              type: integer
              minimum: 0
              description: Modifier dice added to the attack pool (Мод. column in Table 7.9)
            weaponRange:
              $ref: "#/components/schemas/ShipWeaponRange"
            weaponDamage:
              type: integer
              minimum: 0
              description: Structural damage dealt on a hit
            weaponCritThreshold:
              type: integer
              minimum: 1
              description: Number of successes required to trigger a critical effect

    ShipModuleTorpedo:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            A torpedo/mine bay per ST3001 ГЛАВА 7. Stores up to 4 torpedoes
            or 8 mines. Ammo is tracked separately.
          properties:
            slot:
              type: string
              enum: [TORPEDO]
            torpedoCount:
              type: integer
              minimum: 0
              description: Number of torpedoes currently loaded
            mineCount:
              type: integer
              minimum: 0
              description: Number of mines currently loaded

    ShipModuleHold:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: Cargo hold. Vented or concealed variant per ГЛАВА 7.
          properties:
            slot:
              type: string
              enum: [HOLD]
            cargoTons:
              type: integer
              minimum: 0
              description: Cargo capacity in tonnes (class-dependent per Table 7.6)
            concealed:
              type: boolean
              default: false
              description: True for a потайной грузовой отсек (concealed hold)

    ShipModuleSensor:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: Sensor tower upgrade. Provides +1 to sensor checks per ГЛАВА 7.
          properties:
            slot:
              type: string
              enum: [SENSOR]
            detectionBonus:
              type: integer
              minimum: 0
              default: 1
              description: Modifier added to sensor / dataDjinn checks

    ShipModuleOther:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            Generic module for all other slot types (BRIDGE, REACTOR, DRIVE,
            COMMS, HANGAR, QUARTERS, MEDICAL, WORKSHOP, CHAPEL, ESCAPE-PODS,
            CRYO, DOCKING, MINING, REPAIR, CONCEALED-HOLD, PROXY-DECK, OTHER).
            Stores descriptive data without additional structured fields.
          properties:
            slot:
              $ref: "#/components/schemas/ShipModuleSlot"

    # -------------------------------------------------------------------------
    # Ship module create variants (no id — server-assigned)
    # -------------------------------------------------------------------------

    ShipModuleWeaponCreate:
      type: object
      description: Create payload for a WEAPON ship module. No `id` — server-assigned.
      required: [slot, name, energyUse, weaponBonus, weaponRange, weaponDamage, weaponCritThreshold]
      properties:
        slot:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        weaponBonus:
          type: integer
          minimum: 0
          description: Modifier dice added to the attack pool
        weaponRange:
          $ref: "#/components/schemas/ShipWeaponRange"
        weaponDamage:
          type: integer
          minimum: 0
          description: Structural damage dealt on a hit
        weaponCritThreshold:
          type: integer
          minimum: 1
          description: Number of successes required to trigger a critical effect
        notes:
          type: ["string", "null"]
      example:
        slot: WEAPON
        name: Graviton Projector
        energyUse: 2
        weaponBonus: 1
        weaponRange: medium
        weaponDamage: 3
        weaponCritThreshold: 3
        notes: null

    ShipModuleTorpedoCreate:
      type: object
      description: Create payload for a TORPEDO ship module. No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          type: string
          enum: [TORPEDO]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        torpedoCount:
          type: integer
          minimum: 0
          default: 0
          description: Number of torpedoes currently loaded
        mineCount:
          type: integer
          minimum: 0
          default: 0
          description: Number of mines currently loaded
        notes:
          type: ["string", "null"]
      example:
        slot: TORPEDO
        name: Torpedo Bay Alpha
        energyUse: 1
        torpedoCount: 4
        mineCount: 0
        notes: null

    ShipModuleHoldCreate:
      type: object
      description: Create payload for a HOLD ship module. No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          type: string
          enum: [HOLD]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        cargoTons:
          type: integer
          minimum: 0
          default: 0
          description: Cargo capacity in tonnes
        concealed:
          type: boolean
          default: false
          description: True for a concealed hold
        notes:
          type: ["string", "null"]
      example:
        slot: HOLD
        name: Main Cargo Hold
        energyUse: 0
        cargoTons: 50
        concealed: false
        notes: null

    ShipModuleSensorCreate:
      type: object
      description: Create payload for a SENSOR ship module. No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          type: string
          enum: [SENSOR]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        detectionBonus:
          type: integer
          minimum: 0
          default: 1
          description: Modifier added to sensor / dataDjinn checks
        notes:
          type: ["string", "null"]
      example:
        slot: SENSOR
        name: Long-Range Sensor Tower
        energyUse: 1
        detectionBonus: 1
        notes: null

    ShipModuleOtherCreate:
      type: object
      description: |
        Create payload for any other ship module slot type (BRIDGE, REACTOR,
        DRIVE, COMMS, HANGAR, QUARTERS, MEDICAL, WORKSHOP, CHAPEL, ESCAPE-PODS,
        CRYO, DOCKING, MINING, REPAIR, CONCEALED-HOLD, PROXY-DECK, OTHER).
        No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: COMMS
        name: Long-Range Comms Array
        energyUse: 1
        notes: null

    # -------------------------------------------------------------------------
    # Ship module update variants (PATCH semantics — all fields optional)
    # -------------------------------------------------------------------------

    ShipModuleWeaponUpdate:
      type: object
      description: PATCH payload for a WEAPON ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        weaponBonus:
          type: integer
          minimum: 0
        weaponRange:
          $ref: "#/components/schemas/ShipWeaponRange"
        weaponDamage:
          type: integer
          minimum: 0
        weaponCritThreshold:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
      example:
        slot: WEAPON
        weaponDamage: 4

    ShipModuleTorpedoUpdate:
      type: object
      description: PATCH payload for a TORPEDO ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [TORPEDO]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        torpedoCount:
          type: integer
          minimum: 0
        mineCount:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: TORPEDO
        torpedoCount: 2

    ShipModuleHoldUpdate:
      type: object
      description: PATCH payload for a HOLD ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [HOLD]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        cargoTons:
          type: integer
          minimum: 0
        concealed:
          type: boolean
        notes:
          type: ["string", "null"]
      example:
        slot: HOLD
        cargoTons: 60

    ShipModuleSensorUpdate:
      type: object
      description: PATCH payload for a SENSOR ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [SENSOR]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        detectionBonus:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: SENSOR
        detectionBonus: 2

    ShipModuleOtherUpdate:
      type: object
      description: |
        PATCH payload for any other ship module slot type. All fields optional.
        The `slot` discriminator may not be changed after installation.
      properties:
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: COMMS
        notes: Upgraded to Mk II antenna

    ShipModule:
      description: |
        A discriminated union of all ship module variants. The `slot` field
        determines which variant applies. Generated clients produce a
        correctly-typed sum type from this schema.

        Mandatory modules (BRIDGE, REACTOR, DRIVE) are always present on a
        ship and are not individually manageable via the module CRUD endpoints.
        They appear in the `modules` array for completeness and energy tracking.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeapon"
        - $ref: "#/components/schemas/ShipModuleTorpedo"
        - $ref: "#/components/schemas/ShipModuleHold"
        - $ref: "#/components/schemas/ShipModuleSensor"
        - $ref: "#/components/schemas/ShipModuleOther"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeapon"
          TORPEDO: "#/components/schemas/ShipModuleTorpedo"
          HOLD: "#/components/schemas/ShipModuleHold"
          SENSOR: "#/components/schemas/ShipModuleSensor"
          BRIDGE: "#/components/schemas/ShipModuleOther"
          REACTOR: "#/components/schemas/ShipModuleOther"
          DRIVE: "#/components/schemas/ShipModuleOther"
          COMMS: "#/components/schemas/ShipModuleOther"
          HANGAR: "#/components/schemas/ShipModuleOther"
          QUARTERS: "#/components/schemas/ShipModuleOther"
          MEDICAL: "#/components/schemas/ShipModuleOther"
          WORKSHOP: "#/components/schemas/ShipModuleOther"
          CHAPEL: "#/components/schemas/ShipModuleOther"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOther"
          CRYO: "#/components/schemas/ShipModuleOther"
          DOCKING: "#/components/schemas/ShipModuleOther"
          MINING: "#/components/schemas/ShipModuleOther"
          REPAIR: "#/components/schemas/ShipModuleOther"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOther"
          PROXY-DECK: "#/components/schemas/ShipModuleOther"
          OTHER: "#/components/schemas/ShipModuleOther"

    ShipModuleCreate:
      description: |
        Payload for `POST /api/v1/ships/{id}/modules`. Same discriminated
        union as `ShipModule` but without `id` (server-assigned). The `slot`
        discriminator must be present.

        Note: BRIDGE, REACTOR, and DRIVE modules are created automatically
        with the ship and cannot be added via this endpoint.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeaponCreate"
        - $ref: "#/components/schemas/ShipModuleTorpedoCreate"
        - $ref: "#/components/schemas/ShipModuleHoldCreate"
        - $ref: "#/components/schemas/ShipModuleSensorCreate"
        - $ref: "#/components/schemas/ShipModuleOtherCreate"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeaponCreate"
          TORPEDO: "#/components/schemas/ShipModuleTorpedoCreate"
          HOLD: "#/components/schemas/ShipModuleHoldCreate"
          SENSOR: "#/components/schemas/ShipModuleSensorCreate"
          BRIDGE: "#/components/schemas/ShipModuleOtherCreate"
          REACTOR: "#/components/schemas/ShipModuleOtherCreate"
          DRIVE: "#/components/schemas/ShipModuleOtherCreate"
          COMMS: "#/components/schemas/ShipModuleOtherCreate"
          HANGAR: "#/components/schemas/ShipModuleOtherCreate"
          QUARTERS: "#/components/schemas/ShipModuleOtherCreate"
          MEDICAL: "#/components/schemas/ShipModuleOtherCreate"
          WORKSHOP: "#/components/schemas/ShipModuleOtherCreate"
          CHAPEL: "#/components/schemas/ShipModuleOtherCreate"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOtherCreate"
          CRYO: "#/components/schemas/ShipModuleOtherCreate"
          DOCKING: "#/components/schemas/ShipModuleOtherCreate"
          MINING: "#/components/schemas/ShipModuleOtherCreate"
          REPAIR: "#/components/schemas/ShipModuleOtherCreate"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOtherCreate"
          PROXY-DECK: "#/components/schemas/ShipModuleOtherCreate"
          OTHER: "#/components/schemas/ShipModuleOtherCreate"

    ShipModuleUpdate:
      description: |
        PATCH payload for `PATCH /api/v1/ship-modules/{id}`. The `slot`
        discriminator must match the installed module's slot — changing it
        returns 400 `SHIP_MODULE_SLOT_MISMATCH`. All fields optional.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeaponUpdate"
        - $ref: "#/components/schemas/ShipModuleTorpedoUpdate"
        - $ref: "#/components/schemas/ShipModuleHoldUpdate"
        - $ref: "#/components/schemas/ShipModuleSensorUpdate"
        - $ref: "#/components/schemas/ShipModuleOtherUpdate"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeaponUpdate"
          TORPEDO: "#/components/schemas/ShipModuleTorpedoUpdate"
          HOLD: "#/components/schemas/ShipModuleHoldUpdate"
          SENSOR: "#/components/schemas/ShipModuleSensorUpdate"
          BRIDGE: "#/components/schemas/ShipModuleOtherUpdate"
          REACTOR: "#/components/schemas/ShipModuleOtherUpdate"
          DRIVE: "#/components/schemas/ShipModuleOtherUpdate"
          COMMS: "#/components/schemas/ShipModuleOtherUpdate"
          HANGAR: "#/components/schemas/ShipModuleOtherUpdate"
          QUARTERS: "#/components/schemas/ShipModuleOtherUpdate"
          MEDICAL: "#/components/schemas/ShipModuleOtherUpdate"
          WORKSHOP: "#/components/schemas/ShipModuleOtherUpdate"
          CHAPEL: "#/components/schemas/ShipModuleOtherUpdate"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOtherUpdate"
          CRYO: "#/components/schemas/ShipModuleOtherUpdate"
          DOCKING: "#/components/schemas/ShipModuleOtherUpdate"
          MINING: "#/components/schemas/ShipModuleOtherUpdate"
          REPAIR: "#/components/schemas/ShipModuleOtherUpdate"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOtherUpdate"
          PROXY-DECK: "#/components/schemas/ShipModuleOtherUpdate"
          OTHER: "#/components/schemas/ShipModuleOtherUpdate"

    # -------------------------------------------------------------------------
    # Ship schemas
    # -------------------------------------------------------------------------

    Ship:
      type: object
      description: |
        Full Ship DTO as returned by the v1 API. Ship stats correspond to
        ST3001 ГЛАВА 7 Table 7.5 base stats, modified by the installed
        modules and upgrades.

        `hull.max` and `energy.max` are tracked as explicit editable values
        (not derived) because they can be altered by upgrades (Прочный корпус
        +1 hull, Мощный реактор +1 energy). `maneuverability` and `signature`
        are signed integers (negative values are valid per the class table).
      required:
        - id
        - ownerId
        - name
        - class
        - model
        - registry
        - hull
        - energy
        - armor
        - maneuverability
        - signature
        - speed
        - cargoCapacity
        - modules
        - crew
        - problems
        - history
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque ship identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Ship name (1–80 characters)
        class:
          $ref: "#/components/schemas/ShipClass"
        model:
          type: ["string", "null"]
          maxLength: 120
          description: Model / shipyard name (e.g. "Helebian Class III freighter")
        registry:
          type: ["string", "null"]
          maxLength: 40
          description: Registry number / transponder code (e.g. "KUA-7741-M")
        hull:
          type: object
          description: Structural integrity (Прочность in ST3001 ГЛАВА 7)
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Current hull points
            max:
              type: integer
              minimum: 0
              description: Maximum hull points (base per class + Прочный корпус upgrades)
        energy:
          type: object
          description: Reactor energy (Энергия in ST3001 ГЛАВА 7)
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Energy points currently available for allocation
            max:
              type: integer
              minimum: 0
              description: Maximum energy points (base per class + Мощный реактор upgrades)
        armor:
          type: integer
          minimum: 0
          description: Armor rating — number of dice rolled for the armor check (Броня)
        maneuverability:
          type: integer
          description: |
            Maneuverability modifier (Манёвренность). Signed integer — negative
            for large classes (Class IV is −1, Class V is −2). Affects pilot
            skill checks in ship combat per ST3001 ГЛАВА 7.
        signature:
          type: integer
          description: |
            Signature modifier (Заметность). Signed integer. Negative values
            mean the ship is harder to detect; positive values mean it is more
            visible. Applied to opponent sensor checks per ГЛАВА 7.
        speed:
          type: integer
          minimum: 0
          description: Speed in astronomical units per day (Скорость per ГЛАВА 7 Table 7.5)
        cargoCapacity:
          type: integer
          minimum: 0
          description: |
            Total cargo capacity in tonnes across all hold modules
            (Вместимость per ГЛАВА 7 Table 7.6: Class III = 50 tonnes).
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ShipModule"
          description: |
            Installed modules including the three mandatory ones (BRIDGE,
            REACTOR, DRIVE). Optional modules consume the class module-slot
            budget.
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewSlot"
          description: Crew assignment roster
        problems:
          type: array
          items:
            type: string
          description: |
            List of active ship problems (free-text entries, e.g. damage
            effects or wear-and-tear notes per ГЛАВА 7 wear table).
        history:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form ship history / background text (Markdown)
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: GM / player operational notes (Markdown)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ShipCreate:
      type: object
      description: |
        Payload for `POST /api/v1/ships`. `name` and `class` are required.
        Server populates base stats from the class table (ST3001 ГЛАВА 7
        Table 7.5) when not explicitly provided. The three mandatory modules
        (BRIDGE, REACTOR, DRIVE) are created automatically.
      required: [name, class]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        class:
          $ref: "#/components/schemas/ShipClass"
        model:
          type: ["string", "null"]
          maxLength: 120
        registry:
          type: ["string", "null"]
          maxLength: 40
        hull:
          type: object
          description: Override base hull stats from class table
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        energy:
          type: object
          description: Override base energy from class table
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        armor:
          type: integer
          minimum: 0
        maneuverability:
          type: integer
        signature:
          type: integer
        speed:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
          maxLength: 4096
        history:
          type: ["string", "null"]
          maxLength: 4096

    ShipUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/ships/{id}`. All fields optional.
        Read-only fields (`id`, `ownerId`, `createdAt`, `updatedAt`) are
        rejected with 400 if present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: ["string", "null"]
          maxLength: 120
        registry:
          type: ["string", "null"]
          maxLength: 40
        hull:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        energy:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        armor:
          type: integer
          minimum: 0
        maneuverability:
          type: integer
        signature:
          type: integer
        speed:
          type: integer
          minimum: 0
        problems:
          type: array
          items:
            type: string
          description: Replaces the entire problems list when provided
        history:
          type: ["string", "null"]
          maxLength: 4096
        notes:
          type: ["string", "null"]
          maxLength: 4096

    ShipList:
      type: object
      description: Cursor-paginated list of ships
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ship"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # System / realtime schemas (unchanged from 0.2.0)
    # -------------------------------------------------------------------------

    HealthStatus:
      type: object
      required: [status, version, uptimeSeconds, dependencies]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        version:
          type: ["string", "null"]
          description: Semantic version of the running backend build
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the backend process started
        dependencies:
          type: object
          required: [db, redis, centrifugo]
          properties:
            db:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            centrifugo:
              $ref: "#/components/schemas/DependencyStatus"

    # -------------------------------------------------------------------------
    # Share links (Epic 6 Feature 6.1)
    # -------------------------------------------------------------------------

    ShareLinkCreate:
      type: object
      description: |
        Request body for creating a share link. All fields are optional; an
        empty object `{}` creates a permanent link without GM notes.
      properties:
        includeGmNotes:
          type: boolean
          default: false
          description: |
            When true, the public character endpoint returns the top-level
            `notes` field. When false (default), `notes` is always null in the
            public response regardless of the character's actual notes value.
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: |
            ISO-8601 instant after which the link stops resolving. Omit or
            set to null for a permanent link.
        label:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            Optional human-readable label to distinguish this link from others
            in the owner's list (e.g. "GM copy", "public preview").

    ShareLink:
      type: object
      description: |
        A share link grants anonymous read-only access to a character via the
        `/api/v1/public/character/{slug}` endpoint.
      required:
        - id
        - slug
        - characterId
        - includeGmNotes
        - revokedAt
        - expiresAt
        - lastViewedAt
        - viewCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Opaque share-link identifier (cuid2). Used for revocation.
        slug:
          type: string
          minLength: 24
          maxLength: 24
          description: |
            24-character URL-safe slug. Use in the public URL:
            `/api/v1/public/character/{slug}`.
        characterId:
          type: string
          description: ID of the character this link exposes.
        includeGmNotes:
          type: boolean
          description: |
            Whether the `notes` field is included in the public character
            response. Always false if not set at creation time.
        label:
          type: ["string", "null"]
          description: Owner-assigned label for this link.
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: Expiry instant. Null for permanent links.
        revokedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            Revocation instant. Null if active. When set, the public endpoint
            returns 410 Gone.
        lastViewedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            ISO-8601 instant of the last recorded public view. Updated
            asynchronously (up to 60 seconds lag) via the view-tracker flush job.
            Null until the first view is flushed.
        viewCount:
          type: integer
          minimum: 0
          description: |
            Cumulative count of public views. Updated asynchronously; may lag
            by up to 60 seconds.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShareLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShareLink"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: ["string", "null"]
          format: uri
          default: about:blank
        title:
          type: ["string", "null"]
        status:
          type: integer
          format: int32
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        code:
          type: ["string", "null"]

    Me:
      type: object
      description: |
        The authenticated user's profile as exposed by the v1 API. Fields
        sourced from the Better Auth `user` table. `deletedAt` is an internal
        soft-delete flag and is never surfaced here — deleted users receive a
        404 because their sessions are revoked at deletion time.
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          description: Opaque user identifier issued by Better Auth (cuid2)
        email:
          type: string
          format: email
          description: Primary email address. Read-only via this API.
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name shown in share-link banners and the avatar
            menu. Null when the user has not set one yet.
        createdAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the account was created. Read-only via this API.
        theme:
          type: string
          enum: [dark, high-contrast]
          default: dark
          description: |
            UI theme preference. Synced across web + mobile so a player who
            toggles high-contrast on one device sees it everywhere.
            `dark` is the default; `high-contrast` increases colour contrast
            for users who need improved readability.

    MeUpdate:
      type: object
      description: |
        Partial update payload for PATCH /api/v1/me. `displayName` and `theme`
        are mutable. Omitting a property leaves the corresponding field unchanged.
        Setting `displayName` to null clears the field.
      properties:
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name. Must be 1–80 characters when non-null.
            Set to null to clear the field.
        theme:
          type: string
          enum: [dark, high-contrast]
          description: |
            UI theme preference. Must be one of `dark` or `high-contrast`.
            Omitting the field preserves the current value.

    RealtimeToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: ["string", "null"]
          description: Short-lived HMAC-signed JWT for Centrifugo
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the token expires
