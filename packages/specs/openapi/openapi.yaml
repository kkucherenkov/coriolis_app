              examples:
                rankOutOfRange:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: rank must be between 1 and 3
                    instance: /api/v1/talents/cuid_tal01
                    code: ATTRIBUTE_OUT_OF_RANGE
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the parent character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
