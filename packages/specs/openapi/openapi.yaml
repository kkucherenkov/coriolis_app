                    name: Pirate Scout
                    description: null
                    attributes:
                      strength: 2
                      agility: 2
                      wits: 2
                      empathy: 2
                    skills:
                      dexterity: 0
                      force: 0
                      infiltration: 0
                      manipulation: 0
                      meleeCombat: 0
                      observation: 0
                      rangedCombat: 0
                      survival: 0
                      command: 0
                      culture: 0
                      dataDjinn: 0
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 0
                      science: 0
                      technology: 0
                    hp:
                      current: 4
                      max: 4
                    mp:
                      current: 4
                      max: 4
                    signature: 0
                    armor: []
                    weapons: []
                    tags: []
                    keySkillModifier: 0
                    createdAt: "2026-05-10T12:00:00Z"
                    updatedAt: "2026-05-10T12:00:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `NPC_NAME_EMPTY` — name is an empty string.
