components:
  parameters:
    CharacterId:
      name: id
      in: path
      required: true
      description: Character identifier (cuid2)
      schema:
        type: string

    ItemId:
      name: id
      in: path
      required: true
      description: Item identifier (cuid2)
      schema:
        type: string

    TalentId:
      name: id
      in: path
      required: true
      description: Talent identifier (cuid2)
      schema:
        type: string

    ShipId:
      name: id
      in: path
      required: true
      description: Ship identifier (cuid2)
      schema:
        type: string

    ShipModuleId:
      name: id
      in: path
      required: true
      description: Ship module identifier (cuid2)
      schema:
        type: string

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth bearer token

  schemas:
    # -------------------------------------------------------------------------
    # Enumerations — define once, reference everywhere
    # -------------------------------------------------------------------------

    CriticalInjurySeverity:
      type: string
      enum: [light, severe, critical]
      description: |
        Severity tier of a critical injury per Coriolis core rules.
        - `light` — minor wound, no long-term mechanical effect.
        - `severe` — significant injury; may impose ongoing penalties.
        - `critical` — life-threatening; requires urgent medicurgy.

    DependencyStatus:
      type: ["string", "null"]
      enum: [ok, degraded, down]

    IconId:
      type: string
      enum:
        - lady-of-tears
        - traveler
        - messenger
        - merchant
        - dancer
        - gambler
        - judge
        - faceless-one
        - deckhand
      description: |
        One of the Nine Icons of the Third Horizon. Kebab-case names match
        the asset filenames in `packages/ui/src/assets/icons/`.

    ItemRangeEnum:
      type: string
      enum: [arm, near, short, long, distant]
      description: |
        Effective range band for a weapon. Matches the Coriolis core book
        range terminology:
        - `arm` — Engaged / hand-to-hand.
        - `near` — same room / close quarters.
        - `short` — corridor / street distance.
        - `long` — open ground / rooftop.
        - `distant` — sniper range.

    ItemSlotType:
      type: string
      enum: [bridge, hull, hold, weapon, drive, sensor, comms]
      description: |
        Ship module slot type. Used only for SHIP_MODULE items. Matches the
        slot categories from Coriolis core book ship construction rules.

    RelationshipKind:
      type: string
      enum: [ally, rival, family, mentor, debtor, creditor]
      description: |
        The nature of the relationship between a character and an NPC or PC.

    # -------------------------------------------------------------------------
    # Value objects
    # -------------------------------------------------------------------------

    Attributes:
      type: object
      description: |
        The four primary attributes per Coriolis core rules (PRD §5.2). Each
        is a 1–5 integer. All keys are required — missing attributes would
        make derived-stat calculation impossible server-side.
      required: [strength, agility, wits, empathy]
      properties:
        strength:
          type: integer
          minimum: 1
          maximum: 5
          description: STR — governs Force, Melee Combat skills and HP max
        agility:
          type: integer
          minimum: 1
          maximum: 5
          description: AGI — governs Dexterity, Infiltration, Ranged Combat, Pilot; contributes to HP max
        wits:
          type: integer
          minimum: 1
          maximum: 5
          description: WIT — governs Observation, Survival, Technology, Data Djinn, Science, Medicurgy; contributes to MP max
        empathy:
          type: integer
          minimum: 1
          maximum: 5
          description: EMP — governs Manipulation, Command, Culture, Mystic Powers; contributes to MP max

    Skills:
      type: object
      description: |
        The 16 skills per Coriolis core rules (PRD §5.2). General skills
        range 0–5; advanced skills (command, culture, dataDjinn, medicurgy,
        mysticPowers, pilot, science, technology) also range 0–5 in the
        schema — the "0–3 typical" note in the PRD describes usual play,
        not a hard cap, so the server accepts up to 5 for all skills.
        All keys are required.
      required:
        - dexterity
        - force
        - infiltration
        - manipulation
        - meleeCombat
        - observation
        - rangedCombat
        - survival
        - command
        - culture
        - dataDjinn
        - medicurgy
        - mysticPowers
        - pilot
        - science
        - technology
      properties:
        dexterity:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        force:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (STR)
        infiltration:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        manipulation:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (EMP)
        meleeCombat:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (STR)
        observation:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (WIT)
        rangedCombat:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        survival:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (WIT)
        command:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        culture:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        dataDjinn:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        medicurgy:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        mysticPowers:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        pilot:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (AGI)
        science:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        technology:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)

    ConditionFlags:
      type: object
      description: |
        Boolean flags for the four standard Coriolis conditions (PRD §5.2).
        Each active condition imposes a −1 die penalty on all rolls (capped
        at the character's pool size). Applied by the RulesEngine.
      required: [exhausted, sleepless, thirsty, hungry]
      properties:
        exhausted:
          type: boolean
          description: Exhausted condition — also blocks pushing rolls
        sleepless:
          type: boolean
        thirsty:
          type: boolean
        hungry:
          type: boolean

    CriticalInjury:
      type: object
      description: A critical injury entry on a character's sheet
      required: [id, name, severity, effect, acquiredAt]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        name:
          type: string
          description: Short name of the injury (e.g. "Broken arm")
        severity:
          $ref: "#/components/schemas/CriticalInjurySeverity"
        effect:
          type: string
          description: Free-text description of the mechanical or narrative effect
        acquiredAt:
          type: string
          format: date-time
          description: ISO-8601 instant when the injury was recorded

    Talent:
      type: object
      description: A talent owned by a character
      required: [id, name, description, rank, acquiredAt]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        name:
          type: string
          description: Talent name (e.g. "Wing-Mate", "Stunt Pilot")
        description:
          type: string
          description: Rules text or flavour description of the talent
        rank:
          type: integer
          minimum: 1
          maximum: 3
          description: Talent rank (1 = basic, 2 = journeyman, 3 = master)
        acquiredAt:
          type: string
          format: date-time
          description: ISO-8601 instant when the talent was recorded on the sheet

    TalentCreate:
      type: object
      description: Payload for creating a new talent
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          description: Talent name
        description:
          type: string
          description: Rules text or flavour description
        rank:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: Talent rank (defaults to 1 when not provided)

    TalentUpdate:
      type: object
      description: PATCH payload for updating a talent — all fields optional
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        rank:
          type: integer
          minimum: 1
          maximum: 3

    Relationship:
      type: object
      description: A relationship between a character and another person (NPC or PC)
      required: [id, targetName, kind]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        targetName:
          type: string
          description: Name of the NPC or PC (free text)
        kind:
          $ref: "#/components/schemas/RelationshipKind"
        notes:
          type: ["string", "null"]
          description: Optional notes about the relationship

    # -------------------------------------------------------------------------
    # Item discriminated union
    # -------------------------------------------------------------------------

    ItemBase:
      type: object
      description: Fields common to every item type
      required: [id, type, name]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        type:
          type: string
          description: Discriminator — determines which type-specific fields are present
        name:
          type: string
          minLength: 1
          description: Item name

    ItemWeapon:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [damage, range, bonus, crit, weight, features, equipped]
          properties:
            type:
              type: string
              enum: [WEAPON]
            damage:
              type: integer
              minimum: 0
              description: Base damage dice
            range:
              $ref: "#/components/schemas/ItemRangeEnum"
            bonus:
              type: integer
              minimum: 0
              description: Bonus dice added to the attack pool
            crit:
              type: integer
              minimum: 1
              description: Critical threshold (roll this many successes to crit)
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots (0.5 increments)
            features:
              type: array
              items:
                type: string
              description: Feature tags (e.g. "Burst", "Explosive")
            equipped:
              type: boolean
              description: Whether the item is currently equipped

    ItemArmor:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [armorRating, weight, features, equipped]
          properties:
            type:
              type: string
              enum: [ARMOR]
            armorRating:
              type: integer
              minimum: 0
              description: Armor rating — reduces incoming damage
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            features:
              type: array
              items:
                type: string
              description: Feature tags (e.g. "Vacuum Sealed", "Exo-Skeleton")
            equipped:
              type: boolean

    ItemGear:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight, quantity]
          properties:
            type:
              type: string
              enum: [GEAR]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            quantity:
              type: integer
              minimum: 1
              description: Number of units
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    ItemCybernetic:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [bodyPoints, effect]
          properties:
            type:
              type: string
              enum: [CYBERNETIC]
            bodyPoints:
              type: integer
              minimum: 0
              maximum: 6
              description: System strain points consumed (0–6)
            effect:
              type: string
              description: Description of the cybernetic's effect

    ItemShipModule:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [slot, effect]
          properties:
            type:
              type: string
              enum: [SHIP_MODULE]
            slot:
              $ref: "#/components/schemas/ItemSlotType"
            effect:
              type: string
              description: Description of the module's effect and energy use

    ItemOther:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight]
          properties:
            type:
              type: string
              enum: [OTHER]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    Item:
      description: |
        A discriminated union of all item types. The `type` field determines
        which variant applies. Generated clients produce a correctly-typed
        sum type from this schema.
      oneOf:
        - $ref: "#/components/schemas/ItemWeapon"
        - $ref: "#/components/schemas/ItemArmor"
        - $ref: "#/components/schemas/ItemGear"
        - $ref: "#/components/schemas/ItemCybernetic"
        - $ref: "#/components/schemas/ItemShipModule"
        - $ref: "#/components/schemas/ItemOther"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeapon"
          ARMOR: "#/components/schemas/ItemArmor"
          GEAR: "#/components/schemas/ItemGear"
          CYBERNETIC: "#/components/schemas/ItemCybernetic"
          SHIP_MODULE: "#/components/schemas/ItemShipModule"
          OTHER: "#/components/schemas/ItemOther"

    ItemCreate:
      description: |
        Payload for creating a new item. Same discriminated union as `Item`
        but without `id` (server-assigned). The `type` discriminator must
        be present.
      oneOf:
        - allOf:
            - type: object
              required: [type, name, damage, range, bonus, crit, weight, features, equipped]
              properties:
                type:
                  type: string
                  enum: [WEAPON]
                name:
                  type: string
                  minLength: 1
                damage:
                  type: integer
                  minimum: 0
                range:
                  $ref: "#/components/schemas/ItemRangeEnum"
                bonus:
                  type: integer
                  minimum: 0
                crit:
                  type: integer
                  minimum: 1
                weight:
                  type: number
                  minimum: 0
                features:
                  type: array
                  items:
                    type: string
                equipped:
                  type: boolean
        - allOf:
            - type: object
              required: [type, name, armorRating, weight, features, equipped]
              properties:
                type:
                  type: string
                  enum: [ARMOR]
                name:
                  type: string
                  minLength: 1
                armorRating:
                  type: integer
                  minimum: 0
                weight:
                  type: number
                  minimum: 0
                features:
                  type: array
                  items:
                    type: string
                equipped:
                  type: boolean
        - allOf:
            - type: object
              required: [type, name, weight, quantity]
              properties:
                type:
                  type: string
                  enum: [GEAR]
                name:
                  type: string
                  minLength: 1
                weight:
                  type: number
                  minimum: 0
                quantity:
                  type: integer
                  minimum: 1
                notes:
                  type: ["string", "null"]
        - allOf:
            - type: object
              required: [type, name, bodyPoints, effect]
              properties:
                type:
                  type: string
                  enum: [CYBERNETIC]
                name:
                  type: string
                  minLength: 1
                bodyPoints:
                  type: integer
                  minimum: 0
                  maximum: 6
                effect:
                  type: string
        - allOf:
            - type: object
              required: [type, name, slot, effect]
              properties:
                type:
                  type: string
                  enum: [SHIP_MODULE]
                name:
                  type: string
                  minLength: 1
                slot:
                  $ref: "#/components/schemas/ItemSlotType"
                effect:
                  type: string
        - allOf:
            - type: object
              required: [type, name, weight]
              properties:
                type:
                  type: string
                  enum: [OTHER]
                name:
                  type: string
                  minLength: 1
                weight:
                  type: number
                  minimum: 0
                notes:
                  type: ["string", "null"]
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemCreate/oneOf/0"
          ARMOR: "#/components/schemas/ItemCreate/oneOf/1"
          GEAR: "#/components/schemas/ItemCreate/oneOf/2"
          CYBERNETIC: "#/components/schemas/ItemCreate/oneOf/3"
          SHIP_MODULE: "#/components/schemas/ItemCreate/oneOf/4"
          OTHER: "#/components/schemas/ItemCreate/oneOf/5"

    ItemUpdate:
      description: |
        PATCH payload for updating an item. The `type` discriminator must
        match the existing item type — changing it returns 400
        `ITEM_TYPE_MISMATCH`. All fields are optional.
      type: object
      properties:
        name:
          type: string
          minLength: 1
        damage:
          type: integer
          minimum: 0
          description: WEAPON only
        range:
          $ref: "#/components/schemas/ItemRangeEnum"
          description: WEAPON only
        bonus:
          type: integer
          minimum: 0
          description: WEAPON only
        crit:
          type: integer
          minimum: 1
          description: WEAPON only
        armorRating:
          type: integer
          minimum: 0
          description: ARMOR only
        weight:
          type: number
          minimum: 0
        features:
          type: array
          items:
            type: string
          description: WEAPON or ARMOR
        equipped:
          type: boolean
          description: WEAPON or ARMOR
        quantity:
          type: integer
          minimum: 1
          description: GEAR only
        notes:
          type: ["string", "null"]
          description: GEAR or OTHER
        bodyPoints:
          type: integer
          minimum: 0
          maximum: 6
          description: CYBERNETIC only
        effect:
          type: string
          description: CYBERNETIC or SHIP_MODULE
        slot:
          $ref: "#/components/schemas/ItemSlotType"
          description: SHIP_MODULE only

    # -------------------------------------------------------------------------
    # Character schemas
    # -------------------------------------------------------------------------

    Character:
      type: object
      description: |
        Full character DTO as returned by the v1 API. Server-derived fields
        (`hp.max`, `mp.max`, `encumbrance.max`) are computed by the
        RulesEngine on every write and are marked `readOnly`.

        Formulas (PRD §5.2, §10):
        - HP max = STR + AGI
        - MP max = WIT + EMP
        - Encumbrance max = STR × 2
      required:
        - id
        - ownerId
        - name
        - concept
        - iconId
        - attributes
        - skills
        - hp
        - mp
        - encumbrance
        - experience
        - conditions
        - criticalInjuries
        - talents
        - relationships
        - inventory
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque character identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Character name (1–80 characters)
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
          description: Short concept phrase — the role the character plays at the table (1–120 chars when non-null)
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
          description: One of the Nine Icons, or null if not chosen yet
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR + AGI; set by the server
        mp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from WIT + EMP; set by the server
        encumbrance:
          type: object
          required: [current, max]
          properties:
            current:
              type: number
              minimum: 0
              readOnly: true
              description: Sum of non-stowed item weights; set by the server
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR × 2; set by the server
        experience:
          type: integer
          minimum: 0
          description: Total XP earned
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
        talents:
          type: array
          items:
            $ref: "#/components/schemas/Talent"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form notes (Markdown; soft cap 4096 characters)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CharacterCreate:
      type: object
      description: |
        Payload for `POST /api/v1/characters`. Only `name` is required.
        Attribute values default to 2 if the `attributes` object is omitted
        or a key within it is missing. Skill values default to 0.

        Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `createdAt`, `updatedAt`)
        must not be included; they are rejected with 400.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
          default: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        notes:
          type: ["string", "null"]
          maxLength: 4096

    CharacterUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/characters/{id}`. All fields are
        optional. Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `createdAt`, `updatedAt`)
        are rejected with 400 if present.

        Derived stats (`hp.max`, `mp.max`, `encumbrance.max`) are
        recalculated automatically after each successful write.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
          description: |
            Replaces the entire critical injuries list when provided.
            Use the dedicated nested-item pattern (POST/PATCH/DELETE on
            individual injuries) once that surface is added in a later epic.
        notes:
          type: ["string", "null"]
          maxLength: 4096

    CharacterList:
      type: object
      description: Cursor-paginated list of characters
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # Ship enumerations
    # -------------------------------------------------------------------------

    ShipClass:
      type: string
      enum:
        - fighter
        - shuttle
        - torpedo-boat
        - light-freighter
        - light-passenger
        - courier-yacht
        - clipper
        - patrol-boat
        - gunboat
        - assault-ship
        - blockade-runner
        - pleasure-yacht
        - flying-circus
        - prospector
        - rescue-ship
        - passenger-liner
        - heavy-freighter
        - cruiser
        - destroyer
        - heavy-cruiser
      description: |
        Ship hull class per ST3001 ГЛАВА 7 Table 7.4 (типы кораблей). The
        class determines the base stat block (energy, hull, maneuverability,
        signature, armor, speed, module slots) from Table 7.5. Kebab-case
        values map to the Russian originals in the rulebook.

        Class I examples: fighter, shuttle.
        Class II examples: torpedo-boat.
        Class III examples: light-freighter, light-passenger, courier-yacht,
          clipper, patrol-boat, gunboat, assault-ship, blockade-runner, pleasure-yacht.
        Class IV examples: flying-circus, prospector, rescue-ship, passenger-liner.
        Class V examples: heavy-cruiser, passenger-liner (large).

    ShipModuleSlot:
      type: string
      enum:
        - BRIDGE
        - REACTOR
        - DRIVE
        - HOLD
        - WEAPON
        - TORPEDO
        - SENSOR
        - COMMS
        - HANGAR
        - QUARTERS
        - MEDICAL
        - WORKSHOP
        - CHAPEL
        - ESCAPE-PODS
        - CRYO
        - DOCKING
        - MINING
        - REPAIR
        - CONCEALED-HOLD
        - PROXY-DECK
        - OTHER
      description: |
        Ship module slot type per ST3001 ГЛАВА 7 mandatory and optional module
        catalogue. `BRIDGE`, `REACTOR`, `DRIVE` are mandatory on every ship.
        All others are optional and consume module slots. The existing
        `ItemSlotType` enum covers character-inventory ship modules; this enum
        covers actual installed ship modules and provides richer coverage of
        the full ГЛАВА 7 catalogue.

    ShipWeaponRange:
      type: string
      enum: [zero, close, medium, long, extreme]
      description: |
        Ship-combat range bands per ST3001 ГЛАВА 7 Table 7.9. Distinct from
        the personal-scale `ItemRangeEnum`.
        - `zero` — point-blank / boarding range.
        - `close` — within a few hundred metres.
        - `medium` — standard engagement distance.
        - `long` — extended engagement.
        - `extreme` — maximum sensor range.

    CrewPosition:
      type: string
      enum:
        - captain
        - pilot
        - sensorOp
        - gunner
        - engineer
        - serviceCrew
      description: |
        Crew positions per ST3001 ГЛАВА 7 (crew roles). `sensorOp` is the
        штурман-оператор (navigator/sensor operator) in the rulebook, also
        responsible for combat-meme and info-impulse attacks. All positions
        except `captain` may be filled by automation (усовершенствование
        «Автоматика»).

    # -------------------------------------------------------------------------
    # Ship value objects
    # -------------------------------------------------------------------------

    CrewSlot:
      type: object
      description: |
        A crew position on a ship. Positions without an assigned character are
        vacant (open berth). Multiple characters may not share one position.
      required: [position]
      properties:
        position:
          $ref: "#/components/schemas/CrewPosition"
        assignedCharacterId:
          type: ["string", "null"]
          description: |
            ID of the assigned Character. Null when the berth is vacant.
            The character must be owned by the same user as the ship.

    # -------------------------------------------------------------------------
    # Ship module discriminated union
    # -------------------------------------------------------------------------

    ShipModuleBase:
      type: object
      description: Fields common to every ship module variant
      required: [id, slot, name, energyUse]
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque module identifier (cuid2)
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
          description: Module name (e.g. "Graviton Projector", "Smuggler hold")
        energyUse:
          type: integer
          minimum: 0
          description: Energy points consumed by this module when active
        notes:
          type: ["string", "null"]
          description: Free-text notes; used for damage state, special conditions, etc.

    ShipModuleWeapon:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            A ship weapon bay. Fields correspond to ST3001 ГЛАВА 7 Table 7.9.
          required: [weaponBonus, weaponRange, weaponDamage, weaponCritThreshold]
          properties:
            slot:
              type: string
              enum: [WEAPON]
            weaponBonus:
              type: integer
              minimum: 0
              description: Modifier dice added to the attack pool (Мод. column in Table 7.9)
            weaponRange:
              $ref: "#/components/schemas/ShipWeaponRange"
            weaponDamage:
              type: integer
              minimum: 0
              description: Structural damage dealt on a hit
            weaponCritThreshold:
              type: integer
              minimum: 1
              description: Number of successes required to trigger a critical effect

    ShipModuleTorpedo:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            A torpedo/mine bay per ST3001 ГЛАВА 7. Stores up to 4 torpedoes
            or 8 mines. Ammo is tracked separately.
          properties:
            slot:
              type: string
              enum: [TORPEDO]
            torpedoCount:
              type: integer
              minimum: 0
              description: Number of torpedoes currently loaded
            mineCount:
              type: integer
              minimum: 0
              description: Number of mines currently loaded

    ShipModuleHold:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: Cargo hold. Vented or concealed variant per ГЛАВА 7.
          properties:
            slot:
              type: string
              enum: [HOLD]
            cargoTons:
              type: integer
              minimum: 0
              description: Cargo capacity in tonnes (class-dependent per Table 7.6)
            concealed:
              type: boolean
              default: false
              description: True for a потайной грузовой отсек (concealed hold)

    ShipModuleSensor:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: Sensor tower upgrade. Provides +1 to sensor checks per ГЛАВА 7.
          properties:
            slot:
              type: string
              enum: [SENSOR]
            detectionBonus:
              type: integer
              minimum: 0
              default: 1
              description: Modifier added to sensor / dataDjinn checks

    ShipModuleOther:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            Generic module for all other slot types (BRIDGE, REACTOR, DRIVE,
            COMMS, HANGAR, QUARTERS, MEDICAL, WORKSHOP, CHAPEL, ESCAPE-PODS,
            CRYO, DOCKING, MINING, REPAIR, CONCEALED-HOLD, PROXY-DECK, OTHER).
            Stores descriptive data without additional structured fields.
          properties:
            slot:
              $ref: "#/components/schemas/ShipModuleSlot"

    ShipModule:
      description: |
        A discriminated union of all ship module variants. The `slot` field
        determines which variant applies. Generated clients produce a
        correctly-typed sum type from this schema.

        Mandatory modules (BRIDGE, REACTOR, DRIVE) are always present on a
        ship and are not individually manageable via the module CRUD endpoints.
        They appear in the `modules` array for completeness and energy tracking.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeapon"
        - $ref: "#/components/schemas/ShipModuleTorpedo"
        - $ref: "#/components/schemas/ShipModuleHold"
        - $ref: "#/components/schemas/ShipModuleSensor"
        - $ref: "#/components/schemas/ShipModuleOther"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeapon"
          TORPEDO: "#/components/schemas/ShipModuleTorpedo"
          HOLD: "#/components/schemas/ShipModuleHold"
          SENSOR: "#/components/schemas/ShipModuleSensor"
          BRIDGE: "#/components/schemas/ShipModuleOther"
          REACTOR: "#/components/schemas/ShipModuleOther"
          DRIVE: "#/components/schemas/ShipModuleOther"
          COMMS: "#/components/schemas/ShipModuleOther"
          HANGAR: "#/components/schemas/ShipModuleOther"
          QUARTERS: "#/components/schemas/ShipModuleOther"
          MEDICAL: "#/components/schemas/ShipModuleOther"
          WORKSHOP: "#/components/schemas/ShipModuleOther"
          CHAPEL: "#/components/schemas/ShipModuleOther"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOther"
          CRYO: "#/components/schemas/ShipModuleOther"
          DOCKING: "#/components/schemas/ShipModuleOther"
          MINING: "#/components/schemas/ShipModuleOther"
          REPAIR: "#/components/schemas/ShipModuleOther"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOther"
          PROXY-DECK: "#/components/schemas/ShipModuleOther"
          OTHER: "#/components/schemas/ShipModuleOther"

    ShipModuleCreate:
      description: |
        Payload for `POST /api/v1/ships/{id}/modules`. Same discriminated
        union as `ShipModule` but without `id` (server-assigned). The `slot`
        discriminator must be present.

        Note: BRIDGE, REACTOR, and DRIVE modules are created automatically
        with the ship and cannot be added via this endpoint.
      oneOf:
        - allOf:
            - type: object
              required: [slot, name, energyUse, weaponBonus, weaponRange, weaponDamage, weaponCritThreshold]
              properties:
                slot:
                  type: string
                  enum: [WEAPON]
                name:
                  type: string
                  minLength: 1
                energyUse:
                  type: integer
                  minimum: 0
                weaponBonus:
                  type: integer
                  minimum: 0
                weaponRange:
                  $ref: "#/components/schemas/ShipWeaponRange"
                weaponDamage:
                  type: integer
                  minimum: 0
                weaponCritThreshold:
                  type: integer
                  minimum: 1
                notes:
                  type: ["string", "null"]
        - allOf:
            - type: object
              required: [slot, name, energyUse]
              properties:
                slot:
                  type: string
                  enum: [TORPEDO]
                name:
                  type: string
                  minLength: 1
                energyUse:
                  type: integer
                  minimum: 0
                torpedoCount:
                  type: integer
                  minimum: 0
                  default: 0
                mineCount:
                  type: integer
                  minimum: 0
                  default: 0
                notes:
                  type: ["string", "null"]
        - allOf:
            - type: object
              required: [slot, name, energyUse]
              properties:
                slot:
                  type: string
                  enum: [HOLD]
                name:
                  type: string
                  minLength: 1
                energyUse:
                  type: integer
                  minimum: 0
                cargoTons:
                  type: integer
                  minimum: 0
                  default: 0
                concealed:
                  type: boolean
                  default: false
                notes:
                  type: ["string", "null"]
        - allOf:
            - type: object
              required: [slot, name, energyUse]
              properties:
                slot:
                  type: string
                  enum: [SENSOR]
                name:
                  type: string
                  minLength: 1
                energyUse:
                  type: integer
                  minimum: 0
                detectionBonus:
                  type: integer
                  minimum: 0
                  default: 1
                notes:
                  type: ["string", "null"]
        - allOf:
            - type: object
              required: [slot, name, energyUse]
              properties:
                slot:
                  type: string
                  enum:
                    - BRIDGE
                    - REACTOR
                    - DRIVE
                    - COMMS
                    - HANGAR
                    - QUARTERS
                    - MEDICAL
                    - WORKSHOP
                    - CHAPEL
                    - ESCAPE-PODS
                    - CRYO
                    - DOCKING
                    - MINING
                    - REPAIR
                    - CONCEALED-HOLD
                    - PROXY-DECK
                    - OTHER
                name:
                  type: string
                  minLength: 1
                energyUse:
                  type: integer
                  minimum: 0
                notes:
                  type: ["string", "null"]
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleCreate/oneOf/0"
          TORPEDO: "#/components/schemas/ShipModuleCreate/oneOf/1"
          HOLD: "#/components/schemas/ShipModuleCreate/oneOf/2"
          SENSOR: "#/components/schemas/ShipModuleCreate/oneOf/3"
          BRIDGE: "#/components/schemas/ShipModuleCreate/oneOf/4"
          REACTOR: "#/components/schemas/ShipModuleCreate/oneOf/4"
          DRIVE: "#/components/schemas/ShipModuleCreate/oneOf/4"
          COMMS: "#/components/schemas/ShipModuleCreate/oneOf/4"
          HANGAR: "#/components/schemas/ShipModuleCreate/oneOf/4"
          QUARTERS: "#/components/schemas/ShipModuleCreate/oneOf/4"
          MEDICAL: "#/components/schemas/ShipModuleCreate/oneOf/4"
          WORKSHOP: "#/components/schemas/ShipModuleCreate/oneOf/4"
          CHAPEL: "#/components/schemas/ShipModuleCreate/oneOf/4"
          ESCAPE-PODS: "#/components/schemas/ShipModuleCreate/oneOf/4"
          CRYO: "#/components/schemas/ShipModuleCreate/oneOf/4"
          DOCKING: "#/components/schemas/ShipModuleCreate/oneOf/4"
          MINING: "#/components/schemas/ShipModuleCreate/oneOf/4"
          REPAIR: "#/components/schemas/ShipModuleCreate/oneOf/4"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleCreate/oneOf/4"
          PROXY-DECK: "#/components/schemas/ShipModuleCreate/oneOf/4"
          OTHER: "#/components/schemas/ShipModuleCreate/oneOf/4"

    ShipModuleUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/ship-modules/{id}`. The `slot`
        discriminator may not be changed after installation. All fields
        optional.
      properties:
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
        weaponBonus:
          type: integer
          minimum: 0
          description: WEAPON only
        weaponRange:
          $ref: "#/components/schemas/ShipWeaponRange"
          description: WEAPON only
        weaponDamage:
          type: integer
          minimum: 0
          description: WEAPON only
        weaponCritThreshold:
          type: integer
          minimum: 1
          description: WEAPON only
        torpedoCount:
          type: integer
          minimum: 0
          description: TORPEDO only
        mineCount:
          type: integer
          minimum: 0
          description: TORPEDO only
        cargoTons:
          type: integer
          minimum: 0
          description: HOLD only
        concealed:
          type: boolean
          description: HOLD only
        detectionBonus:
          type: integer
          minimum: 0
          description: SENSOR only

    # -------------------------------------------------------------------------
    # Ship schemas
    # -------------------------------------------------------------------------

    Ship:
      type: object
      description: |
        Full Ship DTO as returned by the v1 API. Ship stats correspond to
        ST3001 ГЛАВА 7 Table 7.5 base stats, modified by the installed
        modules and upgrades.

        `hull.max` and `energy.max` are tracked as explicit editable values
        (not derived) because they can be altered by upgrades (Прочный корпус
        +1 hull, Мощный реактор +1 energy). `maneuverability` and `signature`
        are signed integers (negative values are valid per the class table).
      required:
        - id
        - ownerId
        - name
        - class
        - model
        - registry
        - hull
        - energy
        - armor
        - maneuverability
        - signature
        - speed
        - cargoCapacity
        - modules
        - crew
        - problems
        - history
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque ship identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Ship name (1–80 characters)
        class:
          $ref: "#/components/schemas/ShipClass"
        model:
          type: ["string", "null"]
          maxLength: 120
          description: Model / shipyard name (e.g. "Helebian Class III freighter")
        registry:
          type: ["string", "null"]
          maxLength: 40
          description: Registry number / transponder code (e.g. "KUA-7741-M")
        hull:
          type: object
          description: Structural integrity (Прочность in ST3001 ГЛАВА 7)
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Current hull points
            max:
              type: integer
              minimum: 0
              description: Maximum hull points (base per class + Прочный корпус upgrades)
        energy:
          type: object
          description: Reactor energy (Энергия in ST3001 ГЛАВА 7)
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Energy points currently available for allocation
            max:
              type: integer
              minimum: 0
              description: Maximum energy points (base per class + Мощный реактор upgrades)
        armor:
          type: integer
          minimum: 0
          description: Armor rating — number of dice rolled for the armor check (Броня)
        maneuverability:
          type: integer
          description: |
            Maneuverability modifier (Манёвренность). Signed integer — negative
            for large classes (Class IV is −1, Class V is −2). Affects pilot
            skill checks in ship combat per ST3001 ГЛАВА 7.
        signature:
          type: integer
          description: |
            Signature modifier (Заметность). Signed integer. Negative values
            mean the ship is harder to detect; positive values mean it is more
            visible. Applied to opponent sensor checks per ГЛАВА 7.
        speed:
          type: integer
          minimum: 0
          description: Speed in astronomical units per day (Скорость per ГЛАВА 7 Table 7.5)
        cargoCapacity:
          type: integer
          minimum: 0
          description: |
            Total cargo capacity in tonnes across all hold modules
            (Вместимость per ГЛАВА 7 Table 7.6: Class III = 50 tonnes).
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ShipModule"
          description: |
            Installed modules including the three mandatory ones (BRIDGE,
            REACTOR, DRIVE). Optional modules consume the class module-slot
            budget.
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewSlot"
          description: Crew assignment roster
        problems:
          type: array
          items:
            type: string
          description: |
            List of active ship problems (free-text entries, e.g. damage
            effects or wear-and-tear notes per ГЛАВА 7 wear table).
        history:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form ship history / background text (Markdown)
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: GM / player operational notes (Markdown)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ShipCreate:
      type: object
      description: |
        Payload for `POST /api/v1/ships`. `name` and `class` are required.
        Server populates base stats from the class table (ST3001 ГЛАВА 7
        Table 7.5) when not explicitly provided. The three mandatory modules
        (BRIDGE, REACTOR, DRIVE) are created automatically.
      required: [name, class]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        class:
          $ref: "#/components/schemas/ShipClass"
        model:
          type: ["string", "null"]
          maxLength: 120
        registry:
          type: ["string", "null"]
          maxLength: 40
        hull:
          type: object
          description: Override base hull stats from class table
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        energy:
          type: object
          description: Override base energy from class table
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        armor:
          type: integer
          minimum: 0
        maneuverability:
          type: integer
        signature:
          type: integer
        speed:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
          maxLength: 4096
        history:
          type: ["string", "null"]
          maxLength: 4096

    ShipUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/ships/{id}`. All fields optional.
        Read-only fields (`id`, `ownerId`, `createdAt`, `updatedAt`) are
        rejected with 400 if present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: ["string", "null"]
          maxLength: 120
        registry:
          type: ["string", "null"]
          maxLength: 40
        hull:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        energy:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        armor:
          type: integer
          minimum: 0
        maneuverability:
          type: integer
        signature:
          type: integer
        speed:
          type: integer
          minimum: 0
        problems:
          type: array
          items:
            type: string
          description: Replaces the entire problems list when provided
        history:
          type: ["string", "null"]
          maxLength: 4096
        notes:
          type: ["string", "null"]
          maxLength: 4096

    ShipList:
      type: object
      description: Cursor-paginated list of ships
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ship"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # System / realtime schemas (unchanged from 0.2.0)
    # -------------------------------------------------------------------------

    HealthStatus:
      type: object
      required: [status, version, uptimeSeconds, dependencies]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        version:
          type: ["string", "null"]
          description: Semantic version of the running backend build
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the backend process started
        dependencies:
          type: object
          required: [db, redis, centrifugo]
          properties:
            db:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            centrifugo:
              $ref: "#/components/schemas/DependencyStatus"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: ["string", "null"]
          format: uri
          default: about:blank
        title:
          type: ["string", "null"]
        status:
          type: integer
          format: int32
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        code:
          type: ["string", "null"]

    Me:
      type: object
      description: |
        The authenticated user's profile as exposed by the v1 API. Fields
        sourced from the Better Auth `user` table. `deletedAt` is an internal
        soft-delete flag and is never surfaced here — deleted users receive a
        404 because their sessions are revoked at deletion time.
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          description: Opaque user identifier issued by Better Auth (cuid2)
        email:
          type: string
          format: email
          description: Primary email address. Read-only via this API.
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name shown in share-link banners and the avatar
            menu. Null when the user has not set one yet.
        createdAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the account was created. Read-only via this API.

    MeUpdate:
      type: object
      description: |
        Partial update payload for PATCH /api/v1/me. Only `displayName` is
        mutable. Omitting a property leaves the corresponding field unchanged.
        Setting `displayName` to null clears the field.
      properties:
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name. Must be 1–80 characters when non-null.
            Set to null to clear the field.

    RealtimeToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: ["string", "null"]
          description: Short-lived HMAC-signed JWT for Centrifugo
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the token expires
