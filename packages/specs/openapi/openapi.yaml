                    code: SHARE_LINK_REVOKED
                expired:
                  value:
                    type: https://coriolis.example.com/problems/gone
                    title: Gone
                    status: 410
                    detail: Share link 3Bk7NzYqAcMpRvWxDjGhTs4Q has expired
                    instance: /api/v1/public/character/3Bk7NzYqAcMpRvWxDjGhTs4Q
                    code: SHARE_LINK_EXPIRED

  /api/v1/public/og/character/{slug}.png:
    get:
      operationId: getCharacterOgImage
      summary: OG image for a shared character (Feature 6.3 — not yet implemented)
      description: |
        Returns a PNG Open Graph image for the shared character. Intended for
        social-media preview unfurling.

        **This endpoint is not yet implemented.** It will always return 501
        until Feature 6.3 lands the server-side renderer. Consumers should plan
        for the following cache headers on the eventual 200 response:
        `Cache-Control: public, max-age=3600, stale-while-revalidate=86400`.
      tags: [public]
      parameters:
        - $ref: "#/components/parameters/ShareSlug"
      responses:
        "200":
          description: PNG image (Feature 6.3 — not yet implemented)
          content:
            image/png:
              schema:
                type: string
                format: binary
        "501":
          description: OG image renderer not yet implemented (ships in Feature 6.3)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notImplemented:
                  value:
                    type: https://errors.coriolis-companion.app/og-not-implemented
                    title: OG image renderer not yet implemented
                    status: 501
                    detail: The OG image renderer ships in Epic 6 Feature 6.3.
                    code: OG_NOT_IMPLEMENTED

  /api/v1/characters/{id}/rolls:
    post:
      operationId: createRoll
      summary: Roll dice for a character
      description: |
        Rolls `pool` d6 server-side using a cryptographically secure RNG.
        Hits are counted as the number of 6s. The caller provides a human-readable
        `label` (e.g. "Pilot · Evade") and an optional `gameSessionId` (reserved for
        Feature 7.2 — pass null until GameSession lands).

        Pool is clamped by the server from the submitted value. Condition penalties
        must be pre-applied by the caller before sending `pool`; the server does not
        re-apply them from character state.
      tags: [dice]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollCreate"
      responses:
        "201":
          description: Roll created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roll"
        "400":
          description: Validation error (pool out of range, label too long, etc.)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      operationId: listRolls
      summary: List roll history for a character
      description: |
        Returns the most recent rolls for the character, ordered newest-first.
        Default limit is 50; maximum is 100.
      tags: [dice]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
        - name: limit
          in: query
          required: false
          description: Number of rolls to return (1–100, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Roll history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollList"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/rolls/{id}/push:
    patch:
      operationId: pushRoll
      summary: Push (reroll) a roll
      description: |
        Rerolls all non-6 dice exactly once. After a push the roll cannot be
        pushed again (`pushed` becomes `true`). Returns 422 with code
        `ROLL_NOT_PUSHABLE` if:
        - The roll has already been pushed.
        - The owning character has the Exhausted condition (PRD §10).
      tags: [dice]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RollId"
      responses:
        "200":
          description: Roll pushed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roll"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the character this roll belongs to
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Roll not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Roll cannot be pushed (already pushed or character is exhausted)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                alreadyPushed:
                  value:
                    type: about:blank
                    title: Roll cannot be pushed
                    status: 422
                    detail: This roll has already been pushed once. Dice are final.
                    code: ROLL_NOT_PUSHABLE
                exhausted:
                  value:
                    type: about:blank
                    title: Roll cannot be pushed
                    status: 422
                    detail: The character is Exhausted and cannot push rolls (PRD §10).
                    code: ROLL_NOT_PUSHABLE

components:
  parameters:
    CharacterId:
      name: id
      in: path
      required: true
      description: Character identifier (cuid2)
      schema:
        type: string

    ItemId:
      name: id
      in: path
      required: true
      description: Item identifier (cuid2)
      schema:
        type: string

    TalentId:
      name: id
      in: path
      required: true
      description: Talent identifier (cuid2)
      schema:
        type: string

    ShipId:
      name: id
      in: path
      required: true
      description: Ship identifier (cuid2)
      schema:
        type: string

    ShipModuleId:
      name: id
      in: path
      required: true
      description: Ship module identifier (cuid2)
      schema:
        type: string

    ShareLinkId:
      name: id
      in: path
      required: true
      description: Share link identifier (cuid2)
      schema:
        type: string

    ShareSlug:
      name: slug
      in: path
      required: true
      description: 24-character unambiguous nanoid slug identifying a share link
      schema:
        type: string
        minLength: 24
        maxLength: 24

    RollId:
      name: id
      in: path
      required: true
      description: Roll identifier (cuid2)
      schema:
        type: string

    GameSessionId:
      name: id
      in: path
      required: true
      description: Game session identifier (cuid2)
      schema:
        type: string

    NpcId:
      name: id
      in: path
      required: true
      description: NPC identifier (cuid2)
      schema:
        type: string

    EncounterId:
      name: id
      in: path
      required: true
      description: Encounter identifier (cuid2)
      schema:
        type: string

    CombatantId:
      name: id
      in: path
      required: true
      description: Combatant identifier (cuid2)
      schema:
        type: string

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth bearer token

  schemas:
    # -------------------------------------------------------------------------
    # Dice roll schemas (Epic 7, Feature 7.1)
    # -------------------------------------------------------------------------

    Roll:
      type: object
      description: |
        A single Coriolis dice roll. Dice are rolled server-side using a
        cryptographically secure RNG. Hits = count of 6s. A roll can be pushed
        at most once (PRD §10). `gameSessionId` is null until Feature 7.2 lands.
      required:
        - id
        - characterId
        - label
        - pool
        - dice
        - hits
        - pushed
        - createdAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque roll identifier (cuid2)
        characterId:
          type: string
          readOnly: true
          description: Identifier of the character who made the roll
        gameSessionId:
          type: ["string", "null"]
          description: |
            Game session this roll belongs to. Null until Feature 7.2
            (GameSession resource) ships. Clients should tolerate null.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Human-readable roll label, e.g. "Pilot · Evade"
        pool:
          type: integer
          minimum: 0
          maximum: 20
          description: |
            Number of d6 rolled (after condition penalties applied by caller).
            `0` triggers the «Ноль кубиков» rule (ГЛАВА 3 line 161): the engine
            still rolls 2d6, but the proverka counts as a success only when
            both dice come up 6.
            PRD override — Coriolis ST3001 does not name a hard upper bound.
            We cap at 20 to keep DB rows and wire payloads bounded; realistic
            attribute + skill + gear + helpers stacks max out around 12–14.
        dice:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 6
          description: |
            Current face values of all dice. After a push, rerolled non-6 values
            are updated in place. Length normally equals `pool`; for the zero-
            dice case (`pool === 0`) the array always has 2 elements regardless.
        hits:
          type: integer
          readOnly: true
          minimum: 0
          description: Number of 6s in the current dice array
        pushed:
          type: boolean
          description: Whether this roll has been pushed. Once true, further pushes are rejected.
        createdAt:
          type: string
          format: date-time
          readOnly: true

    RollCreate:
      type: object
      description: Payload for POST /api/v1/characters/{id}/rolls
      required:
        - label
        - pool
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Human-readable roll label, e.g. "Pilot · Evade"
        pool:
          type: integer
          minimum: 0
          maximum: 20
          description: |
            Number of d6 to roll. Must be between 0 and 20 inclusive.
            Condition pool penalties must be pre-applied by the caller before
            submitting.

            «Ноль кубиков» (ГЛАВА 3 line 161): if modifiers reduce the pool to
            zero (or below), submit `pool: 0`. The engine then rolls 2d6 and
            counts a success only when both dice are 6.

            PRD override — ST3001 does not name a hard upper bound. We cap at
            20 to keep wire payloads bounded; realistic attribute + skill + gear
            + helpers stacks max out around 12–14.
        gameSessionId:
          type: ["string", "null"]
          description: |
            Optional game session identifier. Reserved for Feature 7.2.
            Pass null or omit until GameSession lands.

    RollList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Roll"

    # -------------------------------------------------------------------------
    # Enumerations — define once, reference everywhere
    # -------------------------------------------------------------------------

    CriticalInjurySeverity:
      type: string
      enum: [light, severe, critical]
      description: |
        Severity tier of a critical injury per Coriolis core rules.
        - `light` — minor wound, no long-term mechanical effect.
        - `severe` — significant injury; may impose ongoing penalties.
        - `critical` — life-threatening; requires urgent medicurgy.

    DependencyStatus:
      type: ["string", "null"]
      enum: [ok, degraded, down]

    IconId:
      type: string
      enum:
        - lady-of-tears
        - traveler
        - messenger
        - merchant
        - dancer
        - gambler
        - judge
        - faceless-one
        - deckhand
      description: |
        One of the Nine Icons of the Third Horizon. Kebab-case names match
        the asset filenames in `packages/ui/src/assets/icons/`.

    Concept:
      type: string
      enum:
        - artist
        - networker
        - fugitive
        - negotiator
        - operative
        - pilot
        - pioneer
        - preacher
        - scientist
        - sailor
        - soldier
      description: |
        The 11 character archetypes (амплуа) from Coriolis ST3001 ch.2.
        Each concept has a key attribute (capped at 5 instead of 4 at
        creation) and a set of key skills (capped at 3 instead of 1 at
        creation), and applies a reputation modifier to the upbringing
        baseline. Mappings live server-side in the RulesEngine
        (`CONCEPT_KEYS`).

        | Concept     | Key attribute | Reputation modifier |
        | ----------- | ------------- | ------------------- |
        | artist      | empathy       | +1                  |
        | networker   | wits          |  0                  |
        | fugitive    | empathy       | −2                  |
        | negotiator  | empathy       | +1                  |
        | operative   | agility       |  0                  |
        | pilot       | agility       |  0                  |
        | pioneer     | wits          |  0                  |
        | preacher    | empathy       | +1                  |
        | scientist   | wits          | +1                  |
        | sailor      | strength      | −1                  |
        | soldier     | agility       | −1                  |

    Role:
      type: string
      enum:
        # artist
        - companion
        - musician
        - poet
        # networker
        - analyst
        - correspondent
        - network-djinn
        # fugitive
        - criminal
        - mystic
        - revolutionary
        # negotiator
        - agitator
        - diplomat
        - dealer
        # operative
        - assassin
        - guard
        - spy
        # pilot
        - ace
        - driver
        - trucker
        # pioneer
        - colonist
        - prospector
        - scout
        # preacher
        - ascetic
        - missionary
        - prophet
        # scientist
        - archaeologist
        - medicurg
        - technologist
        # sailor
        - ship-engineer
        - labourer
        - loader
        # soldier
        - legionnaire
        - mercenary
        - officer
      description: |
        Coriolis canonical role (роль) within an amplua (ГЛАВА 2
        «АМПЛУА И РОЛИ»). The 11 amplua each have exactly three roles;
        a character picks one role at creation. The role narrows the
        amplua's union of key skills to exactly four of them — those
        four are the character's own key skills.

        Skill caps at creation time (per ST3001 ch.2):
        - Key skill (role's four): up to 3 points
        - Non-key skill: up to 1 point

        Role + concept together drive the creation-time validation;
        the server enforces `ROLE_CONCEPT_MISMATCH` when the chosen
        role does not belong to the chosen concept.

        Role names are unique across all amplua, so this enum is flat.

        Russian display names:
        companion=Компаньон, musician=Музыкант, poet=Поэт,
        analyst=Аналитик, correspondent=Корреспондент,
        network-djinn=Сетевой джинн, criminal=Преступник,
        mystic=Мистик, revolutionary=Революционер,
        agitator=Агитатор, diplomat=Дипломат, dealer=Делец,
        assassin=Ассасин, guard=Стражник, spy=Шпион,
        ace=Ас, driver=Водитель, trucker=Дальнобойщик,
        colonist=Колонист, prospector=Старатель, scout=Скаут,
        ascetic=Аскет, missionary=Миссионер, prophet=Пророк,
        archaeologist=Археолог, medicurg=Медикург,
        technologist=Технологик, ship-engineer=Бортинженер,
        labourer=Разнорабочий, loader=Грузчик,
        legionnaire=Легионер, mercenary=Наёмник, officer=Офицер.

    Upbringing:
      type: string
      enum: [plebeian, stationary, aristocrat]
      description: |
        Social stratum a character was raised in (Coriolis core book ch.2,
        table 2.2 — "Воспитание"). Upbringing is set once at character
        creation and is **immutable**; it determines the starting
        attribute / skill point budgets, the starting reputation, and the
        starting wealth (in birrs) the character is created with.

        | Upbringing  | Attribute pts | Skill pts | Reputation | Wealth (birrs) |
        | ----------- | ------------- | --------- | ---------- | -------------- |
        | plebeian    | 15            | 8         | 2          |   500          |
        | stationary  | 14            | 10        | 4          |  1000          |
        | aristocrat  | 13            | 12        | 6          |  5000          |

    CrewConcept:
      type: string
      enum:
        - free-trader
        - mercenary
        - explorer
        - agents
        - pilgrim
      description: |
        Crew archetype (амплуа команды) per Coriolis ST3001 ch.2
        §АМПЛУА КОМАНДЫ. Five canonical crews — `free-trader`
        (Вольные торговцы), `mercenary` (Наёмники), `explorer`
        (Исследователи), `agents` (Агенты), `pilgrim` (Пилигримы).

        The crew concept is shared by all heroes in a campaign and
        determines the pool of three crew talents the team picks from
        at creation (one of which becomes each hero's starting "crew"
        kind talent — see `TalentKind`). Crew concept is mutable while
        the character is `draft` and immutable once `active`.

    MutantLineage:
      type: string
      enum:
        - zirba
        - shingura
        - nerida
      description: |
        Mutant lineage (родословная пасынков) per Coriolis ST3001 ch.4
        §Стигмы пасынков. Three canonical lineages —
        `zirba` (Зирба), `shingura` (Шингура), `nerida` (Нерида) —
        each backed by a stigma talent in the catalog
        (`stigma-zirba`, `stigma-shingura`, `stigma-nerida`).

        Set together with `Character.mutant=true` at creation; both
        fields are mutable while `status: draft` and immutable once the
        character is `active`. A non-mutant character must not carry a
        `stigma` talent — `AddTalent` rejects this combination with
        `STIGMA_REQUIRES_MUTANT`.

    TalentKind:
      type: string
      enum: [personal, crew, iconGift, stigma]
      description: |
        Discriminator for `Talent.kind` per Coriolis ST3001 ch.2 (3
        starting talents: one personal from amplua, one crew from
        crew-amplua, one icon gift from chosen icon) and ch.4
        (mutants additionally pick one `stigma`).

        Each character has at most one talent of each `personal`,
        `crew`, `iconGift`, `stigma` at character creation; further
        talents acquired during play are always `personal`.

        - `personal`  — picked from the amplua's personal talent list
        - `crew`      — picked from the team's crew amplua list
        - `iconGift`  — auto-derived from the character's `iconId`
        - `stigma`    — only for mutants (`Character.mutant=true`);
                        picked from the catalog's three lineage
                        stigmas — see `MutantLineage`. Adding a
                        `stigma` talent to a non-mutant character is
                        rejected with `STIGMA_REQUIRES_MUTANT`.

    ItemRangeEnum:
      type: string
      enum: [close, medium, long, extreme]
      description: |
        Personal-scale weapon range bands per ST3001 ГЛАВА 5 «Дистанция»
        (lines 73-78 of the Russian rulebook). Four bands by canon —
        each absorbs the previous (a target at `medium` is also at `close`
        for any rule that talks about "within X").
        - `close` — Ближняя, up to 2 m (engaged / hand-to-hand /
          same-room close quarters; absorbs the legacy `arm` and `near`
          values).
        - `medium` — Средняя, up to 20 m (corridor / street; absorbs the
          legacy `short`).
        - `long` — Дальняя, up to 100 m (open ground / rooftop; same
          slug as the legacy value, semantics narrowed).
        - `extreme` — Предельная, up to 1000 m (sniper / max effective;
          absorbs the legacy `distant`).
        Distinct from `ShipWeaponRange` (5-band ship-combat ladder
        from ГЛАВА 7 Table 7.9 — that enum keeps its `zero` band).

    ItemSlotType:
      type: string
      enum: [bridge, hull, hold, weapon, drive, sensor, comms]
      description: |
        Ship module slot type. Used only for SHIP_MODULE items. Matches the
        slot categories from Coriolis core book ship construction rules.

    RelationshipKind:
      type: string
      enum: [ally, rival, family, mentor, debtor, creditor]
      description: |
        The nature of the relationship between a character and an NPC or PC.

    # -------------------------------------------------------------------------
    # Value objects
    # -------------------------------------------------------------------------

    Attributes:
      type: object
      description: |
        The four primary attributes per Coriolis core rules (ГЛАВА 2 «ХАРАКТЕРИСТИКИ»). The rulebook
        states characteristics are scored 1–5, but at character creation the wizard distributes pools
        so each attribute lands in `2..4` (5 for the amplua's key attribute), and there is no in-game
        mechanic that lowers an attribute below 2 once a character has been created. Server-side bounds
        therefore reflect the **active-PC invariant** (2..5) rather than the abstract scale: a stored
        character with `strength: 1` would never be reachable through canonical play. The 5-cap stays
        as the lifetime maximum (ГЛАВА 2 §РАЗВИТИЕ ПЕРСОНАЖА — "максимально возможное значение
        характеристики равно 5"). All four keys are required — missing attributes would make
        derived-stat calculation impossible server-side.
      required: [strength, agility, wits, empathy]
      properties:
        strength:
          type: integer
          minimum: 2
          maximum: 5
          description: STR — governs Force, Melee Combat skills and HP max
        agility:
          type: integer
          minimum: 2
          maximum: 5
          description: AGI — governs Dexterity, Infiltration, Ranged Combat, Pilot; contributes to HP max
        wits:
          type: integer
          minimum: 2
          maximum: 5
          description: WIT — governs Observation, Survival, Technology, Data Djinn, Science, Medicurgy; contributes to MP max
        empathy:
          type: integer
          minimum: 2
          maximum: 5
          description: EMP — governs Manipulation, Command, Culture, Mystic Powers; contributes to MP max

    Skills:
      type: object
      description: |
        The 16 canonical Coriolis skills (ГЛАВА 3 «Перечень навыков»), 8 general
        (`dexterity, force, infiltration, manipulation, meleeCombat, observation, rangedCombat,
        survival`) and 8 advanced/specialised (`command, culture, dataDjinn, medicurgy,
        mysticPowers, pilot, science, technology`). All skills range 0..5 server-side; the
        lifetime cap of 5 is canon (ГЛАВА 2 §РАЗВИТИЕ ПЕРСОНАЖА — «максимально возможное
        значение навыка равно 5»). The general/advanced split affects rolling, not range: per
        ГЛАВА 3 §«Специальные навыки», a general skill can be rolled at value 0 (attribute-only
        check), while an advanced skill requires value ≥ 1 to roll at all — that gate lives in
        the dice-engine, not in the schema. Creation-time caps (key skills up to 3, others up to
        1, per ГЛАВА 2 «НАВЫКИ») are enforced by the backend `validateSkillsAtCreation` handler
        against the chosen amplua, not by this schema. All keys are required.
      required:
        - dexterity
        - force
        - infiltration
        - manipulation
        - meleeCombat
        - observation
        - rangedCombat
        - survival
        - command
        - culture
        - dataDjinn
        - medicurgy
        - mysticPowers
        - pilot
        - science
        - technology
      properties:
        dexterity:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        force:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (STR)
        infiltration:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        manipulation:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (EMP)
        meleeCombat:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (STR)
        observation:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (WIT)
        rangedCombat:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (AGI)
        survival:
          type: integer
          minimum: 0
          maximum: 5
          description: General skill (WIT)
        command:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        culture:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        dataDjinn:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        medicurgy:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        mysticPowers:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (EMP)
        pilot:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (AGI)
        science:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)
        technology:
          type: integer
          minimum: 0
          maximum: 5
          description: Advanced skill (WIT)

    ConditionFlags:
      type: object
      description: |
        Boolean flags for the four standard Coriolis conditions (PRD §5.2).
        Each active condition imposes a −1 die penalty on all rolls (capped
        at the character's pool size). Applied by the RulesEngine.
      required: [exhausted, sleepless, thirsty, hungry]
      properties:
        exhausted:
          type: boolean
          description: Exhausted condition — also blocks pushing rolls
        sleepless:
          type: boolean
        thirsty:
          type: boolean
        hungry:
          type: boolean

    CriticalInjury:
      type: object
      description: A critical injury entry on a character's sheet
      required: [id, name, severity, effect, acquiredAt]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        name:
          type: string
          description: Short name of the injury (e.g. "Broken arm")
        severity:
          $ref: "#/components/schemas/CriticalInjurySeverity"
        effect:
          type: string
          description: Free-text description of the mechanical or narrative effect
        acquiredAt:
          type: string
          format: date-time
          description: ISO-8601 instant when the injury was recorded

    Talent:
      type: object
      description: A talent owned by a character
      required: [id, kind, name, description, rank, acquiredAt]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        kind:
          $ref: "#/components/schemas/TalentKind"
          description: |
            Discriminator describing where this talent came from
            (personal amplua, crew amplua, icon gift, or mutant stigma).
            Set on creation and immutable thereafter.
        name:
          type: string
          description: Talent name (e.g. "Wing-Mate", "Stunt Pilot")
        description:
          type: string
          description: Rules text or flavour description of the talent
        rank:
          type: integer
          minimum: 1
          maximum: 3
          description: Talent rank (1 = basic, 2 = journeyman, 3 = master)
        acquiredAt:
          type: string
          format: date-time
          description: ISO-8601 instant when the talent was recorded on the sheet

    TalentCreate:
      type: object
      description: |
        Payload for creating a new talent. `kind` defaults to `personal`
        when omitted (the most common case for talents acquired during
        play). At character creation, the wizard picks one talent of
        each kind (`personal`, `crew`, `iconGift`); the server rejects a
        second talent of the same non-`personal` kind with
        `TALENT_KIND_DUPLICATE`.
      required: [name, description]
      properties:
        kind:
          $ref: "#/components/schemas/TalentKind"
          description: |
            Defaults to `personal`. Pass `crew` / `iconGift` / `stigma`
            to record a starting-talent slot of that kind (only one of
            each non-`personal` kind is allowed per character).
        name:
          type: string
          minLength: 1
          description: Talent name
        description:
          type: string
          description: Rules text or flavour description
        rank:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: Talent rank (defaults to 1 when not provided)

    TalentUpdate:
      type: object
      description: |
        PATCH payload for updating a talent — all fields optional.
        `kind` is immutable and cannot be changed after a talent has
        been recorded.
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        rank:
          type: integer
          minimum: 1
          maximum: 3

    Relationship:
      type: object
      description: A relationship between a character and another person (NPC or PC)
      required: [id, targetName, kind]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        targetName:
          type: string
          description: Name of the NPC or PC (free text)
        kind:
          $ref: "#/components/schemas/RelationshipKind"
        notes:
          type: ["string", "null"]
          description: Optional notes about the relationship

    # -------------------------------------------------------------------------
    # Item discriminated union
    # -------------------------------------------------------------------------

    ItemBase:
      type: object
      description: Fields common to every item type
      required: [id, type, name]
      properties:
        id:
          type: string
          description: Opaque identifier (cuid2)
        type:
          type: string
          description: Discriminator — determines which type-specific fields are present
        name:
          type: string
          minLength: 1
          description: Item name

    ItemWeapon:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [damage, range, bonus, crit, weight, features, equipped]
          properties:
            type:
              type: string
              enum: [WEAPON]
            damage:
              type: integer
              minimum: 0
              description: Base damage dice
            range:
              $ref: "#/components/schemas/ItemRangeEnum"
            bonus:
              type: integer
              minimum: 0
              description: Bonus dice added to the attack pool
            crit:
              type: integer
              minimum: 1
              description: Critical threshold (roll this many successes to crit)
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots (0.5 increments)
            features:
              type: array
              items:
                type: string
              description: Feature tags (e.g. "Burst", "Explosive")
            equipped:
              type: boolean
              description: Whether the item is currently equipped

    ItemArmor:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [armorRating, weight, features, equipped]
          properties:
            type:
              type: string
              enum: [ARMOR]
            armorRating:
              type: integer
              minimum: 0
              description: Armor rating — reduces incoming damage
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            features:
              type: array
              items:
                type: string
              description: Feature tags (e.g. "Vacuum Sealed", "Exo-Skeleton")
            equipped:
              type: boolean

    ItemGear:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight, quantity]
          properties:
            type:
              type: string
              enum: [GEAR]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            quantity:
              type: integer
              minimum: 1
              description: Number of units
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    ItemCybernetic:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [bodyPoints, effect]
          properties:
            type:
              type: string
              enum: [CYBERNETIC]
            bodyPoints:
              type: integer
              minimum: 0
              maximum: 6
              description: System strain points consumed (0–6)
            effect:
              type: string
              description: Description of the cybernetic's effect

    ItemShipModule:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [slot, effect]
          properties:
            type:
              type: string
              enum: [SHIP_MODULE]
            slot:
              $ref: "#/components/schemas/ItemSlotType"
            effect:
              type: string
              description: Description of the module's effect and energy use

    ItemOther:
      allOf:
        - $ref: "#/components/schemas/ItemBase"
        - type: object
          required: [weight]
          properties:
            type:
              type: string
              enum: [OTHER]
            weight:
              type: number
              minimum: 0
              description: Encumbrance weight in slots
            notes:
              type: ["string", "null"]
              description: Optional free-text notes

    # -------------------------------------------------------------------------
    # Item create variants (no id, no server-derived fields)
    # -------------------------------------------------------------------------

    ItemWeaponCreate:
      type: object
      description: Create payload for a WEAPON item. No `id` — server-assigned.
      required: [type, name, damage, range, bonus, crit, weight, features, equipped]
      properties:
        type:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        damage:
          type: integer
          minimum: 0
          description: Base damage dice
        range:
          $ref: "#/components/schemas/ItemRangeEnum"
        bonus:
          type: integer
          minimum: 0
          description: Bonus dice added to the attack pool
        crit:
          type: integer
          minimum: 1
          description: Critical threshold
        weight:
          type: number
          minimum: 0
          description: Encumbrance weight in slots (0.5 increments)
        features:
          type: array
          items:
            type: string
          description: Feature tags (e.g. "Burst", "Explosive")
        equipped:
          type: boolean
          default: false
      example:
        type: WEAPON
        name: Vulcan Carbine
        damage: 2
        range: medium
        bonus: 2
        crit: 2
        weight: 0.8
        features: []
        equipped: false

    ItemArmorCreate:
      type: object
      description: Create payload for an ARMOR item. No `id` — server-assigned.
      required: [type, name, armorRating, weight, features, equipped]
      properties:
        type:
          type: string
          enum: [ARMOR]
        name:
          type: string
          minLength: 1
        armorRating:
          type: integer
          minimum: 0
          description: Armor rating — reduces incoming damage
        weight:
          type: number
          minimum: 0
          description: Encumbrance weight in slots
        features:
          type: array
          items:
            type: string
          description: Feature tags (e.g. "Vacuum Sealed", "Exo-Skeleton")
        equipped:
          type: boolean
          default: false
      example:
        type: ARMOR
        name: Coriolis Guard Suit
        armorRating: 3
        weight: 1.0
        features: ["Vacuum Sealed"]
        equipped: false

    ItemGearCreate:
      type: object
      description: Create payload for a GEAR item. No `id` — server-assigned.
      required: [type, name, weight, quantity]
      properties:
        type:
          type: string
          enum: [GEAR]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
          description: Encumbrance weight in slots
        quantity:
          type: integer
          minimum: 1
          description: Number of units
        notes:
          type: ["string", "null"]
          description: Optional free-text notes
      example:
        type: GEAR
        name: Medkit
        weight: 0.5
        quantity: 1
        notes: Standard field medkit

    ItemCyberneticCreate:
      type: object
      description: Create payload for a CYBERNETIC item. No `id` — server-assigned.
      required: [type, name, bodyPoints, effect]
      properties:
        type:
          type: string
          enum: [CYBERNETIC]
        name:
          type: string
          minLength: 1
        bodyPoints:
          type: integer
          minimum: 0
          maximum: 6
          description: System strain points consumed (0–6)
        effect:
          type: string
          description: Description of the cybernetic's effect
      example:
        type: CYBERNETIC
        name: Neural Interface
        bodyPoints: 2
        effect: Grants +1 die to Data Djinn checks

    ItemShipModuleCreate:
      type: object
      description: Create payload for a SHIP_MODULE item. No `id` — server-assigned.
      required: [type, name, slot, effect]
      properties:
        type:
          type: string
          enum: [SHIP_MODULE]
        name:
          type: string
          minLength: 1
        slot:
          $ref: "#/components/schemas/ItemSlotType"
        effect:
          type: string
          description: Description of the module's effect and energy use
      example:
        type: SHIP_MODULE
        name: Sensor Upgrade Mk I
        slot: sensor
        effect: +1 die to sensor checks

    ItemOtherCreate:
      type: object
      description: Create payload for an OTHER item. No `id` — server-assigned.
      required: [type, name, weight]
      properties:
        type:
          type: string
          enum: [OTHER]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
          description: Encumbrance weight in slots
        notes:
          type: ["string", "null"]
          description: Optional free-text notes
      example:
        type: OTHER
        name: Coriolis Prayer Rug
        weight: 0.5
        notes: null

    # -------------------------------------------------------------------------
    # Item update variants (PATCH semantics — all fields optional)
    # -------------------------------------------------------------------------

    ItemWeaponUpdate:
      type: object
      description: PATCH payload for a WEAPON item. All fields optional.
      properties:
        type:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        damage:
          type: integer
          minimum: 0
        range:
          $ref: "#/components/schemas/ItemRangeEnum"
        bonus:
          type: integer
          minimum: 0
        crit:
          type: integer
          minimum: 1
        weight:
          type: number
          minimum: 0
        features:
          type: array
          items:
            type: string
        equipped:
          type: boolean
      example:
        type: WEAPON
        damage: 3
        equipped: true

    ItemArmorUpdate:
      type: object
      description: PATCH payload for an ARMOR item. All fields optional.
      properties:
        type:
          type: string
          enum: [ARMOR]
        name:
          type: string
          minLength: 1
        armorRating:
          type: integer
          minimum: 0
        weight:
          type: number
          minimum: 0
        features:
          type: array
          items:
            type: string
        equipped:
          type: boolean
      example:
        type: ARMOR
        armorRating: 4
        equipped: true

    ItemGearUpdate:
      type: object
      description: PATCH payload for a GEAR item. All fields optional.
      properties:
        type:
          type: string
          enum: [GEAR]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
      example:
        type: GEAR
        quantity: 3

    ItemCyberneticUpdate:
      type: object
      description: PATCH payload for a CYBERNETIC item. All fields optional.
      properties:
        type:
          type: string
          enum: [CYBERNETIC]
        name:
          type: string
          minLength: 1
        bodyPoints:
          type: integer
          minimum: 0
          maximum: 6
        effect:
          type: string
      example:
        type: CYBERNETIC
        effect: Grants +2 dice to Data Djinn checks

    ItemShipModuleUpdate:
      type: object
      description: PATCH payload for a SHIP_MODULE item. All fields optional.
      properties:
        type:
          type: string
          enum: [SHIP_MODULE]
        name:
          type: string
          minLength: 1
        slot:
          $ref: "#/components/schemas/ItemSlotType"
        effect:
          type: string
      example:
        type: SHIP_MODULE
        effect: +2 dice to sensor checks

    ItemOtherUpdate:
      type: object
      description: PATCH payload for an OTHER item. All fields optional.
      properties:
        type:
          type: string
          enum: [OTHER]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        type: OTHER
        notes: Blessed by the Lady of Tears

    Item:
      description: |
        A discriminated union of all item types. The `type` field determines
        which variant applies. Generated clients produce a correctly-typed
        sum type from this schema.
      oneOf:
        - $ref: "#/components/schemas/ItemWeapon"
        - $ref: "#/components/schemas/ItemArmor"
        - $ref: "#/components/schemas/ItemGear"
        - $ref: "#/components/schemas/ItemCybernetic"
        - $ref: "#/components/schemas/ItemShipModule"
        - $ref: "#/components/schemas/ItemOther"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeapon"
          ARMOR: "#/components/schemas/ItemArmor"
          GEAR: "#/components/schemas/ItemGear"
          CYBERNETIC: "#/components/schemas/ItemCybernetic"
          SHIP_MODULE: "#/components/schemas/ItemShipModule"
          OTHER: "#/components/schemas/ItemOther"

    ItemCreate:
      description: |
        Payload for creating a new item. Same discriminated union as `Item`
        but without `id` (server-assigned). The `type` discriminator must
        be present.
      oneOf:
        - $ref: "#/components/schemas/ItemWeaponCreate"
        - $ref: "#/components/schemas/ItemArmorCreate"
        - $ref: "#/components/schemas/ItemGearCreate"
        - $ref: "#/components/schemas/ItemCyberneticCreate"
        - $ref: "#/components/schemas/ItemShipModuleCreate"
        - $ref: "#/components/schemas/ItemOtherCreate"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeaponCreate"
          ARMOR: "#/components/schemas/ItemArmorCreate"
          GEAR: "#/components/schemas/ItemGearCreate"
          CYBERNETIC: "#/components/schemas/ItemCyberneticCreate"
          SHIP_MODULE: "#/components/schemas/ItemShipModuleCreate"
          OTHER: "#/components/schemas/ItemOtherCreate"

    ItemUpdate:
      description: |
        PATCH payload for updating an item. The `type` discriminator must
        match the existing item type — changing it returns 400
        `ITEM_TYPE_MISMATCH`. All fields are optional.
      oneOf:
        - $ref: "#/components/schemas/ItemWeaponUpdate"
        - $ref: "#/components/schemas/ItemArmorUpdate"
        - $ref: "#/components/schemas/ItemGearUpdate"
        - $ref: "#/components/schemas/ItemCyberneticUpdate"
        - $ref: "#/components/schemas/ItemShipModuleUpdate"
        - $ref: "#/components/schemas/ItemOtherUpdate"
      discriminator:
        propertyName: type
        mapping:
          WEAPON: "#/components/schemas/ItemWeaponUpdate"
          ARMOR: "#/components/schemas/ItemArmorUpdate"
          GEAR: "#/components/schemas/ItemGearUpdate"
          CYBERNETIC: "#/components/schemas/ItemCyberneticUpdate"
          SHIP_MODULE: "#/components/schemas/ItemShipModuleUpdate"
          OTHER: "#/components/schemas/ItemOtherUpdate"

    # -------------------------------------------------------------------------
    # Character schemas
    # -------------------------------------------------------------------------

    Character:
      type: object
      description: |
        Full character DTO as returned by the v1 API. Server-derived fields
        (`hp.max`, `mp.max`, `encumbrance.max`) are computed by the
        RulesEngine on every write and are marked `readOnly`.

        Formulas (PRD §5.2, §10):
        - HP max = STR + AGI
        - MP max = WIT + EMP
        - Encumbrance max = STR × 2
      required:
        - id
        - ownerId
        - name
        - concept
        - iconId
        - upbringing
        - origin
        - reputation
        - startingWealth
        - crewConcept
        - mutant
        - mutantLineage
        - attributes
        - skills
        - hp
        - mp
        - encumbrance
        - experience
        - conditions
        - criticalInjuries
        - talents
        - relationships
        - inventory
        - notes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque character identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Character name (1–80 characters)
        concept:
          oneOf:
            - $ref: "#/components/schemas/Concept"
            - type: "null"
          description: |
            One of the 11 character archetypes (амплуа). May be `null`
            during the creation wizard before the user has chosen an
            archetype; required for an `active` character. Determines the
            key attribute / key skills caps applied at creation and the
            reputation modifier applied on top of `upbringing`.
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
          description: |
            The character's chosen role (роль) within their amplua. Nullable
            for drafts and for legacy characters created before role-tracking
            landed; the wizard prompts for a role on the next edit when
            `role` is null but `concept` is set ("unmigrated"). Once the
            character is `active`, the server enforces that the role belongs
            to the chosen `concept` — `ROLE_CONCEPT_MISMATCH` is returned
            otherwise.
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
          description: One of the Nine Icons, or null if not chosen yet
        upbringing:
          $ref: "#/components/schemas/Upbringing"
          description: |
            Social stratum the character was raised in. Set at creation and
            **immutable** — drives the starting attribute / skill point
            budgets and the initial values of `reputation` and
            `startingWealth`.
        origin:
          type: ["string", "null"]
          maxLength: 200
          description: |
            Free-text narrative description of where the character is from
            (home station, planet, or region). Has no mechanical effect.
        reputation:
          type: integer
          minimum: 0
          description: |
            Current social reputation. Initial value is derived from
            `upbringing` (plebeian=2, stationary=4, aristocrat=6) and may
            change during play.
        startingWealth:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            The number of birrs (currency) the character started with at
            creation. Derived from `upbringing` (plebeian=500,
            stationary=1000, aristocrat=5000). Immutable historical record.
        crewConcept:
          oneOf:
            - $ref: "#/components/schemas/CrewConcept"
            - type: "null"
          description: |
            The crew (амплуа команды) this character belongs to.
            Mutable while `status: draft` (the wizard is still in
            progress); immutable once the character is `active`.
        mutant:
          type: boolean
          default: false
          description: |
            Whether this character is a mutant (пасынок) per Coriolis
            ST3001 ch.4 §Стигмы пасынков. Mutants additionally pick one
            starting talent of `kind: stigma` from the catalog (any of
            the three stigmas) through the regular `addTalent`
            endpoint. Mutable while `status: draft` and immutable once
            `active` — `MUTANT_IMMUTABLE`. When `true`, `mutantLineage`
            must be set; when `false`, `mutantLineage` must be `null`.
        mutantLineage:
          oneOf:
            - $ref: "#/components/schemas/MutantLineage"
            - type: "null"
          description: |
            Mutant lineage. `null` for non-mutants; one of `zirba`,
            `shingura`, `nerida` when `mutant=true`. Mutable while
            `status: draft` and immutable once `active`.
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR + AGI; set by the server
        mp:
          type: object
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from WIT + EMP; set by the server
        encumbrance:
          type: object
          required: [current, max]
          properties:
            current:
              type: number
              minimum: 0
              readOnly: true
              description: Sum of non-stowed item weights; set by the server
            max:
              type: integer
              minimum: 0
              readOnly: true
              description: Derived from STR × 2; set by the server
        experience:
          type: integer
          minimum: 0
          description: Total XP earned
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
        talents:
          type: array
          items:
            $ref: "#/components/schemas/Talent"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form notes (Markdown; soft cap 4096 characters)
        status:
          type: string
          enum: [draft, active]
          description: |
            Lifecycle state of the character.

            - `draft` — character is a work-in-progress created by the wizard.
              Draft characters are excluded from the default character list
              (`GET /api/v1/characters`) unless `?includeDrafts=true` is passed.
            - `active` — character is complete and visible on the dashboard.

            Transitioning from `draft` to `active` (forging) is done by sending
            `PATCH /api/v1/characters/{id}` with `{ "status": "active" }`.
            The reverse transition (`active → draft`) is rejected with 422
            `INVALID_STATUS_TRANSITION`.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CharacterCreate:
      type: object
      description: |
        Payload for `POST /api/v1/characters`. Only `name` and `upbringing`
        are required. Attribute values default to 2 if the `attributes`
        object is omitted or a key within it is missing. Skill values
        default to 0.

        The server enforces the upbringing-based budgets at creation time:
        - sum(attributes) ≤ attribute budget for upbringing
        - each attribute is between 2 and 4
        - sum(skills) ≤ skill budget for upbringing

        `reputation` and `startingWealth` are **server-derived** from
        `upbringing` and must not be set by the client.

        Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `startingWealth`,
        `createdAt`, `updatedAt`) must not be included; they are
        rejected with 400.

        Set `status: 'draft'` to create a wizard-in-progress character.
        Omitting `status` defaults to `'active'`.
      required: [name, upbringing]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          oneOf:
            - $ref: "#/components/schemas/Concept"
            - type: "null"
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
          description: |
            Optional role within the chosen amplua. Step 5 of the creation
            wizard (skill distribution) is now preceded by a role pick within
            the chosen amplua. Must belong to `concept` when both are set;
            validated server-side with `ROLE_CONCEPT_MISMATCH`.
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        upbringing:
          $ref: "#/components/schemas/Upbringing"
        origin:
          type: ["string", "null"]
          maxLength: 200
        crewConcept:
          oneOf:
            - $ref: "#/components/schemas/CrewConcept"
            - type: "null"
          description: |
            Optional crew concept the character belongs to. May be set
            in the wizard before forging or updated later while the
            character is `draft`.
        mutant:
          type: boolean
          default: false
          description: |
            Whether the character is a mutant (пасынок). When `true`,
            `mutantLineage` must be supplied; the player then picks one
            stigma talent from the catalog through the regular
            `addTalent` endpoint (kind `stigma`). When `false`
            (default), `mutantLineage` must be `null` or omitted and
            stigma talents are rejected with `STIGMA_REQUIRES_MUTANT`.
        mutantLineage:
          oneOf:
            - $ref: "#/components/schemas/MutantLineage"
            - type: "null"
          description: |
            Mutant lineage (only valid when `mutant=true`). One of
            `zirba`, `shingura`, `nerida`. `MUTANT_LINEAGE_REQUIRED` is
            returned if `mutant=true` and lineage is missing;
            `MUTANT_LINEAGE_FORBIDDEN` is returned if `mutant=false`
            and a lineage is supplied.
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
          default: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        notes:
          type: ["string", "null"]
          maxLength: 4096
        status:
          type: string
          enum: [draft, active]
          default: active
          description: |
            Initial lifecycle state. Omit (or set `active`) for normal creation.
            Set to `draft` when starting the character-creation wizard.

    CharacterUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/characters/{id}`. All fields are
        optional. Read-only fields (`id`, `ownerId`, `hp.max`, `mp.max`,
        `encumbrance.max`, `encumbrance.current`, `startingWealth`,
        `createdAt`, `updatedAt`) are rejected with 400 if present.

        `upbringing` may be changed **while the character's `status` is
        `draft`** (the wizard is still in progress). When it is, the
        server recomputes `reputation` and `startingWealth` from the new
        upbringing. Once the character has been forged (`status: active`),
        upbringing becomes immutable and any attempt to set it is
        rejected with `UPBRINGING_IMMUTABLE`.

        Derived stats (`hp.max`, `mp.max`, `encumbrance.max`) are
        recalculated automatically after each successful write.

        **Status transitions:**
        - `draft → draft` — no-op; the wizard continues editing.
        - `draft → active` — forges the character (wizard complete).
          Send `{ "status": "active" }` as a standalone PATCH or alongside
          other field updates.
        - `active → draft` — **rejected** with 422 `INVALID_STATUS_TRANSITION`.
          Active characters cannot be reverted to draft state.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        concept:
          oneOf:
            - $ref: "#/components/schemas/Concept"
            - type: "null"
          description: |
            Switching the concept while `status` is `draft` recomputes
            the per-attribute / per-skill caps for validation and
            adjusts the reputation by the new concept's modifier
            (relative to upbringing's baseline). Once active, concept
            becomes immutable.
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
          description: |
            The character's role within their amplua. Allowed while
            `status` is `draft`; once `active`, the server enforces that
            the role matches the chosen concept — `ROLE_CONCEPT_MISMATCH`.
            Changing the concept while drafting should clear or re-validate
            the role. Step 5 of the creation wizard (skill distribution) is
            now preceded by a role pick within the chosen amplua.
        iconId:
          oneOf:
            - $ref: "#/components/schemas/IconId"
            - type: "null"
        upbringing:
          $ref: "#/components/schemas/Upbringing"
          description: |
            Allowed only while `status` is `draft` — used by the wizard
            to let players reconsider their pick before forging. Once
            the character is `active`, this field is immutable.
        origin:
          type: ["string", "null"]
          maxLength: 200
        crewConcept:
          oneOf:
            - $ref: "#/components/schemas/CrewConcept"
            - type: "null"
          description: |
            Allowed only while `status` is `draft` — used by the wizard
            to let players pick their team's crew concept before
            forging. Once the character is `active`, this field is
            immutable and any attempt to change it is rejected with
            `CREW_CONCEPT_IMMUTABLE`.
        mutant:
          type: boolean
          description: |
            Allowed only while `status` is `draft`. Toggling on/off
            while drafting also clears any incompatible stigma talents
            picked previously. Once the character is `active`, this
            field is immutable and any attempt to change it is rejected
            with `MUTANT_IMMUTABLE`.
        mutantLineage:
          oneOf:
            - $ref: "#/components/schemas/MutantLineage"
            - type: "null"
          description: |
            Allowed only while `status` is `draft`. Must be `null` when
            `mutant=false` and one of `zirba|shingura|nerida` when
            `mutant=true`. Frozen alongside `mutant` once the character
            is `active`.
        reputation:
          type: integer
          minimum: 0
          description: |
            Update the character's current reputation (e.g. after a
            roleplay event). Initial value is set from `upbringing` at
            creation time; while the character is a `draft`, changing
            `upbringing` resets `reputation` to the new upbringing's
            baseline.
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
        experience:
          type: integer
          minimum: 0
        conditions:
          $ref: "#/components/schemas/ConditionFlags"
        criticalInjuries:
          type: array
          items:
            $ref: "#/components/schemas/CriticalInjury"
          description: |
            Replaces the entire critical injuries list when provided.
            Use the dedicated nested-item pattern (POST/PATCH/DELETE on
            individual injuries) once that surface is added in a later epic.
        notes:
          type: ["string", "null"]
          maxLength: 4096
        status:
          type: string
          enum: [draft, active]
          description: |
            Lifecycle state transition. Only `draft → active` (forge) is
            permitted. Attempting `active → draft` returns 422
            `INVALID_STATUS_TRANSITION`.

    CharacterList:
      type: object
      description: Cursor-paginated list of characters
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # Ship enumerations
    # -------------------------------------------------------------------------

    ShipClass:
      type: string
      enum:
        - fighter
        - shuttle
        - torpedo-boat
        - light-freighter
        - light-passenger
        - courier-yacht
        - clipper
        - patrol-boat
        - gunboat
        - assault-ship
        - blockade-runner
        - pleasure-yacht
        - flying-circus
        - prospector
        - rescue-ship
        - passenger-liner
        - heavy-freighter
        - cruiser
        - destroyer
        - heavy-cruiser
      description: |
        Ship hull class per ST3001 ГЛАВА 7 Table 7.4 (типы кораблей). The
        class determines the base stat block (energy, hull, maneuverability,
        signature, armor, speed, module slots) from Table 7.5. Kebab-case
        values map to the Russian originals in the rulebook.

        Class I examples: fighter, shuttle.
        Class II examples: torpedo-boat.
        Class III examples: light-freighter, light-passenger, courier-yacht,
          clipper, patrol-boat, gunboat, assault-ship, blockade-runner, pleasure-yacht.
        Class IV examples: flying-circus, prospector, rescue-ship, passenger-liner.
        Class V examples: heavy-cruiser, passenger-liner (large).

    ShipModuleSlot:
      type: string
      enum:
        - BRIDGE
        - REACTOR
        - DRIVE
        - HOLD
        - WEAPON
        - TORPEDO
        - SENSOR
        - COMMS
        - HANGAR
        - QUARTERS
        - MEDICAL
        - WORKSHOP
        - CHAPEL
        - ESCAPE-PODS
        - CRYO
        - DOCKING
        - MINING
        - REPAIR
        - CONCEALED-HOLD
        - PROXY-DECK
        - OTHER
      description: |
        Ship module slot type per ST3001 ГЛАВА 7 mandatory and optional module
        catalogue. `BRIDGE`, `REACTOR`, `DRIVE` are mandatory on every ship.
        All others are optional and consume module slots. The existing
        `ItemSlotType` enum covers character-inventory ship modules; this enum
        covers actual installed ship modules and provides richer coverage of
        the full ГЛАВА 7 catalogue.

    ShipWeaponRange:
      type: string
      enum: [zero, close, medium, long, extreme]
      description: |
        Ship-combat range bands per ST3001 ГЛАВА 7 Table 7.9. Distinct from
        the personal-scale `ItemRangeEnum`.
        - `zero` — point-blank / boarding range.
        - `close` — within a few hundred metres.
        - `medium` — standard engagement distance.
        - `long` — extended engagement.
        - `extreme` — maximum sensor range.

    CrewPosition:
      type: string
      enum:
        - captain
        - pilot
        - sensorOp
        - gunner
        - engineer
        - serviceCrew
      description: |
        Crew positions per ST3001 ГЛАВА 7 (crew roles). `sensorOp` is the
        штурман-оператор (navigator/sensor operator) in the rulebook, also
        responsible for combat-meme and info-impulse attacks. All positions
        except `captain` may be filled by automation (усовершенствование
        «Автоматика»).

    # -------------------------------------------------------------------------
    # Ship value objects
    # -------------------------------------------------------------------------

    CrewSlot:
      type: object
      description: |
        A crew position on a ship. Positions without an assigned character are
        vacant (open berth). Multiple characters may not share one position.
      required: [position]
      properties:
        position:
          $ref: "#/components/schemas/CrewPosition"
        assignedCharacterId:
          type: ["string", "null"]
          description: |
            ID of the assigned Character. Null when the berth is vacant.
            The character must be owned by the same user as the ship.

    # -------------------------------------------------------------------------
    # Ship module discriminated union
    # -------------------------------------------------------------------------

    ShipModuleBase:
      type: object
      description: Fields common to every ship module variant
      required: [id, slot, name, energyUse]
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque module identifier (cuid2)
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
          description: Module name (e.g. "Graviton Projector", "Smuggler hold")
        energyUse:
          type: integer
          minimum: 0
          description: Energy points consumed by this module when active
        notes:
          type: ["string", "null"]
          description: Free-text notes; used for damage state, special conditions, etc.

    ShipModuleWeapon:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            A ship weapon bay. Fields correspond to ST3001 ГЛАВА 7 Table 7.9.
          required: [weaponBonus, weaponRange, weaponDamage, weaponCritThreshold]
          properties:
            slot:
              type: string
              enum: [WEAPON]
            weaponBonus:
              type: integer
              minimum: 0
              description: Modifier dice added to the attack pool (Мод. column in Table 7.9)
            weaponRange:
              $ref: "#/components/schemas/ShipWeaponRange"
            weaponDamage:
              type: integer
              minimum: 0
              description: Structural damage dealt on a hit
            weaponCritThreshold:
              type: integer
              minimum: 1
              description: Number of successes required to trigger a critical effect

    ShipModuleTorpedo:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            A torpedo/mine bay per ST3001 ГЛАВА 7. Stores up to 4 torpedoes
            or 8 mines. Ammo is tracked separately.
          properties:
            slot:
              type: string
              enum: [TORPEDO]
            torpedoCount:
              type: integer
              minimum: 0
              description: Number of torpedoes currently loaded
            mineCount:
              type: integer
              minimum: 0
              description: Number of mines currently loaded

    ShipModuleHold:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: Cargo hold. Vented or concealed variant per ГЛАВА 7.
          properties:
            slot:
              type: string
              enum: [HOLD]
            cargoTons:
              type: integer
              minimum: 0
              description: Cargo capacity in tonnes (class-dependent per Table 7.6)
            concealed:
              type: boolean
              default: false
              description: True for a потайной грузовой отсек (concealed hold)

    ShipModuleSensor:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: Sensor tower upgrade. Provides +1 to sensor checks per ГЛАВА 7.
          properties:
            slot:
              type: string
              enum: [SENSOR]
            detectionBonus:
              type: integer
              minimum: 0
              default: 1
              description: Modifier added to sensor / dataDjinn checks

    ShipModuleOther:
      allOf:
        - $ref: "#/components/schemas/ShipModuleBase"
        - type: object
          description: |
            Generic module for all other slot types (BRIDGE, REACTOR, DRIVE,
            COMMS, HANGAR, QUARTERS, MEDICAL, WORKSHOP, CHAPEL, ESCAPE-PODS,
            CRYO, DOCKING, MINING, REPAIR, CONCEALED-HOLD, PROXY-DECK, OTHER).
            Stores descriptive data without additional structured fields.
          properties:
            slot:
              $ref: "#/components/schemas/ShipModuleSlot"

    # -------------------------------------------------------------------------
    # Ship module create variants (no id — server-assigned)
    # -------------------------------------------------------------------------

    ShipModuleWeaponCreate:
      type: object
      description: Create payload for a WEAPON ship module. No `id` — server-assigned.
      required: [slot, name, energyUse, weaponBonus, weaponRange, weaponDamage, weaponCritThreshold]
      properties:
        slot:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        weaponBonus:
          type: integer
          minimum: 0
          description: Modifier dice added to the attack pool
        weaponRange:
          $ref: "#/components/schemas/ShipWeaponRange"
        weaponDamage:
          type: integer
          minimum: 0
          description: Structural damage dealt on a hit
        weaponCritThreshold:
          type: integer
          minimum: 1
          description: Number of successes required to trigger a critical effect
        notes:
          type: ["string", "null"]
      example:
        slot: WEAPON
        name: Graviton Projector
        energyUse: 2
        weaponBonus: 1
        weaponRange: medium
        weaponDamage: 3
        weaponCritThreshold: 3
        notes: null

    ShipModuleTorpedoCreate:
      type: object
      description: Create payload for a TORPEDO ship module. No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          type: string
          enum: [TORPEDO]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        torpedoCount:
          type: integer
          minimum: 0
          default: 0
          description: Number of torpedoes currently loaded
        mineCount:
          type: integer
          minimum: 0
          default: 0
          description: Number of mines currently loaded
        notes:
          type: ["string", "null"]
      example:
        slot: TORPEDO
        name: Torpedo Bay Alpha
        energyUse: 1
        torpedoCount: 4
        mineCount: 0
        notes: null

    ShipModuleHoldCreate:
      type: object
      description: Create payload for a HOLD ship module. No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          type: string
          enum: [HOLD]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        cargoTons:
          type: integer
          minimum: 0
          default: 0
          description: Cargo capacity in tonnes
        concealed:
          type: boolean
          default: false
          description: True for a concealed hold
        notes:
          type: ["string", "null"]
      example:
        slot: HOLD
        name: Main Cargo Hold
        energyUse: 0
        cargoTons: 50
        concealed: false
        notes: null

    ShipModuleSensorCreate:
      type: object
      description: Create payload for a SENSOR ship module. No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          type: string
          enum: [SENSOR]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        detectionBonus:
          type: integer
          minimum: 0
          default: 1
          description: Modifier added to sensor / dataDjinn checks
        notes:
          type: ["string", "null"]
      example:
        slot: SENSOR
        name: Long-Range Sensor Tower
        energyUse: 1
        detectionBonus: 1
        notes: null

    ShipModuleOtherCreate:
      type: object
      description: |
        Create payload for any other ship module slot type (BRIDGE, REACTOR,
        DRIVE, COMMS, HANGAR, QUARTERS, MEDICAL, WORKSHOP, CHAPEL, ESCAPE-PODS,
        CRYO, DOCKING, MINING, REPAIR, CONCEALED-HOLD, PROXY-DECK, OTHER).
        No `id` — server-assigned.
      required: [slot, name, energyUse]
      properties:
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: COMMS
        name: Long-Range Comms Array
        energyUse: 1
        notes: null

    # -------------------------------------------------------------------------
    # Ship module update variants (PATCH semantics — all fields optional)
    # -------------------------------------------------------------------------

    ShipModuleWeaponUpdate:
      type: object
      description: PATCH payload for a WEAPON ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [WEAPON]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        weaponBonus:
          type: integer
          minimum: 0
        weaponRange:
          $ref: "#/components/schemas/ShipWeaponRange"
        weaponDamage:
          type: integer
          minimum: 0
        weaponCritThreshold:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]
      example:
        slot: WEAPON
        weaponDamage: 4

    ShipModuleTorpedoUpdate:
      type: object
      description: PATCH payload for a TORPEDO ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [TORPEDO]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        torpedoCount:
          type: integer
          minimum: 0
        mineCount:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: TORPEDO
        torpedoCount: 2

    ShipModuleHoldUpdate:
      type: object
      description: PATCH payload for a HOLD ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [HOLD]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        cargoTons:
          type: integer
          minimum: 0
        concealed:
          type: boolean
        notes:
          type: ["string", "null"]
      example:
        slot: HOLD
        cargoTons: 60

    ShipModuleSensorUpdate:
      type: object
      description: PATCH payload for a SENSOR ship module. All fields optional.
      properties:
        slot:
          type: string
          enum: [SENSOR]
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        detectionBonus:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: SENSOR
        detectionBonus: 2

    ShipModuleOtherUpdate:
      type: object
      description: |
        PATCH payload for any other ship module slot type. All fields optional.
        The `slot` discriminator may not be changed after installation.
      properties:
        slot:
          $ref: "#/components/schemas/ShipModuleSlot"
        name:
          type: string
          minLength: 1
        energyUse:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
      example:
        slot: COMMS
        notes: Upgraded to Mk II antenna

    ShipModule:
      description: |
        A discriminated union of all ship module variants. The `slot` field
        determines which variant applies. Generated clients produce a
        correctly-typed sum type from this schema.

        Mandatory modules (BRIDGE, REACTOR, DRIVE) are always present on a
        ship and are not individually manageable via the module CRUD endpoints.
        They appear in the `modules` array for completeness and energy tracking.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeapon"
        - $ref: "#/components/schemas/ShipModuleTorpedo"
        - $ref: "#/components/schemas/ShipModuleHold"
        - $ref: "#/components/schemas/ShipModuleSensor"
        - $ref: "#/components/schemas/ShipModuleOther"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeapon"
          TORPEDO: "#/components/schemas/ShipModuleTorpedo"
          HOLD: "#/components/schemas/ShipModuleHold"
          SENSOR: "#/components/schemas/ShipModuleSensor"
          BRIDGE: "#/components/schemas/ShipModuleOther"
          REACTOR: "#/components/schemas/ShipModuleOther"
          DRIVE: "#/components/schemas/ShipModuleOther"
          COMMS: "#/components/schemas/ShipModuleOther"
          HANGAR: "#/components/schemas/ShipModuleOther"
          QUARTERS: "#/components/schemas/ShipModuleOther"
          MEDICAL: "#/components/schemas/ShipModuleOther"
          WORKSHOP: "#/components/schemas/ShipModuleOther"
          CHAPEL: "#/components/schemas/ShipModuleOther"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOther"
          CRYO: "#/components/schemas/ShipModuleOther"
          DOCKING: "#/components/schemas/ShipModuleOther"
          MINING: "#/components/schemas/ShipModuleOther"
          REPAIR: "#/components/schemas/ShipModuleOther"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOther"
          PROXY-DECK: "#/components/schemas/ShipModuleOther"
          OTHER: "#/components/schemas/ShipModuleOther"

    ShipModuleCreate:
      description: |
        Payload for `POST /api/v1/ships/{id}/modules`. Same discriminated
        union as `ShipModule` but without `id` (server-assigned). The `slot`
        discriminator must be present.

        Note: BRIDGE, REACTOR, and DRIVE modules are created automatically
        with the ship and cannot be added via this endpoint.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeaponCreate"
        - $ref: "#/components/schemas/ShipModuleTorpedoCreate"
        - $ref: "#/components/schemas/ShipModuleHoldCreate"
        - $ref: "#/components/schemas/ShipModuleSensorCreate"
        - $ref: "#/components/schemas/ShipModuleOtherCreate"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeaponCreate"
          TORPEDO: "#/components/schemas/ShipModuleTorpedoCreate"
          HOLD: "#/components/schemas/ShipModuleHoldCreate"
          SENSOR: "#/components/schemas/ShipModuleSensorCreate"
          BRIDGE: "#/components/schemas/ShipModuleOtherCreate"
          REACTOR: "#/components/schemas/ShipModuleOtherCreate"
          DRIVE: "#/components/schemas/ShipModuleOtherCreate"
          COMMS: "#/components/schemas/ShipModuleOtherCreate"
          HANGAR: "#/components/schemas/ShipModuleOtherCreate"
          QUARTERS: "#/components/schemas/ShipModuleOtherCreate"
          MEDICAL: "#/components/schemas/ShipModuleOtherCreate"
          WORKSHOP: "#/components/schemas/ShipModuleOtherCreate"
          CHAPEL: "#/components/schemas/ShipModuleOtherCreate"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOtherCreate"
          CRYO: "#/components/schemas/ShipModuleOtherCreate"
          DOCKING: "#/components/schemas/ShipModuleOtherCreate"
          MINING: "#/components/schemas/ShipModuleOtherCreate"
          REPAIR: "#/components/schemas/ShipModuleOtherCreate"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOtherCreate"
          PROXY-DECK: "#/components/schemas/ShipModuleOtherCreate"
          OTHER: "#/components/schemas/ShipModuleOtherCreate"

    ShipModuleUpdate:
      description: |
        PATCH payload for `PATCH /api/v1/ship-modules/{id}`. The `slot`
        discriminator must match the installed module's slot — changing it
        returns 400 `SHIP_MODULE_SLOT_MISMATCH`. All fields optional.
      oneOf:
        - $ref: "#/components/schemas/ShipModuleWeaponUpdate"
        - $ref: "#/components/schemas/ShipModuleTorpedoUpdate"
        - $ref: "#/components/schemas/ShipModuleHoldUpdate"
        - $ref: "#/components/schemas/ShipModuleSensorUpdate"
        - $ref: "#/components/schemas/ShipModuleOtherUpdate"
      discriminator:
        propertyName: slot
        mapping:
          WEAPON: "#/components/schemas/ShipModuleWeaponUpdate"
          TORPEDO: "#/components/schemas/ShipModuleTorpedoUpdate"
          HOLD: "#/components/schemas/ShipModuleHoldUpdate"
          SENSOR: "#/components/schemas/ShipModuleSensorUpdate"
          BRIDGE: "#/components/schemas/ShipModuleOtherUpdate"
          REACTOR: "#/components/schemas/ShipModuleOtherUpdate"
          DRIVE: "#/components/schemas/ShipModuleOtherUpdate"
          COMMS: "#/components/schemas/ShipModuleOtherUpdate"
          HANGAR: "#/components/schemas/ShipModuleOtherUpdate"
          QUARTERS: "#/components/schemas/ShipModuleOtherUpdate"
          MEDICAL: "#/components/schemas/ShipModuleOtherUpdate"
          WORKSHOP: "#/components/schemas/ShipModuleOtherUpdate"
          CHAPEL: "#/components/schemas/ShipModuleOtherUpdate"
          ESCAPE-PODS: "#/components/schemas/ShipModuleOtherUpdate"
          CRYO: "#/components/schemas/ShipModuleOtherUpdate"
          DOCKING: "#/components/schemas/ShipModuleOtherUpdate"
          MINING: "#/components/schemas/ShipModuleOtherUpdate"
          REPAIR: "#/components/schemas/ShipModuleOtherUpdate"
          CONCEALED-HOLD: "#/components/schemas/ShipModuleOtherUpdate"
          PROXY-DECK: "#/components/schemas/ShipModuleOtherUpdate"
          OTHER: "#/components/schemas/ShipModuleOtherUpdate"

    # -------------------------------------------------------------------------
    # Ship schemas
    # -------------------------------------------------------------------------

    Ship:
      type: object
      description: |
        Full Ship DTO as returned by the v1 API. Ship stats correspond to
        ST3001 ГЛАВА 7 Table 7.5 base stats, modified by the installed
        modules and upgrades.

        `hull.max` and `energy.max` are tracked as explicit editable values
        (not derived) because they can be altered by upgrades (Прочный корпус
        +1 hull, Мощный реактор +1 energy). `maneuverability` and `signature`
        are signed integers (negative values are valid per the class table).
      required:
        - id
        - ownerId
        - name
        - class
        - model
        - registry
        - hull
        - energy
        - armor
        - maneuverability
        - signature
        - speed
        - cargoCapacity
        - modules
        - crew
        - problems
        - history
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque ship identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Ship name (1–80 characters)
        class:
          $ref: "#/components/schemas/ShipClass"
        model:
          type: ["string", "null"]
          maxLength: 120
          description: Model / shipyard name (e.g. "Helebian Class III freighter")
        registry:
          type: ["string", "null"]
          maxLength: 40
          description: Registry number / transponder code (e.g. "KUA-7741-M")
        hull:
          type: object
          description: Structural integrity (Прочность in ST3001 ГЛАВА 7)
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Current hull points
            max:
              type: integer
              minimum: 0
              description: Maximum hull points (base per class + Прочный корпус upgrades)
        energy:
          type: object
          description: Reactor energy (Энергия in ST3001 ГЛАВА 7)
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Energy points currently available for allocation
            max:
              type: integer
              minimum: 0
              description: Maximum energy points (base per class + Мощный реактор upgrades)
        armor:
          type: integer
          minimum: 0
          description: Armor rating — number of dice rolled for the armor check (Броня)
        maneuverability:
          type: integer
          description: |
            Maneuverability modifier (Манёвренность). Signed integer — negative
            for large classes (Class IV is −1, Class V is −2). Affects pilot
            skill checks in ship combat per ST3001 ГЛАВА 7.
        signature:
          type: integer
          description: |
            Signature modifier (Заметность). Signed integer. Negative values
            mean the ship is harder to detect; positive values mean it is more
            visible. Applied to opponent sensor checks per ГЛАВА 7.
        speed:
          type: integer
          minimum: 0
          description: Speed in astronomical units per day (Скорость per ГЛАВА 7 Table 7.5)
        cargoCapacity:
          type: integer
          minimum: 0
          description: |
            Total cargo capacity in tonnes across all hold modules
            (Вместимость per ГЛАВА 7 Table 7.6: Class III = 50 tonnes).
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ShipModule"
          description: |
            Installed modules including the three mandatory ones (BRIDGE,
            REACTOR, DRIVE). Optional modules consume the class module-slot
            budget.
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewSlot"
          description: Crew assignment roster
        problems:
          type: array
          items:
            type: string
          description: |
            List of active ship problems (free-text entries, e.g. damage
            effects or wear-and-tear notes per ГЛАВА 7 wear table).
        history:
          type: ["string", "null"]
          maxLength: 4096
          description: Free-form ship history / background text (Markdown)
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: GM / player operational notes (Markdown)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ShipCreate:
      type: object
      description: |
        Payload for `POST /api/v1/ships`. `name` and `class` are required.
        Server populates base stats from the class table (ST3001 ГЛАВА 7
        Table 7.5) when not explicitly provided. The three mandatory modules
        (BRIDGE, REACTOR, DRIVE) are created automatically.
      required: [name, class]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        class:
          $ref: "#/components/schemas/ShipClass"
        model:
          type: ["string", "null"]
          maxLength: 120
        registry:
          type: ["string", "null"]
          maxLength: 40
        hull:
          type: object
          description: Override base hull stats from class table
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        energy:
          type: object
          description: Override base energy from class table
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        armor:
          type: integer
          minimum: 0
        maneuverability:
          type: integer
        signature:
          type: integer
        speed:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
          maxLength: 4096
        history:
          type: ["string", "null"]
          maxLength: 4096

    ShipUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/ships/{id}`. All fields optional.
        Read-only fields (`id`, `ownerId`, `createdAt`, `updatedAt`) are
        rejected with 400 if present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: ["string", "null"]
          maxLength: 120
        registry:
          type: ["string", "null"]
          maxLength: 40
        hull:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        energy:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0
        armor:
          type: integer
          minimum: 0
        maneuverability:
          type: integer
        signature:
          type: integer
        speed:
          type: integer
          minimum: 0
        problems:
          type: array
          items:
            type: string
          description: Replaces the entire problems list when provided
        history:
          type: ["string", "null"]
          maxLength: 4096
        notes:
          type: ["string", "null"]
          maxLength: 4096

    ShipList:
      type: object
      description: Cursor-paginated list of ships
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ship"
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page; null when this is the last page

    # -------------------------------------------------------------------------
    # System / realtime schemas (unchanged from 0.2.0)
    # -------------------------------------------------------------------------

    HealthStatus:
      type: object
      required: [status, version, uptimeSeconds, dependencies]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        version:
          type: ["string", "null"]
          description: Semantic version of the running backend build
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the backend process started
        dependencies:
          type: object
          required: [db, redis, centrifugo]
          properties:
            db:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            centrifugo:
              $ref: "#/components/schemas/DependencyStatus"

    # -------------------------------------------------------------------------
    # Share links (Epic 6 Feature 6.1)
    # -------------------------------------------------------------------------

    ShareLinkCreate:
      type: object
      description: |
        Request body for creating a share link. All fields are optional; an
        empty object `{}` creates a permanent link without GM notes.
      properties:
        includeGmNotes:
          type: boolean
          default: false
          description: |
            When true, the public character endpoint returns the top-level
            `notes` field. When false (default), `notes` is always null in the
            public response regardless of the character's actual notes value.
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: |
            ISO-8601 instant after which the link stops resolving. Omit or
            set to null for a permanent link.
        label:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            Optional human-readable label to distinguish this link from others
            in the owner's list (e.g. "GM copy", "public preview").

    ShareLink:
      type: object
      description: |
        A share link grants anonymous read-only access to a character via the
        `/api/v1/public/character/{slug}` endpoint.
      required:
        - id
        - slug
        - characterId
        - includeGmNotes
        - revokedAt
        - expiresAt
        - lastViewedAt
        - viewCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Opaque share-link identifier (cuid2). Used for revocation.
        slug:
          type: string
          minLength: 24
          maxLength: 24
          description: |
            24-character URL-safe slug. Use in the public URL:
            `/api/v1/public/character/{slug}`.
        characterId:
          type: string
          description: ID of the character this link exposes.
        includeGmNotes:
          type: boolean
          description: |
            Whether the `notes` field is included in the public character
            response. Always false if not set at creation time.
        label:
          type: ["string", "null"]
          description: Owner-assigned label for this link.
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: Expiry instant. Null for permanent links.
        revokedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            Revocation instant. Null if active. When set, the public endpoint
            returns 410 Gone.
        lastViewedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            ISO-8601 instant of the last recorded public view. Updated
            asynchronously (up to 60 seconds lag) via the view-tracker flush job.
            Null until the first view is flushed.
        viewCount:
          type: integer
          minimum: 0
          description: |
            Cumulative count of public views. Updated asynchronously; may lag
            by up to 60 seconds.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShareLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShareLink"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: ["string", "null"]
          format: uri
          default: about:blank
        title:
          type: ["string", "null"]
        status:
          type: integer
          format: int32
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        code:
          type: ["string", "null"]

    Me:
      type: object
      description: |
        The authenticated user's profile as exposed by the v1 API. Fields
        sourced from the Better Auth `user` table. `deletedAt` is an internal
        soft-delete flag and is never surfaced here — deleted users receive a
        404 because their sessions are revoked at deletion time.
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          description: Opaque user identifier issued by Better Auth (cuid2)
        email:
          type: string
          format: email
          description: Primary email address. Read-only via this API.
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name shown in share-link banners and the avatar
            menu. Null when the user has not set one yet.
        createdAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the account was created. Read-only via this API.
        theme:
          type: string
          enum: [dark, high-contrast]
          default: dark
          description: |
            UI theme preference. Synced across web + mobile so a player who
            toggles high-contrast on one device sees it everywhere.
            `dark` is the default; `high-contrast` increases colour contrast
            for users who need improved readability.

    MeUpdate:
      type: object
      description: |
        Partial update payload for PATCH /api/v1/me. `displayName` and `theme`
        are mutable. Omitting a property leaves the corresponding field unchanged.
        Setting `displayName` to null clears the field.
      properties:
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name. Must be 1–80 characters when non-null.
            Set to null to clear the field.
        theme:
          type: string
          enum: [dark, high-contrast]
          description: |
            UI theme preference. Must be one of `dark` or `high-contrast`.
            Omitting the field preserves the current value.

    # -------------------------------------------------------------------------
    # Game Sessions (Epic 7 Feature 7.2)
    # -------------------------------------------------------------------------

    GameSessionStatus:
      type: string
      enum: [active, archived]
      description: |
        Lifecycle state of a game session.
        - `active` — session is in progress or available.
        - `archived` — session is closed; hidden from the default list.
        Both directions of the transition are permitted.

    GameSession:
      type: object
      description: A campaign session container owned by a GM.
      required: [id, ownerId, name, status, dpCount, characterIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque session identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: User identifier of the GM who owns this session
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Short name for the session
        description:
          type: ["string", "null"]
          maxLength: 600
          description: Optional longer description
        status:
          $ref: "#/components/schemas/GameSessionStatus"
        dpCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Darkness Points counter; mutated by Feature 7.3
        characterIds:
          type: array
          items:
            type: string
          readOnly: true
          description: |
            Character ids assigned to this session. Manage via the join
            endpoint (POST / DELETE on /game-sessions/{id}/characters).
        shipId:
          type: ["string", "null"]
          description: Optional ship linked to the session (Epic 8)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    GameSessionCreate:
      type: object
      description: Payload for creating a new game session
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: ["string", "null"]
          maxLength: 600
        shipId:
          type: ["string", "null"]

    GameSessionUpdate:
      type: object
      description: PATCH payload for a game session — all fields optional
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: ["string", "null"]
          maxLength: 600
        status:
          $ref: "#/components/schemas/GameSessionStatus"
        shipId:
          type: ["string", "null"]

    GameSessionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameSession"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page; null when there are no more results

    AssignCharacterToSession:
      type: object
      required: [characterId]
      properties:
        characterId:
          type: string
          description: Identifier of the character to assign

    # -------------------------------------------------------------------------
    # Darkness Points (Epic 7 Feature 7.3)
    # -------------------------------------------------------------------------

    DpAdjustment:
      type: object
      description: Payload for adjusting Darkness Points on a game session
      required: [delta]
      properties:
        delta:
          type: integer
          minimum: -99
          maximum: 99
          description: |
            Positive to add DP, negative to remove DP. Must be non-zero.
            A negative delta is only accepted from the GM owner of the session.
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional human-readable reason for the adjustment

    DpSource:
      type: string
      enum: [gm-manual, roll-push, system]
      description: |
        Source that originated the DP adjustment.
        - `gm-manual` — GM applied the delta via the HTTP endpoint.
        - `roll-push` — Automatic +1 from a player pushing a roll.
        - `system` — Applied by internal automation.

    DpEvent:
      type: object
      description: A single Darkness Points audit event
      required: [id, gameSessionId, delta, source, createdAt]
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque event identifier (cuid2)
        gameSessionId:
          type: string
          readOnly: true
          description: Session the event belongs to
        delta:
          type: integer
          description: How many DP were added (positive) or removed (negative)
        reason:
          type: ["string", "null"]
          description: Optional human-readable reason
        source:
          $ref: "#/components/schemas/DpSource"
        rollId:
          type: ["string", "null"]
          description: Roll identifier when source is roll-push
        createdAt:
          type: string
          format: date-time
          readOnly: true

    DpEventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DpEvent"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page; null when there are no more results

    RealtimeToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: ["string", "null"]
          description: Short-lived HMAC-signed JWT for Centrifugo
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the token expires

    # -------------------------------------------------------------------------
    # NPC schemas (Phase 6 Block 1)
    # -------------------------------------------------------------------------

    Npc:
      type: object
      description: |
        Full NPC DTO as returned by the v1 API. NPCs are GM-owned entities
        designed to populate encounters in the combat tracker (ST3001
        ГЛАВА 14). They share the same attribute and skill vocabulary as
        player characters but carry no lifecycle state — any NPC can be
        added to any encounter at any time.

        `signature` is the NPC's sensor signature score for ship-combat
        checks (signed integer; 0 is the baseline; negative values make the
        NPC harder to detect). `keySkillModifier` is a signed integer bonus
        that the combat tracker adds to the NPC's signature-derived attack
        or defence pool when computing opposed rolls (ST3001 ГЛАВА 14
        "Key Skill Modifier"). Both default to 0.
      required:
        - id
        - ownerId
        - name
        - attributes
        - skills
        - hp
        - mp
        - signature
        - armor
        - weapons
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque NPC identifier (cuid2)
        ownerId:
          type: string
          readOnly: true
          description: Identifier of the owning user (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: NPC name (1–120 characters)
        description:
          type: ["string", "null"]
          maxLength: 2000
          description: Free-form GM notes or narrative description (Markdown, max 2000 chars)
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          description: Hit points — both current and max are GM-editable for NPCs
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Current hit points
            max:
              type: integer
              minimum: 1
              description: Maximum hit points
        mp:
          type: object
          description: Mind points — both current and max are GM-editable for NPCs
          required: [current, max]
          properties:
            current:
              type: integer
              minimum: 0
              description: Current mind points
            max:
              type: integer
              minimum: 1
              description: Maximum mind points
        signature:
          type: integer
          default: 0
          description: |
            NPC sensor signature for ship-combat sensor checks (ST3001
            ГЛАВА 14). Signed integer; 0 is baseline; negative makes the
            NPC harder to detect; positive makes them easier.
        keySkillModifier:
          type: integer
          default: 0
          description: |
            Signed integer bonus applied by the combat tracker to the NPC's
            attack or defence roll pool when resolving opposed key-skill
            checks (ST3001 ГЛАВА 14). Positive values give the NPC an
            advantage; negative values impose a penalty.
        armor:
          type: array
          items:
            $ref: "#/components/schemas/ItemArmor"
          description: Armor items carried by the NPC
        weapons:
          type: array
          items:
            $ref: "#/components/schemas/ItemWeapon"
          description: Weapons carried by the NPC
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          description: |
            Free-form GM-side categorisation labels (e.g. "Pirate",
            "Cyborg", "Boss"). Used for filtering in the NPC list and for
            encounter-table grouping. Each tag is a 1–40 character string.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    NpcCreate:
      type: object
      description: |
        Payload for `POST /api/v1/npcs`. Only `name` is required; all
        other fields are optional. The server seeds sensible defaults for
        any omitted field so that a stub NPC can be created with a single
        field.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: NPC name (1–120 characters)
        description:
          type: ["string", "null"]
          maxLength: 2000
          description: Free-form description (Markdown, max 2000 chars)
        attributes:
          $ref: "#/components/schemas/Attributes"
          description: Attribute block; missing keys default to 2
        skills:
          $ref: "#/components/schemas/Skills"
          description: Skill block; missing keys default to 0
        hp:
          type: object
          description: "Hit points; defaults to {current: 4, max: 4} when omitted"
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 1
        mp:
          type: object
          description: "Mind points; defaults to {current: 4, max: 4} when omitted"
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 1
        signature:
          type: integer
          default: 0
          description: Sensor signature score; defaults to 0
        keySkillModifier:
          type: integer
          default: 0
          description: Key skill modifier for combat tracker; defaults to 0
        armor:
          type: array
          items:
            $ref: "#/components/schemas/ItemArmor"
          description: Armor items; defaults to empty array
        weapons:
          type: array
          items:
            $ref: "#/components/schemas/ItemWeapon"
          description: Weapons; defaults to empty array
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          description: Categorisation tags; defaults to empty array

    NpcUpdate:
      type: object
      description: |
        Payload for `PATCH /api/v1/npcs/{id}`. All fields are optional;
        omitted fields are left unchanged. Supplying `weapons` or `armor`
        replaces the entire array (put-semantics for nested collections).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 2000
        attributes:
          $ref: "#/components/schemas/Attributes"
        skills:
          $ref: "#/components/schemas/Skills"
        hp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 1
        mp:
          type: object
          properties:
            current:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 1
        signature:
          type: integer
        keySkillModifier:
          type: integer
        armor:
          type: array
          items:
            $ref: "#/components/schemas/ItemArmor"
        weapons:
          type: array
          items:
            $ref: "#/components/schemas/ItemWeapon"
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40

    NpcList:
      type: object
      description: Cursor-paginated list of NPCs
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Npc"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page; null when there are no more results

    # -------------------------------------------------------------------------
    # Encounter schemas (Phase 6 Block 2)
    # -------------------------------------------------------------------------

    EncounterStatus:
      type: string
      enum: [setup, active, ended]
      description: |
        Lifecycle state of an encounter (combat tracker).

        - `setup` — the GM is building the encounter. Combatants can be
          added or removed freely. Initiative has not been rolled. `round`
          is 0 and `activeCombatantId` is null.
        - `active` — combat has started. Initiative is rolled, turn order
          is locked. `round` is bumped to 1 on the `setup → active`
          transition and advances with each full rotation. `activeCombatantId`
          points to the combatant whose turn it is. Combatant mutations are
          only possible through the GM-driven turn-advance and
          initiative-reorder operations (Block 4).
        - `ended` — combat is resolved. The encounter is read-only history.
          `activeCombatantId` is reset to null.

        **Allowed transitions:** `setup → active`, `active → ended`.
        No reverse transitions and no skipping states are permitted.
        Historical (`ended`) encounters are archived and immutable.

    Encounter:
      type: object
      description: |
        A single combat encounter owned by a game session. The Encounter
        carries the combat metadata (status, round, active turn) but does
        NOT embed the combatant list — combatants live on a separate
        sub-resource added in Block 3.
      required:
        - id
        - gameSessionId
        - name
        - status
        - round
        - activeCombatantId
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque encounter identifier (cuid2)
        gameSessionId:
          type: string
          readOnly: true
          description: Identifier of the parent game session (cuid2)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Short descriptive name for the encounter (1–80 characters)
        status:
          $ref: "#/components/schemas/EncounterStatus"
        round:
          type: integer
          minimum: 0
          default: 0
          description: |
            Current combat round. Starts at 0 while in `setup`. Bumped to 1
            when the encounter transitions to `active`. Increments by 1 each
            time the turn order wraps back to the first combatant (Block 4
            turn-advance operation).
        activeCombatantId:
          type: ["string", "null"]
          description: |
            Identifier of the combatant whose turn it currently is. Null
            when `status` is `setup` (initiative not yet rolled) or `ended`
            (combat closed). Set by the server on the `setup → active`
            transition and updated by the turn-advance operation (Block 4).
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: |
            Optional GM notes for the encounter in Markdown format
            (max 4096 characters). May be edited at any status.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EncounterCreate:
      type: object
      description: |
        Payload for `POST /api/v1/game-sessions/{sessionId}/encounters`.
        Only `name` is required. The server seeds `status: setup`,
        `round: 0`, and `activeCombatantId: null`.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Short descriptive name for the encounter (1–80 characters)
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: Optional GM notes in Markdown (max 4096 characters)

    EncounterUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/encounters/{id}`. All fields are
        optional; omitted fields are left unchanged.

        Supplying `status` triggers a state-machine transition validated by
        the server. See the endpoint description for the full transition
        table and the 422 error codes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Rename the encounter (allowed at any status)
        status:
          $ref: "#/components/schemas/EncounterStatus"
        notes:
          type: ["string", "null"]
          maxLength: 4096
          description: Update GM notes in Markdown (allowed at any status)

    EncounterList:
      type: object
      description: Cursor-paginated list of encounters
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Encounter"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page; null when there are no more results

    # -------------------------------------------------------------------------
    # Combatant schemas (Phase 6 Block 3)
    # -------------------------------------------------------------------------

    CombatantType:
      type: string
      enum: [pc, npc]
      description: |
        Discriminator field that identifies the source entity type of a combatant.

        - `pc` — references an existing `Character` owned by the encounter's GM
          (or assigned to the parent `GameSession`).
        - `npc` — references an existing `Npc` owned by the GM.

    Combatant:
      type: object
      description: |
        A single participant in a combat encounter. Combatants store a snapshot
        of the source entity's stats (HP, armor, signature) at the moment of
        add. Mid-combat changes to the source PC's hp via the character sheet
        do NOT propagate to the combatant; the GM mutates `hpCurrent` directly
        on the combatant via `PATCH /api/v1/combatants/{id}`. This protects the
        tracker from accidental scrambling when a player auto-saves their sheet
        during combat.

        `statusFlags` is intentionally a free-form `string[]` — see the field
        description for the canonical values listed in ST3001 ГЛАВА 5 «Раунды,
        ходы и инициатива» and the rationale for not enum-locking it.
      required:
        - id
        - encounterId
        - combatantType
        - sourceId
        - displayName
        - initiative
        - turnOrder
        - hpCurrent
        - hpMax
        - armor
        - signature
        - statusFlags
        - notes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque combatant identifier (cuid2)
        encounterId:
          type: string
          readOnly: true
          description: Identifier of the parent encounter (cuid2)
        combatantType:
          $ref: "#/components/schemas/CombatantType"
        sourceId:
          type: string
          readOnly: true
          description: |
            Identifier of the source entity. When `combatantType` is `pc` this
            is the `Character.id`; when `npc` it is the `Npc.id`.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Denormalised name of the combatant, copied from the source entity's
            `name` at add-time. Can be overridden in `CombatantCreate.displayName`
            or updated via `PATCH`.
        initiative:
          type: ["integer", "null"]
          minimum: 1
          maximum: 6
          description: |
            d6 initiative result (1–6 per ST3001 ГЛАВА 5 «Раунды, ходы и
            инициатива»: «Бросьте по кубику за всех участников сражения»).
            Null until the encounter's initiative is rolled (Block 4
            operation). Set server-side only.
          readOnly: true
        turnOrder:
          type: ["integer", "null"]
          minimum: 0
          description: |
            0-based index in the turn sequence after initiative is sorted.
            Null until initiative is rolled. Combatant at index 0 goes first.
            Set server-side only.
          readOnly: true
        hpCurrent:
          type: integer
          description: Current hit points. May go below 0 (CT3001 does not clamp).
        hpMax:
          type: integer
          minimum: 1
          description: Maximum hit points snapshotted from the source at add-time.
        armor:
          type: integer
          minimum: 0
          description: Armor rating (number of armor dice). Snapshotted from the source at add-time.
        signature:
          type: integer
          description: |
            Mystic Darkness signature value. Defaults to 0 for PC combatants;
            copied from `Npc.signature` for NPC combatants at add-time.
        statusFlags:
          type: array
          items:
            type: string
          description: |
            Free-form short tags describing combat status conditions. The
            canonical taxonomy in ST3001 ГЛАВА 5 «Раунды, ходы и инициатива»
            covers `incapacitated` (HP at 0 — cannot act), `prone` (knocked
            down) and `covered` (behind cover for armor purposes). The field
            is intentionally not enum-locked: GMs are expected to invent
            scene-specific tags (e.g. `bleeding`, `restrained`, `zero-g`),
            and a hard schema would force migrations every time a campaign
            needs a new condition. Clients SHOULD render the canonical tags
            with icons; unknown tags MUST be shown as plain text and
            preserved on PATCH round-trips.
          example: [incapacitated]
        notes:
          type: ["string", "null"]
          maxLength: 500
          description: Optional GM notes for this combatant in Markdown format (max 500 characters).
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example:
        id: cuid_comb01
        encounterId: cuid_enc01
        combatantType: pc
        sourceId: cuid_char01
        displayName: Zara al-Khatib
        initiative: null
        turnOrder: null
        hpCurrent: 4
        hpMax: 4
        armor: 2
        signature: 0
        statusFlags: []
        notes: null
        createdAt: "2026-05-10T09:00:00Z"
        updatedAt: "2026-05-10T09:00:00Z"

    CombatantCreate:
      type: object
      description: |
        POST payload for `POST /api/v1/encounters/{id}/combatants`.

        `combatantType` and `sourceId` are required. The server snapshots
        `hpCurrent`, `hpMax`, `armor`, and `signature` from the source entity
        on add; these fields are absent from the request payload and populated
        in the response. `initiative` and `turnOrder` are server-controlled and
        remain null until the Block 4 initiative-roll operation.

        `displayName` is optional — when omitted the server uses the source
        entity's `name` field.

        422 error codes:
        - `COMBATANT_SOURCE_NOT_FOUND` — `sourceId` does not exist
        - `COMBATANT_SOURCE_NOT_OWNED` — caller does not own the source entity
        - `COMBATANT_DUPLICATE` — same `(combatantType, sourceId)` already present
        - `ENCOUNTER_LOCKED_FOR_COMBAT` — encounter is not in `setup` status
      required:
        - combatantType
        - sourceId
      properties:
        combatantType:
          $ref: "#/components/schemas/CombatantType"
        sourceId:
          type: string
          description: |
            Identifier of the source entity. Must be a `Character.id` when
            `combatantType` is `pc`, or an `Npc.id` when `combatantType` is `npc`.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Optional override for the combatant display name. When omitted the
            server copies the source entity's `name`.
        notes:
          type: ["string", "null"]
          maxLength: 500
          description: Optional GM notes in Markdown (max 500 characters).
      example:
        combatantType: npc
        sourceId: cuid_npc01
        displayName: Khorredian Elite Guard

    CombatantUpdate:
      type: object
      description: |
        PATCH payload for `PATCH /api/v1/combatants/{id}`. All fields are
        optional; omitted fields are left unchanged.

        `combatantType` and `sourceId` are immutable and absent from this
        schema. `initiative` and `turnOrder` are read-only and can only be
        set via the Block 4 initiative operations.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Update the combatant display name.
        hpCurrent:
          type: integer
          description: Update current hit points (may go negative).
        armor:
          type: integer
          minimum: 0
          description: Update armor rating.
        signature:
          type: integer
          description: Update the mystic signature value.
        statusFlags:
          type: array
          items:
            type: string
          description: |
            Replace the full set of status flags. Free-form `string[]` per the
            `Combatant.statusFlags` description; canonical tags from ST3001
            ГЛАВА 5 are `incapacitated`, `prone`, `covered` (custom tags are
            allowed and round-tripped untouched).
        notes:
          type: ["string", "null"]
          maxLength: 500
          description: Update GM notes in Markdown (max 500 characters).
        initiative:
          type: ["integer", "null"]
          minimum: 1
          maximum: 6
          readOnly: true
          description: |
            Read-only. Initiative is set exclusively by the Block 4
            initiative-roll operation (d6 per ST3001 ГЛАВА 5). This field is
            listed here for documentation purposes only; any value supplied in
            a PATCH request will be ignored.
        turnOrder:
          type: ["integer", "null"]
          minimum: 0
          readOnly: true
          description: |
            Read-only. Turn order index is set exclusively by the Block 4
            initiative operations. This field is listed here for
            documentation purposes only; any value supplied in a PATCH
            request will be ignored.
      example:
        hpCurrent: 0
        statusFlags: [incapacitated]

    CombatantList:
      type: object
      description: |
        Non-paginated list of combatants for an encounter. Typical encounters
        have fewer than 20 combatants; a pagination cursor would add unnecessary
        complexity for no practical benefit.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Combatant"

    # -------------------------------------------------------------------------
    # Initiative + turn-order schemas (Phase 6 Block 4)
    # -------------------------------------------------------------------------

    InitiativeRollResult:
      type: object
      description: |
        Returned by `POST /api/v1/encounters/{id}/initiative/roll` and
        `PATCH /api/v1/encounters/{id}/initiative`. Carries the full combatant
        list after initiative values and turn-order indices have been assigned,
        plus the current round counter.

        **Tie-breaking rule (ST3001):** when two combatants share the same d10
        initiative roll the server breaks the tie by `agility` descending — the
        source PC's `attributes.agility` for `pc` combatants, or
        `npcSnapshot.agility` for `npc` combatants. If `agility` is also equal
        the GM is expected to use the `PATCH /api/v1/encounters/{id}/initiative`
        reorder operation to set the final order manually.

        **Side-effects of `rollInitiative`:**
        1. Encounter status transitions `setup → active`.
        2. `encounter.round` is set from 0 to 1.
        3. `encounter.activeCombatantId` is set to the combatant at `turnOrder: 0`.
        The `PATCH` (reorder) variant does NOT re-roll dice and does NOT alter
        `activeCombatantId` — the GM is adjusting who acts next round, not
        restarting combat.
      required:
        - combatants
        - round
      properties:
        combatants:
          type: array
          description: |
            Full updated combatant list sorted by `turnOrder` ascending (0 = acts
            first). Every combatant carries a non-null `initiative` and `turnOrder`
            after this operation.
          items:
            $ref: "#/components/schemas/Combatant"
        round:
          type: integer
          minimum: 1
          description: |
            Current combat round after the operation. For `rollInitiative` this
            is always 1 (the `setup → active` transition sets `round` from 0 to 1).
            For `reorderInitiative` this reflects the encounter's current round
            (unchanged by a reorder).
      example:
        round: 1
        combatants:
          - id: cuid_comb03
            encounterId: cuid_enc01
            combatantType: npc
            sourceId: cuid_npc01
            displayName: Khorredian Elite Guard
            initiative: 6
            turnOrder: 0
            hpCurrent: 6
            hpMax: 6
            armor: 3
            signature: 1
            statusFlags: []
            notes: null
            createdAt: "2026-05-10T09:00:00Z"
            updatedAt: "2026-05-10T10:00:00Z"
          - id: cuid_comb01
            encounterId: cuid_enc01
            combatantType: pc
            sourceId: cuid_char01
            displayName: Zara al-Khatib
            initiative: 5
            turnOrder: 1
            hpCurrent: 4
            hpMax: 4
            armor: 2
            signature: 0
            statusFlags: []
            notes: null
            createdAt: "2026-05-10T09:00:00Z"
            updatedAt: "2026-05-10T10:00:00Z"
          - id: cuid_comb02
            encounterId: cuid_enc01
            combatantType: pc
            sourceId: cuid_char02
            displayName: Tariq al-Asari
            initiative: 4
            turnOrder: 2
            hpCurrent: 5
            hpMax: 5
            armor: 1
            signature: 0
            statusFlags: []
            notes: null
            createdAt: "2026-05-10T09:00:00Z"
            updatedAt: "2026-05-10T10:00:00Z"
          - id: cuid_comb04
            encounterId: cuid_enc01
            combatantType: npc
            sourceId: cuid_npc02
            displayName: Khorredian Guard Captain
            initiative: 2
            turnOrder: 3
            hpCurrent: 8
            hpMax: 8
            armor: 4
            signature: 2
            statusFlags: []
            notes: "Has the bridge key."
            createdAt: "2026-05-10T09:00:00Z"
            updatedAt: "2026-05-10T10:00:00Z"

    InitiativeReorderRequest:
      type: object
      description: |
        Request body for `PATCH /api/v1/encounters/{id}/initiative`. The GM
        supplies the full desired turn order as an ordered array of combatant
        ids. The server reassigns `turnOrder` indices (0-based) matching the
        array position.

        **Validation — the array must contain every combatant id from the
        encounter exactly once.** Any violation returns 422 with one of:
        - `INITIATIVE_INCOMPLETE` — at least one combatant id from the encounter
          is absent from the array.
        - `INITIATIVE_DUPLICATE` — the same id appears two or more times.
        - `INITIATIVE_UNKNOWN_COMBATANT` — an id in the array does not belong to
          this encounter.

        The `PATCH` does NOT re-roll initiative dice and does NOT change
        `activeCombatantId` — it only rearranges the turn-order index so the
        GM can correct ties or unexpected results without restarting combat.
      required:
        - combatantIds
      properties:
        combatantIds:
          type: array
          description: |
            Ordered list of combatant ids. Position 0 acts first. Must include
            every combatant in the encounter exactly once.
          items:
            type: string
          minItems: 1
      example:
        combatantIds:
          - cuid_comb03
          - cuid_comb02
          - cuid_comb01
          - cuid_comb04

    TurnAdvanceResult:
      type: object
      description: |
        Returned by `POST /api/v1/encounters/{id}/turn/advance`. Identifies the
        combatant whose turn is now active after the advance, the current round
        counter, and whether advancing wrapped past the last combatant (which
        triggers a round increment).

        **Wrap behaviour:** the server advances
        `activeCombatantId` from the current `turnOrder` index to
        `(currentIndex + 1) % combatants.length`. When `currentIndex + 1`
        equals `combatants.length` the turn wraps to index 0 and `round` is
        incremented by 1; `isNewRound` is `true` in that case.
      required:
        - activeCombatantId
        - round
        - isNewRound
      properties:
        activeCombatantId:
          type: string
          description: |
            Id of the combatant whose turn is now active (the new
            `encounter.activeCombatantId` after the advance).
        round:
          type: integer
          minimum: 1
          description: |
            Current combat round after the advance. Incremented by 1 when the
            turn wraps from the last combatant back to index 0.
        isNewRound:
          type: boolean
          description: |
            `true` when the advance wrapped past the last combatant and started
            a new round; `false` when the next combatant is within the same
            round.
      example:
        activeCombatantId: cuid_comb01
        round: 1
        isNewRound: false
