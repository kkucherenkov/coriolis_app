          enum: [GEAR]
        name:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0
          description: Encumbrance weight in slots
        quantity:
          type: integer
          minimum: 1
          description: Number of units
        notes:
          type: ["string", "null"]
          description: Optional free-text notes
      example:
        type: GEAR
        name: Medkit
