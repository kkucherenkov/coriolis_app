  /api/v1/characters/{id}/items:
    post:
      operationId: addCharacterItem
      summary: Add an item to a character's inventory
      description: |
        Creates an item of the specified `type` under the character. The
        discriminator field `type` determines which additional fields are
        accepted and required. `id` is assigned by the server.
      tags: [characters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
            examples:
              addWeapon:
                value:
                  type: WEAPON
                  name: Vulcan Carbine
                  damage: 2
                  range: short
                  bonus: 2
                  crit: 2
                  weight: 0.8
                  features: []
                  equipped: true
              addGear:
                value:
                  type: GEAR
                  name: Medkit
                  weight: 0.5
                  quantity: 1
                  notes: Standard field medkit
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
              examples:
                created:
                  value:
                    id: cuid_item02
                    type: WEAPON
                    name: Vulcan Carbine
                    damage: 2
                    range: short
                    bonus: 2
                    crit: 2
                    weight: 0.8
                    features: []
                    equipped: true
        "400":
          description: |
            Validation error. Possible codes:
            - `CHARACTER_NAME_EMPTY` — item name is empty.
            - `ITEM_TYPE_MISMATCH` — payload fields do not match the declared type.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                typeMismatch:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: Fields damage/range are not valid for item type GEAR
                    instance: /api/v1/characters/cuid_tariq01/items
                    code: ITEM_TYPE_MISMATCH
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
