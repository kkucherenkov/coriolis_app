  /api/v1/ships/{id}/crew:
    post:
      operationId: assignCrew
      summary: Assign a character to a crew position
      description: |
        Assigns one of the caller's own characters to a crew position on the
        ship. The ship must be owned by the caller. The character must also
        be owned by the caller (returns `CHARACTER_NOT_OWNED` otherwise).
        Returns `CREW_POSITION_TAKEN` if that position is already filled.
      tags: [ships]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, characterId]
              properties:
                position:
                  $ref: "#/components/schemas/CrewPosition"
                characterId:
                  type: string
                  description: ID of the character to assign (must be owned by caller)
            examples:
              assignCaptain:
                value:
                  position: captain
                  characterId: cuid_tariq01
              assignEngineer:
                value:
                  position: engineer
                  characterId: cuid_nox01
      responses:
        "201":
          description: Crew member assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewSlot"
              examples:
                assigned:
                  value:
                    position: captain
                    assignedCharacterId: cuid_tariq01
        "400":
          description: |
            Validation error. Possible codes:
            - `CREW_POSITION_TAKEN` — that position is already occupied.
            - `CHARACTER_NOT_FOUND` — characterId does not exist.
            - `CHARACTER_NOT_OWNED` — character is not owned by the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                positionTaken:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: Position captain is already assigned on this ship
                    instance: /api/v1/ships/cuid_ship01/crew
                    code: CREW_POSITION_TAKEN
