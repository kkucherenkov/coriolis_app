  # ---------------------------------------------------------------------------
  # Ships
  # ---------------------------------------------------------------------------

  /api/v1/ships:
    get:
      operationId: listShips
      summary: List the authenticated user's ships
      description: |
        Returns a cursor-paginated list of ships owned by the authenticated
        user. Pass `cursor` from a previous response's `nextCursor` to retrieve
        the following page. Results are ordered newest-first by `createdAt`.
      tags: [ships]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by the previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of ships to return (1–100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated ship list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipList"
              examples:
                ok:
                  value:
                    items:
                      - id: cuid_ship01
                        ownerId: cuid_user01
                        name: Madara
                        class: light-freighter
                        model: Helebian Class III freighter
                        registry: KUA-7741-M
                        hull:
                          current: 6
                          max: 6
                        energy:
                          current: 4
                          max: 5
                        armor: 5
                        maneuverability: 0
                        signature: 0
                        speed: 2
                        cargoCapacity: 50
                        modules: []
                        crew: []
                        problems: []
                        history: null
                        notes: null
                        createdAt: "2026-01-15T10:00:00Z"
                        updatedAt: "2026-04-01T15:00:00Z"
                    nextCursor: null
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    post:
      operationId: createShip
      summary: Create a new ship
      description: |
        Creates a ship owned by the authenticated user. `name` and `class` are
        required; all other fields default to class-appropriate values per
        ST3001 ГЛАВА 7 Table 7.5. Server assigns `id`, `ownerId`, `createdAt`,
        `updatedAt`.
      tags: [ships]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipCreate"
            examples:
              minimal:
                value:
                  name: Narzal
                  class: courier-yacht
              full:
                value:
                  name: Madara
                  class: light-freighter
                  model: Helebian Class III freighter
                  registry: KUA-7741-M
      responses:
        "201":
          description: Ship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
              examples:
                created:
                  value:
                    id: cuid_ship02
                    ownerId: cuid_user01
                    name: Narzal
                    class: courier-yacht
                    model: null
                    registry: null
                    hull:
                      current: 6
                      max: 6
                    energy:
                      current: 5
                      max: 5
                    armor: 5
                    maneuverability: 0
                    signature: 0
                    speed: 2
                    cargoCapacity: 50
                    modules: []
                    crew: []
                    problems: []
                    history: null
                    notes: null
                    createdAt: "2026-05-08T10:00:00Z"
                    updatedAt: "2026-05-08T10:00:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `SHIP_NAME_EMPTY` — name is an empty string.
            - `SHIP_NAME_TOO_LONG` — name exceeds 80 characters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                nameEmpty:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: name must be between 1 and 80 characters
                    instance: /api/v1/ships
                    code: SHIP_NAME_EMPTY
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/ships/{id}:
    get:
      operationId: getShip
      summary: Get a ship by ID
      description: |
        Returns the full Ship DTO. Returns 404 if the ship does not exist or
        is not owned by the authenticated user. Owner-scoped: a ship owned by
