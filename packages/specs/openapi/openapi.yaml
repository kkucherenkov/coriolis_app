openapi: 3.1.0
info:
  title: Coriolis Companion API
  version: 0.2.0
  description: |
    Spec-first HTTP API for the Coriolis Companion App. Paths include the
    versioned prefix (`/api/v1`) so generated clients can be used without
    additional base-URL rewriting.

    **Authentication endpoints** live under `/api/v1/auth/*` and follow the
    [Better Auth protocol](https://www.better-auth.com/docs). They are
    deliberately not enumerated here: Better Auth owns that wire contract and
    evolves it independently of our OpenAPI surface. The `cookieAuth` and
    `bearerAuth` security schemes documented below describe how the *rest* of
    this API accepts credentials issued by that namespace — session cookies
    (web) and bearer tokens (mobile, via the `bearer` plugin).

    Domain endpoints (`/me`, `/characters`, `/ships`, `/sessions`,
    `/encounters`, `/share-links`, …) are added in the phase that needs them
    per `docs/IMPLEMENTATION_PLAN.md`. Phase 0 ships only the system surface
    documented below.
  contact:
    name: Coriolis Companion
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: system
    description: Health and liveness endpoints
  - name: realtime
    description: Centrifugo connection tokens
  - name: users
    description: Authenticated user profile

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health probe
      description: |
        Reports combined health status of the service and its runtime
        dependencies (database, cache, realtime bus).
      tags: [system]
      responses:
        "200":
          description: Service and all dependencies are operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
                    uptimeSeconds: 42
                    dependencies:
                      db: ok
                      redis: ok
                      centrifugo: ok
        "503":
          description: One or more dependencies are degraded or down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                degraded:
                  value:
                    status: degraded
                    version: 0.1.0
                    uptimeSeconds: 42
                    dependencies:
                      db: ok
                      redis: degraded
                      centrifugo: ok

  /api/v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's profile.
      description: |
        Returns the current user's profile fields sourced from the Better Auth
        `user` table. `email` and `createdAt` are read-only in this DTO — they
        are managed by Better Auth and cannot be changed via this endpoint.

        See PRD §4.1 for full product context. Soft-deleted users receive a
        `404` because their sessions are revoked on deletion; this endpoint
        will therefore never return a user whose `deletedAt` is set (that
        field is an internal flag and is not exposed in this DTO).
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                ok:
                  value:
                    id: cuid_01j9zxk5e0000qw3h8m7n6p4r2
                    email: kalim.al-rashid@example.com
                    displayName: Kalim al-Rashid
                    createdAt: "2026-01-15T09:30:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    patch:
      operationId: updateMe
      summary: Update the authenticated user's mutable profile fields.
      description: |
        Applies a partial update (PATCH semantics) to the authenticated user's
        profile. Only `displayName` is mutable via this endpoint.

        `email` and `createdAt` are managed by Better Auth and are silently
        ignored if included in the request body — attempting to send them
        is treated as a `400` so the contract is unambiguous.

        `displayName` constraints:
        - Must be between 1 and 80 characters when non-null (80 matches the
          character-name guidance in PRD §5.2).
        - May be set to `null` to clear the field.
        - An empty string (`""`) is rejected with `400`.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
            examples:
              setDisplayName:
                value:
                  displayName: Kalim al-Rashid
              clearDisplayName:
                value:
                  displayName: null
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                ok:
                  value:
                    id: cuid_01j9zxk5e0000qw3h8m7n6p4r2
                    email: kalim.al-rashid@example.com
                    displayName: Kalim al-Rashid
                    createdAt: "2026-01-15T09:30:00Z"
        "400":
          description: |
            Validation error. Possible cases:
            - `displayName` is an empty string.
            - `displayName` exceeds 80 characters.
            - Request body contains read-only fields (`email`, `createdAt`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                emptyDisplayName:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: displayName must be between 1 and 80 characters
                    instance: /api/v1/me
                    code: DISPLAY_NAME_EMPTY
                displayNameTooLong:
                  value:
                    type: https://coriolis.example.com/problems/validation-error
                    title: Validation Error
                    status: 400
                    detail: displayName must not exceed 80 characters
                    instance: /api/v1/me
                    code: DISPLAY_NAME_TOO_LONG
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/realtime/token:
    post:
      operationId: issueRealtimeToken
      summary: Issue a short-lived Centrifugo connection token
      description: |
        Mints a short-lived HMAC-signed JWT that the client can use to connect
        to Centrifugo. Requires an active Better Auth session (cookie on web,
        bearer token on mobile).
      tags: [realtime]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeToken"
              examples:
                ok:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expiresAt: "2026-04-18T12:05:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth bearer token
  schemas:
    DependencyStatus:
      type: ["string", "null"]
      enum: [ok, degraded, down]

    HealthStatus:
      type: object
      required: [status, version, uptimeSeconds, dependencies]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        version:
          type: ["string", "null"]
          description: Semantic version of the running backend build
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the backend process started
        dependencies:
          type: object
          required: [db, redis, centrifugo]
          properties:
            db:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            centrifugo:
              $ref: "#/components/schemas/DependencyStatus"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: ["string", "null"]
          format: uri
          default: about:blank
        title:
          type: ["string", "null"]
        status:
          type: integer
          format: int32
        detail:
          type: ["string", "null"]
        instance:
          type: ["string", "null"]
        code:
          type: ["string", "null"]

    Me:
      type: object
      description: |
        The authenticated user's profile as exposed by the v1 API. Fields
        sourced from the Better Auth `user` table. `deletedAt` is an internal
        soft-delete flag and is never surfaced here — deleted users receive a
        404 because their sessions are revoked at deletion time.
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          description: Opaque user identifier issued by Better Auth (cuid2)
        email:
          type: string
          format: email
          description: Primary email address. Read-only via this API.
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name shown in share-link banners and the avatar
            menu. Null when the user has not set one yet.
        createdAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the account was created. Read-only via this API.

    MeUpdate:
      type: object
      description: |
        Partial update payload for PATCH /api/v1/me. Only `displayName` is
        mutable. Omitting a property leaves the corresponding field unchanged.
        Setting `displayName` to null clears the field.
      properties:
        displayName:
          type: ["string", "null"]
          minLength: 1
          maxLength: 80
          description: |
            User-chosen display name. Must be 1–80 characters when non-null.
            Set to null to clear the field.

    RealtimeToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: ["string", "null"]
          description: Short-lived HMAC-signed JWT for Centrifugo
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 instant when the token expires
