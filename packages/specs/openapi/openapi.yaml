          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidStatus:
                  summary: Encounter is not active
                  value:
                    type: https://coriolis.example.com/problems/unprocessable
                    title: Invalid encounter status
                    status: 422
                    detail: "Reorder is only allowed during active combat. Current status: setup."
                    instance: /api/v1/encounters/cuid_enc01/initiative
                    code: ENCOUNTER_INVALID_STATUS
                incomplete:
                  summary: Missing combatant id
                  value:
                    type: https://coriolis.example.com/problems/unprocessable
                    title: Incomplete initiative order
                    status: 422
                    detail: "combatantIds is missing id: cuid_comb04. Every combatant must appear exactly once."
                    instance: /api/v1/encounters/cuid_enc01/initiative
                    code: INITIATIVE_INCOMPLETE
                duplicate:
                  summary: Duplicate combatant id
                  value:
                    type: https://coriolis.example.com/problems/unprocessable
                    title: Duplicate combatant id
                    status: 422
                    detail: "cuid_comb01 appears more than once in combatantIds."
                    instance: /api/v1/encounters/cuid_enc01/initiative
                    code: INITIATIVE_DUPLICATE
                unknownCombatant:
                  summary: Unknown combatant id
                  value:
                    type: https://coriolis.example.com/problems/unprocessable
                    title: Unknown combatant
                    status: 422
                    detail: "cuid_comb_unknown does not belong to encounter cuid_enc01."
                    instance: /api/v1/encounters/cuid_enc01/initiative
                    code: INITIATIVE_UNKNOWN_COMBATANT

  /api/v1/encounters/{id}/turn/advance:
    post:
      operationId: advanceTurn
      summary: Advance to the next combatant's turn
      description: |
        Moves `encounter.activeCombatantId` forward by one position in the
        turn order: `(currentIndex + 1) % combatants.length`.

        **Wrap behaviour:** when the advance moves past the last combatant
        (index `combatants.length - 1`), the turn wraps to index 0 and
        `encounter.round` is incremented by 1. `TurnAdvanceResult.isNewRound`
        is `true` in that case.

        **Allowed only while `status` is `active`.** Returns 422
        `ENCOUNTER_INVALID_STATUS` otherwise.

        **Defensive guard:** returns 422 `ENCOUNTER_INITIATIVE_NOT_ROLLED`
        when `activeCombatantId` is null (i.e. initiative was never set,
        which should not be reachable via normal `rollInitiative` flow but is
        possible if a future code path bypasses that operation).

        **Error codes (422):**
        - `ENCOUNTER_INVALID_STATUS` — encounter is not in `active` status.
        - `ENCOUNTER_INITIATIVE_NOT_ROLLED` — `activeCombatantId` is null;
          initiative must be rolled before turns can be advanced.
      tags: [encounters]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "200":
          description: Turn advanced; returns the new active combatant and round info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnAdvanceResult"
              examples:
                midRound:
                  summary: Advance within the same round
                  value:
                    activeCombatantId: cuid_comb01
                    round: 1
                    isNewRound: false
                newRound:
                  summary: Advance wraps to a new round
                  value:
                    activeCombatantId: cuid_comb03
                    round: 2
                    isNewRound: true
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the encounter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own the game session for this encounter
                    instance: /api/v1/encounters/cuid_enc01/turn/advance
                    code: ENCOUNTER_NOT_OWNED
        "404":
          description: Encounter not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Encounter cuid_enc01 does not exist
                    instance: /api/v1/encounters/cuid_enc01/turn/advance
                    code: ENCOUNTER_NOT_FOUND
        "422":
          description: Business rule violation. `code` identifies the specific error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidStatus:
                  summary: Encounter is not active
                  value:
                    type: https://coriolis.example.com/problems/unprocessable
                    title: Invalid encounter status
                    status: 422
                    detail: "Turn advance is only allowed during active combat. Current status: setup."
                    instance: /api/v1/encounters/cuid_enc01/turn/advance
                    code: ENCOUNTER_INVALID_STATUS
                initiativeNotRolled:
                  summary: Initiative not set (defensive guard)
                  value:
                    type: https://coriolis.example.com/problems/unprocessable
                    title: Initiative not rolled
                    status: 422
                    detail: activeCombatantId is null — roll initiative before advancing turns.
                    instance: /api/v1/encounters/cuid_enc01/turn/advance
                    code: ENCOUNTER_INITIATIVE_NOT_ROLLED

  # ---------------------------------------------------------------------------
  # Share links (Epic 6 Feature 6.1)
  # ---------------------------------------------------------------------------

  /api/v1/characters/{id}/share:
    post:
      operationId: createShareLink
      summary: Create a share link for a character
      description: |
        Creates a new share link for the authenticated user's character. The
        link is identified by a 24-character unguessable slug. Multiple links
        per character are allowed — useful for different audiences or different
        `includeGmNotes` settings.

        The optional `label` (1–80 characters) helps the owner distinguish links.
        The optional `expiresAt` is an ISO-8601 instant; omit (or set to null)
        for a permanent link. The optional `includeGmNotes` flag (default false)
        controls whether the top-level `notes` field is included in the public
        character read.
      tags: [sharing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareLinkCreate"
            examples:
              minimal:
                value: {}
              withOptions:
                value:
                  includeGmNotes: true
                  label: GM copy
                  expiresAt: "2027-01-01T00:00:00Z"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
              examples:
                created:
                  value:
                    id: cuid_sl01
                    slug: 3Bk7NzYqAcMpRvWxDjGhTs4Q
                    characterId: cuid_tariq01
                    includeGmNotes: false
                    label: null
                    expiresAt: null
                    revokedAt: null
                    lastViewedAt: null
                    viewCount: 0
                    createdAt: "2026-05-09T10:00:00Z"
                    updatedAt: "2026-05-09T10:00:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this character
                    instance: /api/v1/characters/cuid_tariq01/share
                    code: CHARACTER_NOT_OWNED
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Character cuid_tariq01 does not exist
                    instance: /api/v1/characters/cuid_tariq01/share
                    code: CHARACTER_NOT_FOUND

  /api/v1/characters/{id}/shares:
    get:
      operationId: listShareLinks
      summary: List share links for a character
      description: |
        Returns all non-revoked share links for the authenticated user's
        character, ordered newest-first. Revoked links are excluded by default.
        A `?includeRevoked` query parameter may be added in a future version.
      tags: [sharing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      responses:
        "200":
          description: Share link list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkList"
              examples:
                ok:
                  value:
                    items:
                      - id: cuid_sl01
                        slug: 3Bk7NzYqAcMpRvWxDjGhTs4Q
                        characterId: cuid_tariq01
                        includeGmNotes: false
                        label: null
                        expiresAt: null
                        revokedAt: null
                        lastViewedAt: "2026-05-09T11:30:00Z"
                        viewCount: 42
                        createdAt: "2026-05-09T10:00:00Z"
                        updatedAt: "2026-05-09T11:30:00Z"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own this character
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Character not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/share-links/{id}:
    delete:
      operationId: revokeShareLink
      summary: Revoke a share link
      description: |
        Soft-revokes a share link by setting its `revokedAt` timestamp. After
        revocation, `GET /api/v1/public/character/{slug}` returns 410 Gone.
        The link row is not deleted — historical view counts are preserved.
        The caller must own the character the link belongs to.
      tags: [sharing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareLinkId"
      responses:
        "204":
          description: Share link revoked
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Caller does not own the character associated with this share link
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notOwned:
                  value:
                    type: https://coriolis.example.com/problems/forbidden
                    title: Forbidden
                    status: 403
                    detail: You do not own this share link
                    instance: /api/v1/share-links/cuid_sl01
                    code: SHARE_LINK_NOT_OWNED
        "404":
          description: Share link not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Share link cuid_sl01 does not exist
                    instance: /api/v1/share-links/cuid_sl01
                    code: SHARE_LINK_NOT_FOUND

  # ---------------------------------------------------------------------------
  # Public read endpoints (no auth required)
  # ---------------------------------------------------------------------------

  /api/v1/public/character/{slug}:
    get:
      operationId: getPublicCharacter
      summary: Get a publicly-shared character by slug
      description: |
        Returns the character associated with the given share-link slug.
        No authentication is required.

        The `notes` field (top-level GM notes) is included only when the share
        link was created with `includeGmNotes: true`. If the link does not
        include GM notes, `notes` is always returned as `null` regardless of
        whether the character actually has notes.

        Error semantics:
        - `404` — slug does not exist or was never created.
        - `410` — slug existed but has been revoked or has expired.
      tags: [public]
      parameters:
        - $ref: "#/components/parameters/ShareSlug"
      responses:
        "200":
          description: Publicly-shared character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
              examples:
                ok:
                  value:
                    id: cuid_tariq01
                    ownerId: cuid_user01
                    name: Tariq al-Asari
                    concept: pilot
                    iconId: traveler
                    upbringing: stationary
                    origin: Cinder Quarter, Coriolis Station
                    reputation: 4
                    startingWealth: 1000
                    crewConcept: free-trader
                    mutant: false
                    mutantLineage: null
                    attributes:
                      strength: 3
                      agility: 5
                      wits: 4
                      empathy: 3
                    skills:
                      dexterity: 4
                      force: 1
                      infiltration: 3
                      manipulation: 2
                      meleeCombat: 1
                      observation: 4
                      rangedCombat: 3
                      survival: 2
                      command: 2
                      culture: 1
                      dataDjinn: 2
                      medicurgy: 0
                      mysticPowers: 0
                      pilot: 5
                      science: 1
                      technology: 3
                    hp:
                      current: 11
                      max: 8
                    mp:
                      current: 8
                      max: 7
                    encumbrance:
                      current: 2.0
                      max: 6
                    experience: 12
                    conditions:
                      exhausted: false
                      sleepless: true
                      thirsty: true
                      hungry: false
                    criticalInjuries: []
                    talents: []
                    relationships: []
                    inventory: []
                    notes: null
                    status: active
                    createdAt: "2026-01-15T09:30:00Z"
                    updatedAt: "2026-04-01T14:22:00Z"
        "404":
          description: Slug not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://coriolis.example.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: Share link 3Bk7NzYqAcMpRvWxDjGhTs4Q does not exist
                    instance: /api/v1/public/character/3Bk7NzYqAcMpRvWxDjGhTs4Q
                    code: SHARE_LINK_NOT_FOUND
        "410":
          description: Share link revoked or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
