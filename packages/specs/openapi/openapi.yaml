  /api/v1/npcs:
    get:
      operationId: listNpcs
      summary: List the authenticated user's NPCs
      description: |
        Returns a cursor-paginated list of NPCs owned by the authenticated
        user. Pass `cursor` from a previous response's `nextCursor` to
        retrieve the following page. Results are ordered newest-first by
        `createdAt`. Optionally filter by `tag` (exact match against any
        element of the NPC's `tags` array).
      tags: [npcs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by the previous page
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of NPCs to return (1–100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: tag
          in: query
          required: false
          description: Filter NPCs that have this tag (exact match, case-sensitive)
          schema:
            type: string
      responses:
        "200":
          description: Paginated NPC list
