                  name: The Long Night
                  description: A campaign set in the Kua system.
                  shipId: cuid_ship01
      responses:
        "201":
          description: Game session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
              examples:
                created:
                  value:
                    id: cuid_gs01
                    ownerId: cuid_user01
                    name: The Long Night
                    description: A campaign set in the Kua system.
                    status: active
                    dpCount: 0
                    characterIds: []
                    shipId: null
                    createdAt: "2026-05-08T10:00:00Z"
                    updatedAt: "2026-05-08T10:00:00Z"
        "400":
          description: |
            Validation error. Possible codes:
            - `GAME_SESSION_NAME_EMPTY` — name is an empty string.
            - `GAME_SESSION_NAME_TOO_LONG` — name exceeds 80 characters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No active session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

